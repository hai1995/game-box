<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fff6e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="游戏盒子">
<meta name="description" content="小朋友的游戏盒子，点开就能玩！">
<title>🎮 游戏盒子</title>
<style>
  :root {
    --ink: #3b2f2f;
    --sub: #8b7d7d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, #fff6e5 0%, #ffeaf1 55%, #e9f4ff 100%);
    background-attachment: fixed;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* 背景漂浮装饰 */
  .floaties { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .floaties span { position: absolute; font-size: 26px; opacity: .3; animation: drift 9s ease-in-out infinite; }
  .floaties .f1 { top: 12%; left: 8%;  animation-delay: 0s; }
  .floaties .f2 { top: 22%; right: 10%; animation-delay: 1.5s; font-size: 20px; }
  .floaties .f3 { top: 68%; left: 6%;  animation-delay: 3s;   font-size: 20px; }
  .floaties .f4 { top: 80%; right: 8%; animation-delay: 2.2s; }
  @keyframes drift {
    0%, 100% { transform: translateY(0) rotate(-6deg); }
    50%      { transform: translateY(-14px) rotate(8deg); }
  }

  .page {
    position: relative; z-index: 1;
    max-width: 720px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 26px) 16px calc(env(safe-area-inset-bottom) + 28px);
  }

  /* 顶部标题（紧凑） */
  .hero { text-align: center; margin-bottom: 26px; animation: rise .5s ease both; }
  .hero .logo {
    font-size: 48px; line-height: 1;
    filter: drop-shadow(0 6px 10px rgba(255, 150, 80, .35));
    animation: bob 3s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50%      { transform: translateY(-7px) rotate(4deg); }
  }
  .hero h1 {
    margin: 8px 0 4px;
    font-size: clamp(26px, 7vw, 34px);
    letter-spacing: 2px;
    background: linear-gradient(90deg, #ff7a59, #ffb03a, #38c6a0);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .hero p { margin: 0; color: var(--sub); font-size: 13px; }

  /* 图标网格：手机一行三个 */
  .games {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px 12px;
    max-width: 480px;
    margin: 0 auto;
  }
  @media (min-width: 700px) {
    .games { gap: 30px 24px; max-width: 600px; }
  }

  .app {
    display: flex; flex-direction: column; align-items: center; gap: 9px;
    text-decoration: none; color: inherit;
    animation: rise .5s ease both;
  }
  .app:nth-child(1) { animation-delay: .06s; }
  .app:nth-child(2) { animation-delay: .14s; }
  .app:nth-child(3) { animation-delay: .22s; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* App 图标本体 */
  .app-icon {
    width: 100%; max-width: 92px; aspect-ratio: 1 / 1;
    border-radius: 24px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 16px rgba(120, 90, 90, .2), inset 0 2px 6px rgba(255,255,255,.5);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .app-icon .em {
    font-size: 46px; line-height: 1;
    filter: drop-shadow(0 4px 5px rgba(0,0,0,.2));
    animation: floatEm 3.5s ease-in-out infinite;
  }
  @keyframes floatEm {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50%      { transform: translateY(-7px) rotate(5deg); }
  }
  .app:active .app-icon { transform: scale(.92); }
  @media (hover: hover) {
    .app:hover .app-icon { transform: translateY(-5px); box-shadow: 0 14px 24px rgba(120, 90, 90, .26); }
  }

  .app-name {
    font-size: clamp(12px, 3.4vw, 14px); font-weight: 700;
    text-align: center; line-height: 1.3;
  }

  .c-flight { background: linear-gradient(135deg, #4facfe 0%, #00c6ff 100%); }
  .c-hero   { background: linear-gradient(135deg, #ff8a5b 0%, #ffca5b 100%); }
  .c-train  { background: linear-gradient(135deg, #43c97b 0%, #38d8c0 100%); }

  footer { text-align: center; margin-top: 30px; color: var(--sub); font-size: 12px; }
  footer .heart { color: #ff6b81; }
</style>
</head>
<body>

<div class="floaties" aria-hidden="true">
  <span class="f1">⭐</span>
  <span class="f2">☁️</span>
  <span class="f3">🍓</span>
  <span class="f4">🌟</span>
</div>

<div class="page">
  <header class="hero">
    <div class="logo">🎮</div>
    <h1>游戏盒子</h1>
    <p>选一个喜欢的游戏，点开就能玩啦！</p>
  </header>

  <main class="games">
    <a class="app" href="games/flight-adventure/index.html" aria-label="打开 3D 飞行大冒险">
      <div class="app-icon c-flight"><span class="em">✈️</span></div>
      <div class="app-name">3D 飞行<br>大冒险</div>
    </a>

    <a class="app" href="games/little-hero/index.html" aria-label="打开 小英雄打怪兽">
      <div class="app-icon c-hero"><span class="em">👑</span></div>
      <div class="app-name">小英雄<br>打怪兽</div>
    </a>

    <a class="app" href="games/little-train/index.html" aria-label="打开 小火车呜呜开">
      <div class="app-icon c-train"><span class="em">🚂</span></div>
      <div class="app-name">小火车<br>呜呜开</div>
    </a>
  </main>

  <footer>
    用满满的爱制作 <span class="heart">❤</span> · 祝小朋友玩得开心
  </footer>
</div>

</body>
</html>
