<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>🧱 打砖块</title>
<link rel="stylesheet" href="../../theme.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; min-height:100%; overflow-x:hidden; font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
  body { background:linear-gradient(160deg,#fff0f6 0%,#eef0ff 55%,#e9fbff 100%); background-attachment:fixed; color:#3b2f2f; padding-bottom:calc(26px + env(safe-area-inset-bottom)); }
  .home-btn { position:fixed; left:12px; top:calc(12px + env(safe-area-inset-top)); z-index:30;
    width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,.92);
    border:3px solid #ffb703; box-shadow:0 4px 0 rgba(0,0,0,.14); color:#d62828;
    display:flex; align-items:center; justify-content:center; font-size:26px; text-decoration:none; }
  .home-btn:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.14); }
  .hero { text-align:center; padding:calc(20px + env(safe-area-inset-top)) 12px 4px; }
  .hero .logo { font-size:46px; animation:bob 3s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0) rotate(-5deg)} 50%{transform:translateY(-7px) rotate(5deg)} }
  .hero h1 { font-size:clamp(22px,6vw,30px); margin:4px 0; color:#e91e63; }
  .hero p { font-size:13px; color:#8b7d7d; }
  .bar { display:flex; justify-content:center; gap:12px; margin:10px 0 12px; flex-wrap:wrap; }
  .pill { background:#fff; border:3px solid #f8bbd0; border-radius:999px; padding:7px 16px;
    font-size:16px; font-weight:800; color:#c2185b; box-shadow:0 4px 0 #f48fb1; white-space:nowrap; }
  .wrap { max-width:500px; margin:0 auto; padding:0 12px; text-align:center; }
  .boardwrap { display:inline-block; padding:8px; border-radius:16px; background:linear-gradient(180deg,#f8bbd0,#f06292);
    box-shadow:0 8px 18px rgba(180,60,110,.3); }
  canvas { display:block; border-radius:10px; background:#1b1b3a; touch-action:none; }
  .hint { font-size:13px; color:#8b7d7d; margin-top:12px; }
  .newbtn { display:block; margin:14px auto 0; border:none; border-radius:999px; padding:12px 34px;
    font-size:18px; font-weight:900; color:#fff; background:linear-gradient(180deg,#ff8fab,#ff6b81);
    box-shadow:0 6px 0 #e84d68; cursor:pointer; }
  .newbtn:active { transform:translateY(3px); box-shadow:0 3px 0 #e84d68; }
  .overlay { position:fixed; inset:0; z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92); backdrop-filter:blur(4px); text-align:center; padding:20px; }
  .overlay.hidden { display:none; }
  .overlay .big { font-size:76px; animation:pop .6s ease; }
  @keyframes pop { 0%{transform:scale(.6)} 60%{transform:scale(1.15)} 100%{transform:scale(1)} }
  .overlay h2 { font-size:30px; color:#e91e63; margin:8px 0; }
  .overlay p { font-size:18px; color:#6d6262; margin:6px 0 20px; }
  .overlay .btn { border:none; border-radius:999px; padding:14px 40px; font-size:22px; font-weight:900; color:#fff;
    background:linear-gradient(180deg,#ff8fab,#ff6b81); box-shadow:0 6px 0 #e84d68; cursor:pointer; }
</style>
</head>
<body>
<a class="home-btn" href="../../" aria-label="返回主页" title="返回主页">🏠</a>

<header class="hero">
  <div class="logo">🧱</div>
  <h1>打砖块</h1>
  <p>拖动挡板接住小球，把所有彩色砖块打光就过关啦！</p>
</header>

<div class="bar">
  <div class="pill">🏆 得分 <span id="score">0</span></div>
  <div class="pill">❤️ 生命 <span id="lives">3</span></div>
  <div class="pill">🎯 第 <span id="level">1</span> 关</div>
</div>

<div class="wrap">
  <div class="boardwrap"><canvas id="board"></canvas></div>
  <div class="hint">👆 手指在画面上左右滑动移动挡板，也可以按 ← → 键</div>
  <button class="newbtn" id="newBtn">🔄 重新开始</button>
</div>

<div class="overlay" id="startScreen">
  <div class="big">🧱🏓</div>
  <h2>打砖块！</h2>
  <p>接住小球，打光所有砖块～</p>
  <button class="btn" id="startBtn">开始游戏 ▶</button>
</div>
<div class="overlay hidden" id="overlay">
  <div class="big" id="ovIcon">🎉</div>
  <h2 id="ovTitle">过关啦！</h2>
  <p id="ovText"></p>
  <button class="btn" id="ovBtn">继续</button>
</div>

<script src="../../icons.js"></script>
<script src="../../quiz.js"></script>
<script src="../../save.js"></script>
<script>
(function () {
  "use strict";
  var W = 320, H = 420;
  var canvas = document.getElementById("board"), ctx = canvas.getContext("2d");
  var scoreEl = document.getElementById("score"), livesEl = document.getElementById("lives"), levelEl = document.getElementById("level");
  var startScreen = document.getElementById("startScreen"), overlay = document.getElementById("overlay");
  var ovIcon = document.getElementById("ovIcon"), ovTitle = document.getElementById("ovTitle"), ovText = document.getElementById("ovText"), ovBtn = document.getElementById("ovBtn");
  var COLORS = ["#ff5252","#ff9100","#ffd600","#69f0ae","#40c4ff","#b388ff"];
  var ROWS = 5, COLS = 7, brickW = 0, brickH = 22, padW = 64, padH = 12;
  var bricks = [], ball = { x: W/2, y: H-40, vx: 2.6, vy: -3.4, r: 6 };
  var SAVE_KEY = "breakout";
  var BEST_KEY = "breakoutBest";
  var saved = window.GameSave ? GameSave.load(SAVE_KEY, null) : null;
  var savedBest = window.GameSave ? GameSave.load(BEST_KEY, null) : null;
  // 历史最高分：兼容旧存档里可能存在的 best 字段，取各处最大值，任何结构变化都不清零
  var oldBestRaw = 0;
  try { oldBestRaw = parseInt(localStorage.getItem("gbBreakoutBest"), 10) || 0; } catch (e) {}
  var best = Math.max(
    savedBest && typeof savedBest.best === "number" ? savedBest.best : 0,
    saved && typeof saved.best === "number" ? saved.best : 0,
    oldBestRaw
  );
  var startLevel = saved && saved.level > 0 ? Math.floor(saved.level) : 1;
  var startScore = saved && saved.score > 0 ? Math.floor(saved.score) : 0;
  var padX = W/2, score = startScore, lives = 3, level = startLevel, playing = false, quizPaused = false, won = false;
  var raf = null, lastT = 0, pointerX = null;

  function persistBest() {
    if (score <= best) return;
    best = score;
    if (window.GameSave) GameSave.save(BEST_KEY, { best: best });
    try { localStorage.setItem("gbBreakoutBest", String(best)); } catch (e) {}
  }
  function saveProgress() {
    startLevel = level; startScore = score;
    persistBest();
    if (window.GameSave) GameSave.save(SAVE_KEY, { level: level, score: score, best: best });
  }

  function setup() {
    var dpr = window.devicePixelRatio || 1;
    var scale = Math.min(1, (window.innerWidth - 60) / W);
    canvas.style.width = Math.round(W * scale) + "px"; canvas.style.height = Math.round(H * scale) + "px";
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    brickW = (W - 20) / COLS;
    draw();
  }
  function buildBricks() {
    bricks = [];
    var rows = Math.min(ROWS + level - 1, 8);
    for (var r = 0; r < rows; r++) for (var c = 0; c < COLS; c++) {
      bricks.push({ x: 10 + c * brickW + 2, y: 34 + r * (brickH + 5), w: brickW - 4, h: brickH, color: COLORS[r % COLORS.length], alive: true });
    }
  }
  function resetBall() {
    ball.x = W / 2; ball.y = H - 40;
    ball.vx = (Math.random() < .5 ? -1 : 1) * (2.4 + Math.random());
    ball.vy = -(3 + Math.random());
    padX = W / 2;
  }
  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
    ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
    ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y); ctx.closePath();
  }
  function draw() {
    ctx.fillStyle = "#1b1b3a"; ctx.fillRect(0, 0, W, H);
    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      var g = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
      g.addColorStop(0, "rgba(255,255,255,.45)"); g.addColorStop(.35, "rgba(255,255,255,.05)"); g.addColorStop(1, "rgba(0,0,0,.18)");
      roundRect(b.x, b.y, b.w, b.h, 6); ctx.fillStyle = b.color; ctx.fill();
      ctx.fillStyle = g; ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.35)";
      roundRect(b.x + 3, b.y + 3, b.w - 6, 4, 2); ctx.fill();
    }
    // 挡板：圆角果冻渐变
    var px = padX - padW/2, py = H - padH - 6;
    var pg = ctx.createLinearGradient(px, py, px, py + padH);
    pg.addColorStop(0, "#a6e8ff"); pg.addColorStop(.5, "#4fc3f7"); pg.addColorStop(1, "#2196c9");
    roundRect(px, py, padW, padH, padH/2); ctx.fillStyle = pg; ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.55)"; roundRect(px + 6, py + 2, padW - 12, 3, 1.5); ctx.fill();
    // 球：径向高光
    var bg = ctx.createRadialGradient(ball.x - ball.r*.35, ball.y - ball.r*.35, ball.r*.1, ball.x, ball.y, ball.r);
    bg.addColorStop(0, "#fff"); bg.addColorStop(.7, "#e8f4ff"); bg.addColorStop(1, "#9fd4f5");
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fillStyle = bg; ctx.fill();
  }
  function update(dt) {
    if (!playing || quizPaused || won) return;
    var f = dt / 16.67;
    // 挡板跟随指针
    if (pointerX !== null) padX += (pointerX - padX) * Math.min(1, 0.35 * f);
    padX = Math.max(padW/2, Math.min(W - padW/2, padX));
    ball.x += ball.vx * f; ball.y += ball.vy * f;
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }
    // 挡板反弹
    if (ball.vy > 0 && ball.y + ball.r >= H - padH - 6 && ball.y - ball.r <= H - 6) {
      if (ball.x >= padX - padW/2 && ball.x <= padX + padW/2) {
        ball.y = H - padH - 6 - ball.r;
        var hit = (ball.x - padX) / (padW/2);
        ball.vx = hit * 3.6;
        ball.vy = -Math.abs(ball.vy);
      }
    }
    // 砖块碰撞
    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w && ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
        b.alive = false;
        // 判断从哪个方向撞上
        var overlapX = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
        var overlapY = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
        if (overlapX < overlapY) ball.vx = -ball.vx; else ball.vy = -ball.vy;
        score += 10; scoreEl.textContent = score;
        saveProgress();
        break;
      }
    }
    // 掉出底部
    if (ball.y - ball.r > H) {
      lives--; livesEl.textContent = lives;
      if (lives <= 0) { gameOver(); return; }
      resetBall();
    }
    // 过关判定
    var remain = 0;
    for (var j = 0; j < bricks.length; j++) if (bricks[j].alive) remain++;
    if (remain === 0) levelClear();
    draw();
  }
  function loop(t) {
    raf = requestAnimationFrame(loop);
    var dt = Math.min(32, t - lastT || 16); lastT = t;
    update(dt);
  }
  function levelClear() {
    won = true;
    ovIcon.textContent = "🎉"; ovTitle.textContent = "过关啦！";
    ovText.textContent = "第 " + level + " 关打光啦，得分 " + score + "！";
    ovBtn.textContent = "下一关 ▶";
    overlay.classList.remove("hidden");
  }
  function gameOver() {
    playing = false;
    ovIcon.textContent = "😵"; ovTitle.textContent = "游戏结束";
    ovText.textContent = "这次得了 " + score + " 分，再试一次吧！";
    ovBtn.textContent = "重新开始 🔄";
    overlay.classList.remove("hidden");
  }
  function newLevel() {
    level++; levelEl.textContent = level;
    saveProgress();
    buildBricks(); resetBall(); won = false;
    overlay.classList.add("hidden");
  }
  function start() {
    score = startScore; scoreEl.textContent = score;
    lives = 3; livesEl.textContent = lives;
    level = startLevel; levelEl.textContent = level;
    buildBricks(); resetBall(); won = false; playing = true; quizPaused = false;
    startScreen.classList.add("hidden"); overlay.classList.add("hidden");
  }
  function movePad(clientX) {
    var rect = canvas.getBoundingClientRect();
    pointerX = (clientX - rect.left) / rect.width * W;
  }
  canvas.addEventListener("touchstart", function (e) { movePad(e.touches[0].clientX); }, { passive: true });
  canvas.addEventListener("touchmove", function (e) { movePad(e.touches[0].clientX); e.preventDefault(); }, { passive: false });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") { pointerX = null; padX -= 22; e.preventDefault(); }
    if (e.key === "ArrowRight") { pointerX = null; padX += 22; e.preventDefault(); }
  });
  ovBtn.addEventListener("click", function () {
    if (won) { newLevel(); }
    else { start(); }
  });
  document.getElementById("startBtn").addEventListener("click", start);
  document.getElementById("newBtn").addEventListener("click", start);
  window.addEventListener("resize", setup);

  scoreEl.textContent = score; levelEl.textContent = level;
  setup();
  raf = requestAnimationFrame(loop);

  if (window.GameQuiz) {
    GameQuiz.init({
      isPlaying: function () { return playing && !won && overlay.classList.contains("hidden"); },
      onOpen: function () { quizPaused = true; },
      onClose: function () { quizPaused = false; lastT = performance.now(); }
    });
  }
})();
</script>
</body>
</html>
