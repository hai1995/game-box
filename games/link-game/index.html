<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>🔗 连连看</title>
<link rel="stylesheet" href="../../theme.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; min-height:100%; overflow-x:hidden; font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
  body { background:linear-gradient(160deg,#e9f7ff 0%,#fdeafa 55%,#fff6e5 100%); background-attachment:fixed; color:#3b2f2f; padding-bottom:calc(26px + env(safe-area-inset-bottom)); }
  .home-btn { position:fixed; left:12px; top:calc(12px + env(safe-area-inset-top)); z-index:30;
    width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,.92);
    border:3px solid #ffb703; box-shadow:0 4px 0 rgba(0,0,0,.14); color:#d62828;
    display:flex; align-items:center; justify-content:center; font-size:26px; text-decoration:none; }
  .home-btn:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.14); }
  .hero { text-align:center; padding:calc(20px + env(safe-area-inset-top)) 12px 4px; }
  .hero .logo { font-size:46px; animation:bob 3s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0) rotate(-5deg)} 50%{transform:translateY(-7px) rotate(5deg)} }
  .hero h1 { font-size:clamp(22px,6vw,30px); margin:4px 0; color:#6c5ce7; }
  .hero p { font-size:13px; color:#8b7d7d; }
  .bar { display:flex; justify-content:center; gap:12px; margin:10px 0 12px; flex-wrap:wrap; }
  .pill { background:#fff; border:3px solid #b39ddb; border-radius:999px; padding:7px 16px;
    font-size:16px; font-weight:800; color:#6c5ce7; box-shadow:0 4px 0 #9575cd; white-space:nowrap; }
  .pill.time { color:#e07a00; border-color:#ffd23f; box-shadow:0 4px 0 #f0c000; }
  .wrap { max-width:500px; margin:0 auto; padding:0 12px; text-align:center; }
  .boardwrap { position:relative; display:inline-block; width:100%; max-width:480px; }
  .board { display:grid; grid-template-columns:repeat(8,1fr); grid-template-rows:repeat(6,1fr);
    gap:5px; width:100%; aspect-ratio:8/6; }
  .tile { background:linear-gradient(180deg,#fff,#f3ebff); border:2px solid #d8c8f0; border-radius:12px;
    display:flex; align-items:center; justify-content:center; padding:12%;
    box-shadow:0 3px 0 rgba(120,90,160,.18); cursor:pointer; user-select:none; transition:transform .1s; }
  .tile svg { width:100%; height:100%; display:block; filter:drop-shadow(0 1px 1px rgba(90,60,120,.25)); }
  .tile:active { transform:scale(.94); }
  .tile.sel { border-color:#ffb703; box-shadow:0 0 0 4px rgba(255,183,3,.5),0 3px 0 rgba(120,90,160,.18); background:#fff8e1; }
  .tile.gone { visibility:hidden; }
  .tile.hint { animation:hint .7s ease infinite; }
  @keyframes hint { 0%,100%{transform:scale(1)} 50%{transform:scale(1.12);box-shadow:0 0 0 4px rgba(76,217,100,.6)} }
  .tile.shake { animation:shake .3s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .link-layer { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:5; }
  .tools { display:flex; justify-content:center; gap:12px; margin:16px 0 4px; flex-wrap:wrap; }
  .btn { border:none; border-radius:999px; padding:11px 22px; font-size:17px; font-weight:900; color:#fff; cursor:pointer;
    box-shadow:0 5px 0 rgba(0,0,0,.16); }
  .btn:active { transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.16); }
  .btn.hint { background:linear-gradient(180deg,#81C784,#4CAF50); box-shadow:0 5px 0 #388E3C; }
  .btn.shuffle { background:linear-gradient(180deg,#64B5F6,#42A5F5); box-shadow:0 5px 0 #1976D2; }
  .btn.restart { background:linear-gradient(180deg,#ff8fab,#ff6b81); box-shadow:0 5px 0 #e84d68; }
  .overlay { position:fixed; inset:0; z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92); backdrop-filter:blur(4px); text-align:center; padding:20px; }
  .overlay.hidden { display:none; }
  .overlay .big { font-size:76px; animation:pop .6s ease; }
  @keyframes pop { 0%{transform:scale(.6)} 60%{transform:scale(1.15)} 100%{transform:scale(1)} }
  .overlay h2 { font-size:30px; color:#6c5ce7; margin:8px 0; }
  .overlay p { font-size:18px; color:#6d6262; margin:6px 0 20px; }
  .overlay .btn { background:linear-gradient(180deg,#a78bfa,#7c5cff); box-shadow:0 5px 0 #5b3fd6; }
</style>
</head>
<body>
<a class="home-btn" href="../../" aria-label="返回主页" title="返回主页">🏠</a>

<header class="hero">
  <div class="logo">🔗</div>
  <h1>连连看</h1>
  <p>找出两个一样的图案，用不超过两次拐弯的线连起来就能消除！</p>
</header>

<div class="bar">
  <div class="pill time">⏰ <span id="time">10:00</span></div>
  <div class="pill">剩余 <span id="left">24</span> 对</div>
</div>

<div class="wrap">
  <div class="boardwrap">
    <div class="board" id="board"></div>
    <svg class="link-layer" id="layer" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
  </div>
  <div class="tools">
    <button class="btn hint" id="hintBtn">💡 提示</button>
    <button class="btn shuffle" id="shuffleBtn">🔀 重排</button>
    <button class="btn restart" id="restartBtn">🔄 重来</button>
  </div>
</div>

<div class="overlay hidden" id="overlay">
  <div class="big" id="ovIcon">🎉</div>
  <h2 id="ovTitle">全部消除！</h2>
  <p id="ovText"></p>
  <button class="btn" id="ovBtn">再玩一次</button>
</div>

<script src="../../icons.js"></script>
<script src="../../quiz.js"></script>
<script src="../../save.js"></script>
<script>
(function () {
  "use strict";
  var R = 6, C = 8, TOTAL = R * C, TOTAL_TIME = 600;  // 对局时长 10 分钟
  var SAVE_KEY = "linkGame";
  var ICONS = ["apple","orange","lemon","watermelon","grapes","strawberry","cherry","peach","mango","pineapple","kiwi","blueberry"];
  var DR = [-1, 1, 0, 0], DC = [0, 0, -1, 1];
  var boardEl = document.getElementById("board"), layer = document.getElementById("layer");
  var timeEl = document.getElementById("time"), leftEl = document.getElementById("left");
  var overlay = document.getElementById("overlay");
  var grid = [], cells = [], sel = null, timeLeft = TOTAL_TIME, timer = null;
  var finished = false, quizPaused = false, pairsLeft = 0;

  function saveGame() {
    if (!window.GameSave) return;
    GameSave.save(SAVE_KEY, { grid: grid, timeLeft: timeLeft });
  }
  function validGrid(g) {
    if (!Array.isArray(g) || g.length !== R) return false;
    for (var r = 0; r < R; r++) {
      if (!Array.isArray(g[r]) || g[r].length !== C) return false;
      for (var c = 0; c < C; c++) {
        var v = g[r][c];
        if (v !== null && ICONS.indexOf(v) === -1) return false;
      }
    }
    return true;
  }

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function renderBoard() {
    boardEl.innerHTML = ""; cells = [];
    for (var r = 0; r < R; r++) {
      cells[r] = [];
      for (var c = 0; c < C; c++) {
        var val = grid[r][c];
        var d = document.createElement("div");
        d.className = "tile" + (val ? "" : " gone");
        d.innerHTML = val ? GameIcons.get(val) : "";
        (function (rr, cc, el) {
          el.addEventListener("click", function () { tap(rr, cc); });
        })(r, c, d);
        boardEl.appendChild(d); cells[r][c] = d;
      }
    }
  }
  function build() {
    var deck = [];
    for (var i = 0; i < ICONS.length; i++) for (var k = 0; k < 4; k++) deck.push(ICONS[i]);
    shuffle(deck);
    grid = [];
    var idx = 0;
    for (var r = 0; r < R; r++) {
      grid[r] = [];
      for (var c = 0; c < C; c++) grid[r][c] = deck[idx++];
    }
    pairsLeft = TOTAL / 2; leftEl.textContent = pairsLeft;
    sel = null; layer.innerHTML = "";
    renderBoard();
    if (!findAnyPair()) shuffleBoard();
  }
  function updateCell(r, c) {
    var val = grid[r][c];
    cells[r][c].innerHTML = val ? GameIcons.get(val) : "";
    cells[r][c].classList.toggle("gone", !val);
    cells[r][c].classList.remove("sel", "hint", "shake");
  }
  /* 判断两个图案能否用 <=2 次拐弯的路径连通，返回路径点数组或 null */
  function canLink(a, b) {
    if (a.r === b.r && a.c === b.c) return null;
    if (!grid[a.r][a.c] || grid[a.r][a.c] !== grid[b.r][b.c]) return null;
    function passable(r, c) {
      if (r < -1 || r > R || c < -1 || c > C) return false;
      if (r === b.r && c === b.c) return true;
      if (r < 0 || r >= R || c < 0 || c >= C) return true; // 外圈视为空
      return !grid[r][c];
    }
    var visited = {}, queue = [];
    for (var d = 0; d < 4; d++) {
      var nr = a.r + DR[d], nc = a.c + DC[d];
      if (passable(nr, nc)) queue.push({ r: nr, c: nc, dir: d, turns: 0, path: [{ r: a.r, c: a.c }] });
    }
    while (queue.length) {
      var st = queue.shift();
      if (st.r === b.r && st.c === b.c) return st.path.concat([{ r: b.r, c: b.c }]);
      var key = st.r + "," + st.c + "," + st.dir;
      if (visited[key] !== undefined && visited[key] <= st.turns) continue;
      visited[key] = st.turns;
      for (var d2 = 0; d2 < 4; d2++) {
        var nd = (d2 === st.dir) ? st.turns : st.turns + 1;
        if (nd > 2) continue;
        var nr2 = st.r + DR[d2], nc2 = st.c + DC[d2];
        if (passable(nr2, nc2)) {
          queue.push({ r: nr2, c: nc2, dir: d2, turns: nd, path: st.path.concat([{ r: st.r, c: st.c }]) });
        }
      }
    }
    return null;
  }
  function findAnyPair() {
    var list = [];
    for (var r = 0; r < R; r++) for (var c = 0; c < C; c++) if (grid[r][c]) list.push({ r: r, c: c });
    for (var i = 0; i < list.length; i++) for (var j = i + 1; j < list.length; j++) {
      if (grid[list[i].r][list[i].c] === grid[list[j].r][list[j].c] && canLink(list[i], list[j]))
        return [list[i], list[j]];
    }
    return null;
  }
  function drawLink(path) {
    layer.innerHTML = "";
    var pts = path.map(function (p) {
      return ((p.c + 0.5) / C * 100) + "," + ((p.r + 0.5) / R * 100);
    }).join(" ");
    var pl = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
    pl.setAttribute("points", pts);
    pl.setAttribute("fill", "none");
    pl.setAttribute("stroke", "#ff3d6e");
    pl.setAttribute("stroke-width", "5");
    pl.setAttribute("stroke-linecap", "round");
    pl.setAttribute("stroke-linejoin", "round");
    pl.setAttribute("vector-effect", "non-scaling-stroke");
    layer.appendChild(pl);
  }
  function tap(r, c) {
    if (finished || quizPaused || !grid[r][c]) return;
    clearHint();
    if (!sel) {
      sel = { r: r, c: c }; cells[r][c].classList.add("sel"); return;
    }
    if (sel.r === r && sel.c === c) {
      cells[r][c].classList.remove("sel"); sel = null; return;
    }
    var a = sel, b = { r: r, c: c };
    var path = canLink(a, b);
    if (path) {
      cells[a.r][a.c].classList.remove("sel");
      drawLink(path);
      grid[a.r][a.c] = null; grid[b.r][b.c] = null;
      updateCell(a.r, a.c); updateCell(b.r, b.c);
      sel = null; pairsLeft--; leftEl.textContent = pairsLeft;
      saveGame();
      setTimeout(function () { layer.innerHTML = ""; }, 320);
      if (pairsLeft <= 0) { win(); return; }
      if (!findAnyPair()) { setTimeout(function () { shuffleBoard(); }, 360); }
    } else {
      cells[a.r][a.c].classList.remove("sel");
      cells[a.r][a.c].classList.add("shake"); cells[b.r][b.c].classList.add("shake");
      setTimeout(function () {
        cells[a.r][a.c].classList.remove("shake"); cells[b.r][b.c].classList.remove("shake");
      }, 320);
      sel = null;
    }
  }
  function clearHint() {
    for (var r = 0; r < R; r++) for (var c = 0; c < C; c++) cells[r][c] && cells[r][c].classList.remove("hint");
  }
  function shuffleBoard() {
    var vals = [];
    for (var r = 0; r < R; r++) for (var c = 0; c < C; c++) if (grid[r][c]) vals.push(grid[r][c]);
    shuffle(vals);
    var idx = 0;
    for (var r2 = 0; r2 < R; r2++) for (var c2 = 0; c2 < C; c2++) if (grid[r2][c2]) grid[r2][c2] = vals[idx++];
    for (var r3 = 0; r3 < R; r3++) for (var c3 = 0; c3 < C; c3++) updateCell(r3, c3);
    sel = null; clearHint(); layer.innerHTML = "";
    if (vals.length && !findAnyPair()) shuffleBoard();
    saveGame();
  }
  function showHint() {
    if (finished || quizPaused) return;
    clearHint();
    var pair = findAnyPair();
    if (pair) {
      cells[pair[0].r][pair[0].c].classList.add("hint");
      cells[pair[1].r][pair[1].c].classList.add("hint");
      setTimeout(clearHint, 2000);
    }
  }
  function fmt(t) {
    var m = Math.floor(t / 60), s = t % 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }
  function startTimer() {
    if (timer) clearInterval(timer);
    timer = setInterval(function () {
      if (finished || quizPaused) return;
      timeLeft--; timeEl.textContent = fmt(timeLeft);
      if (timeLeft <= 0) {
        finished = true; clearInterval(timer);
        document.getElementById("ovIcon").textContent = "⏰";
        document.getElementById("ovTitle").textContent = "时间到啦！";
        document.getElementById("ovText").textContent = "还剩 " + pairsLeft + " 对，再挑战一次吧！";
        overlay.classList.remove("hidden"); if (window.GameSave) GameSave.clear(SAVE_KEY);
      }
    }, 1000);
  }
  function win() {
    finished = true; clearInterval(timer);
    document.getElementById("ovIcon").textContent = "🏆";
    document.getElementById("ovTitle").textContent = "全部消除！";
    document.getElementById("ovText").textContent = "你用了 " + (TOTAL_TIME - timeLeft) + " 秒，记忆力超棒！";
    if (window.GameSave) GameSave.clear(SAVE_KEY);
    setTimeout(function () { overlay.classList.remove("hidden"); }, 300);
  }
  function reset(fresh) {
    var saved = fresh ? null : (window.GameSave ? GameSave.load(SAVE_KEY, null) : null);
    timeLeft = TOTAL_TIME;
    finished = false; overlay.classList.add("hidden");
    if (saved && validGrid(saved.grid)) {
      var cnt = 0;
      for (var r = 0; r < R; r++) for (var c = 0; c < C; c++) if (saved.grid[r][c]) cnt++;
      if (cnt % 2 === 0) {
        grid = saved.grid;
        pairsLeft = cnt / 2; leftEl.textContent = pairsLeft;
        timeLeft = (typeof saved.timeLeft === "number" && isFinite(saved.timeLeft) && saved.timeLeft > 0) ? saved.timeLeft : TOTAL_TIME;
        sel = null; layer.innerHTML = "";
        renderBoard();
      } else {
        build();
      }
    } else {
      build();
    }
    timeEl.textContent = fmt(timeLeft);
    startTimer();
    if (fresh && window.GameSave) GameSave.clear(SAVE_KEY);
    else saveGame();
  }

  document.getElementById("hintBtn").addEventListener("click", showHint);
  document.getElementById("shuffleBtn").addEventListener("click", function () { if (!finished && !quizPaused) shuffleBoard(); });
  document.getElementById("restartBtn").addEventListener("click", function () { reset(true); });
  document.getElementById("ovBtn").addEventListener("click", function () { reset(true); });

  reset(false);

  if (window.GameQuiz) {
    GameQuiz.init({
      isPlaying: function () { return !finished && overlay.classList.contains("hidden"); },
      onOpen: function () { quizPaused = true; },
      onClose: function () { quizPaused = false; }
    });
  }
})();
</script>
</body>
</html>
