<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>🧠 动物记忆翻翻乐</title>
<link rel="stylesheet" href="../../theme.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; min-height:100%; overflow-x:hidden; font-family:"PingFang SC","Microsoft YaHei","Comic Sans MS",system-ui,sans-serif; }
  body { background:linear-gradient(160deg,#fff0f6 0%,#e8f6ff 55%,#f0ffe9 100%);color:#3b2f2f; padding-bottom:calc(24px + env(safe-area-inset-bottom)); }
  .hero { text-align:center; padding:calc(20px + env(safe-area-inset-top)) 12px 8px; }
  .hero .logo { font-size:46px; animation:bob 3s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0) rotate(-5deg)} 50%{transform:translateY(-7px) rotate(5deg)} }
  .hero h1 { font-size:clamp(22px,6vw,30px); margin:4px 0; color:#ff6b81; text-shadow:0 2px 0 #fff; }
  .hero p { font-size:13px; color:#8b7d7d; }
  .bar { display:flex; justify-content:center; gap:12px; margin:10px 0 16px; flex-wrap:wrap; }
  .pill { background:#fff; border:3px solid #ffd23f; border-radius:999px; padding:7px 16px;
    font-size:16px; font-weight:800; color:#e07a00; box-shadow:0 4px 0 #f0c000; white-space:nowrap; }
  .board { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; max-width:480px; margin:0 auto; padding:0 14px; }
  @media (min-width:600px) { .board { grid-template-columns:repeat(4,1fr); } }
  .card { position:relative; aspect-ratio:1/1; cursor:pointer; perspective:600px; }
  .card .inner { position:absolute; inset:0; transition:transform .45s cubic-bezier(.2,.8,.3,1); transform-style:preserve-3d; }
  .card.flipped .inner, .card.matched .inner { transform:rotateY(180deg); }
  .face { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:18px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 5px 0 rgba(0,0,0,.14); font-size:clamp(30px,9vw,46px); }
  .front { background:linear-gradient(135deg,#ffb457,#ff8fab); color:#fff; font-weight:900; }
  .front::after { content:"❓"; }
  .back { background:#fff; border:3px solid #ffe08a; transform:rotateY(180deg); }
  .back svg { width:82%; height:82%; display:block; filter:drop-shadow(0 1px 1px rgba(0,0,0,.15)); }
  .card.matched .back { border-color:#5fd38b; background:#eafff1; box-shadow:0 5px 0 #3fae6b; }
  .card.matched { animation:pop .4s ease; }
  @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.12)} 100%{transform:scale(1)} }
  .card.shake .inner { animation:shake .4s; }
  @keyframes shake { 0%,100%{transform:rotateY(180deg) translateX(0)} 25%{transform:rotateY(180deg) translateX(-6px)} 75%{transform:rotateY(180deg) translateX(6px)} }
  .overlay { position:fixed; inset:0; z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(255,255,255,.9); backdrop-filter:blur(4px); text-align:center; }
  .overlay.hidden { display:none; }
  .overlay .big { font-size:80px; animation:pop .6s ease; }
  .overlay h2 { font-size:32px; color:#ff6b81; margin:8px 0; }
  .overlay p { font-size:18px; color:#6d6262; margin:6px 0 20px; }
  .btn { border:none; border-radius:999px; padding:14px 40px; font-size:22px; font-weight:900; color:#fff;
    background:linear-gradient(180deg,#ff8fab,#ff6b81); box-shadow:0 6px 0 #e84d68; cursor:pointer; }
  .btn:active { transform:translateY(3px); box-shadow:0 3px 0 #e84d68; }
</style>
</head>
<body>
<a class="home-btn" href="../../" aria-label="返回主页" title="返回主页">🏠</a>

<header class="hero">
  <div class="logo">🧠</div>
  <h1>动物记忆翻翻乐</h1>
  <p>翻开两张一样的动物，把它们找出来！</p>
</header>

<div class="bar">
  <div class="pill">✅ 配对 <span id="pairs">0</span>/6</div>
  <div class="pill">🔄 翻牌 <span id="moves">0</span> 次</div>
</div>

<div class="board" id="board"></div>

<div class="overlay hidden" id="winScreen">
  <div class="big">🎉</div>
  <h2>全找到啦！</h2>
  <p id="winText">你用了 0 次翻牌</p>
  <button class="btn" id="againBtn">再玩一次 🔄</button>
</div>

<script src="../../icons.js"></script>
<script src="../../quiz.js"></script>
<script src="../../save.js"></script>
<script>
(function () {
  "use strict";
  var SAVE_KEY = "memoryMatch";
  var animals = ["dog","cat","fox","panda","lion","frog","rabbit","bear"];
  var emojis = animals.slice(0, 6);
  var deck = emojis.concat(emojis);
  var board = document.getElementById("board");
  var pairsEl = document.getElementById("pairs");
  var movesEl = document.getElementById("moves");
  var winScreen = document.getElementById("winScreen");
  var first = null, lock = false, pairs = 0, moves = 0;

  // 存档：保留牌序、已配对下标、翻牌数与配对数；刷新后接着玩
  function saveGame() {
    if (window.GameSave) GameSave.save(SAVE_KEY, {
      deck: deck, matched: matchedIdx(), pairs: pairs, moves: moves
    });
  }
  function matchedIdx() {
    var idx = [];
    var cards = board.children;
    for (var i = 0; i < cards.length; i++) if (cards[i].classList.contains("matched")) idx.push(i);
    return idx;
  }

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function build(saved) {
    board.innerHTML = "";
    if (saved && saved.deck && saved.deck.length === deck.length) {
      deck = saved.deck.slice();                       // 恢复上次的牌序
    } else {
      shuffle(deck);
    }
    deck.forEach(function (em, i) {
      var c = document.createElement("div");
      c.className = "card";
      c.dataset.emoji = em;
      c.dataset.index = i;
      c.innerHTML = '<div class="inner"><div class="face front"></div><div class="face back">' + GameIcons.get(em) + '</div></div>';
      c.addEventListener("click", function () { flip(c); });
      board.appendChild(c);
    });
    // 恢复已配对的牌
    if (saved && saved.matched) {
      saved.matched.forEach(function (i) {
        var c = board.children[i];
        if (c) c.classList.add("matched");
      });
    }
  }

  function flip(card) {
    if (lock || card.classList.contains("flipped") || card.classList.contains("matched")) return;
    card.classList.add("flipped");
    if (!first) { first = card; return; }
    moves++; movesEl.textContent = moves;
    saveGame();
    var second = card;
    if (first.dataset.emoji === second.dataset.emoji) {
      first.classList.add("matched");
      second.classList.add("matched");
      first = null;
      pairs++; pairsEl.textContent = pairs;
      if (pairs === deck.length / 2) {
        setTimeout(function () {
          winScreen.classList.remove("hidden");
          document.getElementById("winText").textContent = "你用了 " + moves + " 次翻牌，太棒啦！";
          if (window.GameSave) GameSave.clear(SAVE_KEY);   // 通关清档
        }, 500);
      } else {
        saveGame();
      }
    } else {
      lock = true;
      var a = first, b = second;
      a.classList.add("shake"); b.classList.add("shake");
      setTimeout(function () {
        a.classList.remove("flipped", "shake");
        b.classList.remove("flipped", "shake");
        first = null; lock = false;
      }, 800);
    }
  }

  function reset(fresh) {
    var saved = fresh ? null : (window.GameSave ? GameSave.load(SAVE_KEY, null) : null);
    first = null; lock = false;
    pairs = saved ? (saved.pairs || 0) : 0;
    moves = saved ? (saved.moves || 0) : 0;
    pairsEl.textContent = String(pairs); movesEl.textContent = String(moves);
    winScreen.classList.add("hidden");
    if (fresh && window.GameSave) GameSave.clear(SAVE_KEY);
    build(saved);
  }

  document.getElementById("againBtn").addEventListener("click", function () { reset(true); });
  reset(false);   // 启动：优先恢复上次进度

  // 接入公共定时做题模块：游戏未通关时才弹题
  if (window.GameQuiz) {
    GameQuiz.init({
      isPlaying: function () { return pairs < deck.length / 2 && winScreen.classList.contains("hidden"); },
      onOpen: function () {},
      onClose: function () {}
    });
  }
})();
</script>
</body>
</html>
