<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>💅 美甲设计</title>
<link rel="stylesheet" href="../../theme.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; min-height:100%; overflow-x:hidden; font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
  body { background:linear-gradient(160deg,#fff0f5 0%,#fde8f3 45%,#f3ecff 100%); background-attachment:fixed; color:#5a3b4a; padding-bottom:calc(28px + env(safe-area-inset-bottom)); }
  .home-btn { position:fixed; left:12px; top:calc(12px + env(safe-area-inset-top)); z-index:30;
    width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,.94);
    border:3px solid #ff9ec4; box-shadow:0 4px 0 rgba(200,80,130,.25); color:#e5508a;
    display:flex; align-items:center; justify-content:center; font-size:26px; text-decoration:none; }
  .home-btn:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(200,80,130,.25); }
  .hero { text-align:center; padding:calc(18px + env(safe-area-inset-top)) 12px 2px; }
  .hero .logo { font-size:42px; animation:bob 3.4s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0) rotate(-6deg)} 50%{transform:translateY(-6px) rotate(6deg)} }
  .hero h1 { font-size:clamp(22px,6vw,29px); margin:3px 0; color:#e0508c; letter-spacing:1px; }
  .hero p { font-size:12.5px; color:#a08090; max-width:400px; margin:0 auto; }
  .wrap { max-width:520px; margin:0 auto; padding:0 14px; text-align:center; }
  .hud { display:flex; justify-content:center; align-items:center; gap:10px; margin:12px 0; flex-wrap:wrap; }
  .pill { background:#fff; border:3px solid #ffc2dc; border-radius:999px; padding:6px 15px;
    font-size:14px; font-weight:800; color:#e0508c; box-shadow:0 4px 0 #ffd9e8; white-space:nowrap; }
  .icon-btn { border:3px solid #ffc2dc; background:#fff; color:#e0508c; border-radius:999px;
    width:42px; height:38px; font-size:18px; font-weight:900; cursor:pointer; box-shadow:0 4px 0 #ffd9e8; }
  .icon-btn:active { transform:translateY(2px); box-shadow:0 1px 0 #ffd9e8; }
  canvas { display:block; margin:0 auto; border-radius:16px; touch-action:manipulation;
    box-shadow:0 8px 20px rgba(200,80,130,.22); }
  .panel { background:rgba(255,255,255,.75); border:2px solid #ffe0ec; border-radius:18px; padding:12px; margin-top:14px; }
  .panel h3 { font-size:13px; color:#c06a92; margin-bottom:9px; letter-spacing:.5px; }
  .colors { display:flex; flex-wrap:wrap; justify-content:center; gap:9px; }
  .swatch { width:34px; height:34px; border-radius:50%; border:3px solid #fff; cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.18); transition:transform .12s; }
  .swatch:active { transform:scale(.88); }
  .swatch.sel { outline:3px solid #e0508c; outline-offset:2px; transform:scale(1.12); }
  .pats { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; }
  .pat { border:2px solid #ffd0e2; background:#fff; color:#b0567f; border-radius:12px;
    padding:7px 12px; font-size:13px; font-weight:800; cursor:pointer; box-shadow:0 3px 0 #ffe4ef; }
  .pat:active { transform:translateY(2px); box-shadow:0 1px 0 #ffe4ef; }
  .pat.sel { background:linear-gradient(180deg,#ff8cbb,#e0508c); color:#fff; border-color:#fff; box-shadow:0 3px 0 #c22e6c; }
  .tools { display:flex; justify-content:center; gap:10px; margin:14px 0 2px; flex-wrap:wrap; }
  .btn { border:none; border-radius:999px; padding:11px 20px; font-size:15px; font-weight:900; color:#fff; cursor:pointer; box-shadow:0 5px 0 rgba(0,0,0,.14); }
  .btn:active { transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.14); }
  .btn.rand { background:linear-gradient(180deg,#c59bff,#9b6dff); box-shadow:0 5px 0 #7a45e0; }
  .btn.clear { background:linear-gradient(180deg,#ffb3c9,#ff7fa5); box-shadow:0 5px 0 #e84d7f; }
  .btn.done { background:linear-gradient(180deg,#7bdcb5,#38c48c); box-shadow:0 5px 0 #1e9c6a; }
  .overlay { position:fixed; inset:0; z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(255,245,250,.94); backdrop-filter:blur(4px); text-align:center; padding:20px; }
  .overlay.hidden { display:none; }
  .overlay .big { font-size:72px; animation:pop .6s ease; }
  @keyframes pop { 0%{transform:scale(.6)} 60%{transform:scale(1.15)} 100%{transform:scale(1)} }
  .overlay h2 { font-size:28px; color:#e0508c; margin:8px 0; }
  .overlay p { font-size:16px; color:#8a6476; margin:4px 0 6px; line-height:1.6; }
  .overlay .score { font-size:44px; font-weight:900; color:#ff7a3d; margin:6px 0 14px; }
  .overlay .btn { background:linear-gradient(180deg,#7bdcb5,#38c48c); box-shadow:0 5px 0 #1e9c6a; }
</style>
</head>
<body>
<a class="home-btn" href="../../" aria-label="返回主页" title="返回主页">🏠</a>

<header class="hero">
  <div class="logo">💅</div>
  <h1>美甲设计</h1>
  <p>挑颜色、选花样，给双手设计一套专属美甲吧～</p>
</header>

<div class="wrap">
  <div class="hud">
    <div class="pill" id="bestPill">最佳魅力 0</div>
    <div class="pill" id="worksPill">作品 0</div>
    <button class="icon-btn" id="soundBtn" title="音效开关">🔊</button>
  </div>

  <canvas id="canvas"></canvas>

  <div class="panel">
    <h3>① 选择甲油颜色</h3>
    <div class="colors" id="colors"></div>
  </div>
  <div class="panel">
    <h3>② 选择花样（点指甲应用）</h3>
    <div class="pats" id="pats"></div>
  </div>

  <div class="tools">
    <button class="btn rand" id="randBtn">✨ 灵感随机</button>
    <button class="btn clear" id="clearBtn">🧴 一键卸甲</button>
    <button class="btn done" id="doneBtn">📷 完成作品</button>
  </div>
</div>

<div class="overlay hidden" id="overlay">
  <div class="big">💅</div>
  <h2>作品完成！</h2>
  <p id="ovText"></p>
  <div class="score" id="ovScore">0</div>
  <p id="ovBest"></p>
  <button class="btn" id="ovBtn">继续设计</button>
</div>

<script src="../../icons.js"></script>
<script src="../../quiz.js"></script>
<script src="../../save.js"></script>
<script>
(function () {
  "use strict";
  var SAVE_KEY = "nail-art";
  var canvas = document.getElementById("canvas"), ctx = canvas.getContext("2d");
  var overlay = document.getElementById("overlay");
  var bestPill = document.getElementById("bestPill"), worksPill = document.getElementById("worksPill");
  var soundBtn = document.getElementById("soundBtn");

  // 甲油配色（优雅色系）
  var COLORS = [
    "#ff5c8a","#ff85a8","#ffb3c6","#e63946","#c1121f","#ff9f68",
    "#ffd166","#f4d35e","#a8d5a2","#52b788","#2d6a4f","#7bdff2",
    "#4cc9f0","#4361ee","#7209b7","#b5179e","#9d4edd","#6c757d",
    "#2b2d42","#f8f4f0"
  ];
  // 花样：solid 纯色 / french 法式 / dots 波点 / stripes 条纹 / heart 爱心 / gradient 渐变 / glitter 亮片 / floral 碎花
  var PATTERNS = [
    { id:"solid",    name:"纯色" },
    { id:"french",   name:"法式" },
    { id:"dots",     name:"波点" },
    { id:"stripes",  name:"条纹" },
    { id:"heart",    name:"爱心" },
    { id:"gradient", name:"渐变" },
    { id:"glitter",  name:"亮片" },
    { id:"floral",   name:"碎花" }
  ];
  var NAILS = 10;                         // 双手各 5 个指甲
  var nails = [];                         // {color,pattern}
  var selColor = 0, selPattern = 0;
  var best = 0, works = 0, muted = false, quizPaused = false;
  var audioCtx = null, size = 0, cell = 0;

  function emptyNails() {
    var a = [];
    for (var i = 0; i < NAILS; i++) a.push({ color: -1, pattern: 0 }); // color -1 = 未涂
    return a;
  }
  function load() {
    var s = window.GameSave ? GameSave.load(SAVE_KEY, null) : null;
    if (s && typeof s === "object") {
      best = (typeof s.best === "number" && s.best >= 0) ? Math.floor(s.best) : 0;
      works = (typeof s.works === "number" && s.works >= 0) ? Math.floor(s.works) : 0;
      muted = s.muted === true;
      if (Array.isArray(s.nails) && s.nails.length === NAILS) {
        var ok = true, fixed = [];
        for (var i = 0; i < NAILS; i++) {
          var n = s.nails[i];
          if (n && typeof n.color === "number" && n.color >= -1 && n.color < COLORS.length &&
              typeof n.pattern === "number" && n.pattern >= 0 && n.pattern < PATTERNS.length) {
            fixed.push({ color: n.color, pattern: n.pattern });
          } else { ok = false; break; }
        }
        if (ok) nails = fixed;
      }
    }
    if (!nails.length) nails = emptyNails();
  }
  function save() {
    if (!window.GameSave) return;
    GameSave.save(SAVE_KEY, { best: best, works: works, muted: muted, nails: nails });
  }
  function refreshHud() {
    bestPill.textContent = "最佳魅力 " + best;
    worksPill.textContent = "作品 " + works;
    soundBtn.textContent = muted ? "🔇" : "🔊";
  }

  /* ---------- 音效 ---------- */
  function ensureAudio() {
    if (muted) return null;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    } catch (e) { return null; }
  }
  function beep(freq, dur, type, vol) {
    var ac = ensureAudio(); if (!ac) return;
    try {
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = type || "sine"; o.frequency.value = freq;
      g.gain.setValueAtTime(vol || 0.12, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + dur);
    } catch (e) {}
  }
  function sfxTap() { beep(660, .08, "sine", .10); }
  function sfxNice() { beep(523,.09,"sine",.09); setTimeout(function(){beep(659,.09,"sine",.09);},80); setTimeout(function(){beep(784,.14,"sine",.09);},160); }

  /* ---------- 绘制 ---------- */
  function setup() {
    var w = Math.min(480, window.innerWidth - 28);
    if (w < 280) w = 280;
    size = w; cell = size / 5;
    var dpr = window.devicePixelRatio || 1;
    canvas.style.width = size + "px"; canvas.style.height = size + "px";
    canvas.width = Math.round(size * dpr); canvas.height = Math.round(size * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function nailRect(i) {
    // 双手各占一行，每行 5 个指甲
    var row = i < 5 ? 0 : 1, k = i % 5;
    var w = cell * 0.5, h = cell * 0.72;
    var gap = (cell - w) / 2;
    var x = gap + k * cell + (cell - w) / 2;
    var y = (row === 0 ? size * 0.10 : size * 0.55) + (row === 1 ? 0 : 0);
    return { x: x, y: y, w: w, h: h };
  }
  function hexToRgb(h) {
    h = h.replace("#", "");
    if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
  }
  function lighten(hex, t) {
    var c = hexToRgb(hex);
    return "rgb(" + Math.min(255,Math.round(c[0]+(255-c[0])*t)) + "," +
                    Math.min(255,Math.round(c[1]+(255-c[1])*t)) + "," +
                    Math.min(255,Math.round(c[2]+(255-c[2])*t)) + ")";
  }
  function drawNail(i) {
    var n = nails[i], R = nailRect(i);
    var x = R.x, y = R.y, w = R.w, h = R.h, r = w * 0.45;
    // 手指底
    ctx.save();
    ctx.fillStyle = "#ffe0e9";
    roundRect(x - w*0.12, y - h*0.06, w*1.24, h*1.18, w*0.5); ctx.fill();
    ctx.strokeStyle = "#ffc4d8"; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.restore();
    if (n.color < 0) {
      // 未涂：透明甲片
      ctx.fillStyle = "rgba(255,255,255,.7)";
      roundRect(x, y, w, h, r); ctx.fill();
      ctx.strokeStyle = "#e8b9cc"; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = "#d99ab6"; ctx.font = (w*0.34)+"px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText("＋", x + w/2, y + h/2);
      return;
    }
    var col = COLORS[n.color], pat = PATTERNS[n.pattern].id;
    // 甲面底色 / 渐变
    ctx.save();
    roundRect(x, y, w, h, r); ctx.clip();
    if (pat === "gradient") {
      var g = ctx.createLinearGradient(x, y, x, y + h);
      g.addColorStop(0, lighten(col,.5)); g.addColorStop(1, col);
      ctx.fillStyle = g;
    } else {
      ctx.fillStyle = col;
    }
    ctx.fillRect(x, y, w, h);
    // 高光
    var hl = ctx.createLinearGradient(x, y, x + w, y);
    hl.addColorStop(0,"rgba(255,255,255,.35)"); hl.addColorStop(.4,"rgba(255,255,255,0)");
    ctx.fillStyle = hl; ctx.fillRect(x, y, w, h);
    // 花样
    if (pat === "french") {
      ctx.fillStyle = "rgba(255,255,255,.92)";
      ctx.beginPath(); ctx.ellipse(x + w/2, y, w*0.62, h*0.26, 0, 0, Math.PI*2); ctx.fill();
    } else if (pat === "dots") {
      ctx.fillStyle = "rgba(255,255,255,.9)";
      var dots = [[.28,.32],[.7,.5],[.35,.72],[.72,.82],[.5,.18]];
      for (var d=0; d<dots.length; d++) { ctx.beginPath(); ctx.arc(x+w*dots[d][0], y+h*dots[d][1], w*0.075, 0, Math.PI*2); ctx.fill(); }
    } else if (pat === "stripes") {
      ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = w*0.09;
      for (var s=-2; s<4; s++) { ctx.beginPath(); ctx.moveTo(x + s*w*0.35, y+h); ctx.lineTo(x + s*w*0.35 + h, y); ctx.stroke(); }
    } else if (pat === "heart") {
      drawHeart(x + w/2, y + h*0.5, w*0.30, "rgba(255,255,255,.95)");
    } else if (pat === "glitter") {
      ctx.fillStyle = "rgba(255,255,255,.95)";
      for (var k=0;k<12;k++) {
        var gx = x + w*(0.15+0.7*((k*37%100)/100)), gy = y + h*(0.12+0.76*((k*61%100)/100));
        var rr = w*(0.02+0.03*((k*13%5)/5));
        ctx.beginPath(); ctx.arc(gx,gy,rr,0,Math.PI*2); ctx.fill();
      }
    } else if (pat === "floral") {
      ctx.fillStyle = "rgba(255,255,255,.9)";
      drawFlower(x + w*0.32, y + h*0.38, w*0.14);
      drawFlower(x + w*0.68, y + h*0.7, w*0.11);
    }
    ctx.restore();
    // 甲面描边 + 立体高光
    ctx.strokeStyle = "rgba(0,0,0,.12)"; ctx.lineWidth = 1.2;
    roundRect(x, y, w, h, r); ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,.6)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x+w*0.2, y+h*0.16); ctx.lineTo(x+w*0.5, y+h*0.12); ctx.stroke();
    // 选中指甲时高亮圈
    if (i === hoverNail) {
      ctx.strokeStyle = "#e0508c"; ctx.lineWidth = 3.5;
      roundRect(x-3, y-3, w+6, h+6, r+3); ctx.stroke();
    }
  }
  function drawHeart(cx, cy, s, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(cx, cy + s*0.7);
    ctx.bezierCurveTo(cx - s*1.3, cy - s*0.2, cx - s*0.5, cy - s*1.1, cx, cy - s*0.35);
    ctx.bezierCurveTo(cx + s*0.5, cy - s*1.1, cx + s*1.3, cy - s*0.2, cx, cy + s*0.7);
    ctx.fill();
  }
  function drawFlower(cx, cy, r) {
    for (var p=0;p<5;p++) {
      var a = p*Math.PI*2/5;
      ctx.beginPath(); ctx.arc(cx + Math.cos(a)*r*0.6, cy + Math.sin(a)*r*0.6, r*0.42, 0, Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = "#ffd166";
    ctx.beginPath(); ctx.arc(cx, cy, r*0.34, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.9)";
  }
  var hoverNail = -1;
  function draw() {
    // 背景
    var g = ctx.createLinearGradient(0,0,0,size);
    g.addColorStop(0,"#fff7fa"); g.addColorStop(1,"#fbeaf3");
    ctx.fillStyle = g; ctx.fillRect(0,0,size,size);
    // 装饰闪光
    ctx.fillStyle = "rgba(255,182,214,.5)";
    var deco = [[.12,.08],[.9,.14],[.08,.52],[.93,.6],[.5,.03]];
    for (var i=0;i<deco.length;i++){ ctx.beginPath(); ctx.arc(size*deco[i][0],size*deco[i][1],3,0,Math.PI*2); ctx.fill(); }
    // 行标签
    ctx.fillStyle = "#c58aa8"; ctx.font = "bold 12px sans-serif"; ctx.textAlign="left"; ctx.textBaseline="alphabetic";
    ctx.fillText("左手", 8, size*0.10 - 8);
    ctx.fillText("右手", 8, size*0.55 - 8);
    for (var n=0;n<NAILS;n++) drawNail(n);
  }

  /* ---------- 交互 ---------- */
  function nailAt(px, py) {
    for (var i=0;i<NAILS;i++) {
      var R = nailRect(i);
      if (px>=R.x-8 && px<=R.x+R.w+8 && py>=R.y-8 && py<=R.y+R.h+8) return i;
    }
    return -1;
  }
  function applyTo(i) {
    nails[i] = { color: selColor, pattern: selPattern };
    sfxTap();
    hoverNail = i;
    draw(); save();
  }
  canvas.addEventListener("click", function (e) {
    if (quizPaused) return;
    var rect = canvas.getBoundingClientRect();
    var px = (e.clientX - rect.left) * (size / rect.width);
    var py = (e.clientY - rect.top) * (size / rect.height);
    var i = nailAt(px, py);
    if (i >= 0) applyTo(i);
  });
  canvas.addEventListener("mousemove", function (e) {
    var rect = canvas.getBoundingClientRect();
    var px = (e.clientX - rect.left) * (size / rect.width);
    var py = (e.clientY - rect.top) * (size / rect.height);
    var i = nailAt(px, py);
    if (i !== hoverNail) { hoverNail = i; draw(); }
  });

  // 颜色/花样面板
  var colorsEl = document.getElementById("colors"), patsEl = document.getElementById("pats");
  function buildPalette() {
    for (var i=0;i<COLORS.length;i++) {
      (function (idx) {
        var b = document.createElement("div");
        b.className = "swatch" + (idx===selColor?" sel":"");
        b.style.background = COLORS[idx];
        b.addEventListener("click", function () {
          selColor = idx;
          var sw = colorsEl.children; for (var j=0;j<sw.length;j++) sw[j].classList.toggle("sel", j===idx);
          sfxTap();
        });
        colorsEl.appendChild(b);
      })(i);
    }
    for (var p=0;p<PATTERNS.length;p++) {
      (function (idx) {
        var b = document.createElement("button");
        b.className = "pat" + (idx===selPattern?" sel":"");
        b.textContent = PATTERNS[idx].name;
        b.addEventListener("click", function () {
          selPattern = idx;
          var bs = patsEl.children; for (var j=0;j<bs.length;j++) bs[j].classList.toggle("sel", j===idx);
          sfxTap();
        });
        patsEl.appendChild(b);
      })(p);
    }
  }

  document.getElementById("randBtn").addEventListener("click", function () {
    for (var i=0;i<NAILS;i++) {
      nails[i] = { color: Math.floor(Math.random()*COLORS.length), pattern: Math.floor(Math.random()*PATTERNS.length) };
    }
    sfxNice(); draw(); save();
  });
  document.getElementById("clearBtn").addEventListener("click", function () {
    nails = emptyNails(); hoverNail = -1; beep(300,.12,"sine",.08); draw(); save();
  });
  soundBtn.addEventListener("click", function () { muted = !muted; refreshHud(); save(); if (!muted) sfxTap(); });
  document.getElementById("doneBtn").addEventListener("click", function () {
    var painted = 0, colorsUsed = {}, patsUsed = {}, sym = 0;
    for (var i=0;i<NAILS;i++) {
      if (nails[i].color >= 0) { painted++; colorsUsed[nails[i].color]=1; patsUsed[nails[i].pattern]=1; }
    }
    var colorVariety = Object.keys(colorsUsed).length;
    var patVariety = Object.keys(patsUsed).length;
    for (var k=0;k<5;k++) {
      if (nails[k].color>=0 && nails[k+5].color>=0 && nails[k].pattern===nails[k+5].pattern) sym++;
    }
    var score = Math.round(painted*3 + colorVariety*6 + patVariety*5 + sym*4);
    if (score > 100) score = 100;
    works++;
    var isBest = score > best;
    if (isBest) best = score;
    save(); refreshHud(); sfxNice();
    document.getElementById("ovText").textContent =
      "涂满 " + painted + "/10 个指甲 · " + colorVariety + " 种颜色 · " + patVariety + " 种花样 · 双手呼应 " + sym + " 对";
    document.getElementById("ovScore").textContent = score + " 分";
    document.getElementById("ovBest").textContent = isBest ? "🎉 刷新了你的最佳魅力值！" : ("最佳魅力：" + best + " 分");
    overlay.classList.remove("hidden");
  });
  document.getElementById("ovBtn").addEventListener("click", function () { overlay.classList.add("hidden"); });

  window.addEventListener("resize", setup);

  load(); buildPalette(); refreshHud(); setup();

  if (window.GameQuiz) {
    GameQuiz.init({
      isPlaying: function () { return overlay.classList.contains("hidden"); },
      onOpen: function () { quizPaused = true; },
      onClose: function () { quizPaused = false; },
      onReward: function () { beep(880,.12,"sine",.1); }
    });
  }
})();
</script>
</body>
