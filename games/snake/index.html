<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>🐍 贪吃蛇</title>
<link rel="stylesheet" href="../../theme.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; min-height:100%; overflow-x:hidden; font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
  body { background:linear-gradient(160deg,#e9ffe9 0%,#e8f6ff 55%,#fff6e5 100%);color:#3b2f2f; padding-bottom:calc(26px + env(safe-area-inset-bottom)); }
  .hero { text-align:center; padding:calc(20px + env(safe-area-inset-top)) 12px 4px; }
  .hero .logo { font-size:46px; animation:bob 3s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0) rotate(-5deg)} 50%{transform:translateY(-7px) rotate(5deg)} }
  .hero h1 { font-size:clamp(22px,6vw,30px); margin:4px 0; color:#43a047; }
  .hero p { font-size:13px; color:#8b7d7d; }
  .bar { display:flex; justify-content:center; gap:12px; margin:10px 0 12px; flex-wrap:wrap; }
  .pill { background:#fff; border:3px solid #a5d6a7; border-radius:999px; padding:7px 16px;
    font-size:16px; font-weight:800; color:#2e7d32; box-shadow:0 4px 0 #81c784; white-space:nowrap; }
  .wrap { max-width:500px; margin:0 auto; padding:0 12px; text-align:center; }
  .boardwrap { display:inline-block; padding:8px; border-radius:16px; background:linear-gradient(180deg,#c8e6c9,#a5d6a7);
    box-shadow:0 8px 18px rgba(60,120,60,.3); }
  canvas { display:block; border-radius:10px; background:#f4fff4; touch-action:none; }
  .pad { display:grid; grid-template-columns:repeat(3,64px); grid-template-rows:repeat(2,58px);
    gap:10px; justify-content:center; margin:18px auto 0; }
  .pad button { border:none; border-radius:16px; background:linear-gradient(180deg,#81C784,#4CAF50);
    box-shadow:0 5px 0 #388E3C; color:#fff; font-size:26px; font-weight:900; cursor:pointer; }
  .pad button:active { transform:translateY(3px); box-shadow:0 2px 0 #388E3C; }
  /* 移动端触摸适配：隐藏虚拟方向键显示，保留按钮及事件；操作用棋盘滑动手势 */
  .pad { display:none !important; }
  .newbtn { display:block; margin:16px auto 0; border:none; border-radius:999px; padding:12px 34px;
    font-size:18px; font-weight:900; color:#fff; background:linear-gradient(180deg,#ff8fab,#ff6b81);
    box-shadow:0 6px 0 #e84d68; cursor:pointer; }
  .newbtn:active { transform:translateY(3px); box-shadow:0 3px 0 #e84d68; }
  .overlay { position:fixed; inset:0; z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92); backdrop-filter:blur(4px); text-align:center; padding:20px; }
  .overlay.hidden { display:none; }
  .overlay .big { font-size:76px; animation:pop .6s ease; }
  @keyframes pop { 0%{transform:scale(.6)} 60%{transform:scale(1.15)} 100%{transform:scale(1)} }
  .overlay h2 { font-size:30px; color:#43a047; margin:8px 0; }
  .overlay p { font-size:18px; color:#6d6262; margin:6px 0 20px; }
  .overlay .btn { border:none; border-radius:999px; padding:14px 40px; font-size:22px; font-weight:900; color:#fff;
    background:linear-gradient(180deg,#81C784,#4CAF50); box-shadow:0 6px 0 #388E3C; cursor:pointer; }
</style>
</head>
<body>
<a class="home-btn" href="../../" aria-label="返回主页" title="返回主页">🏠</a>

<header class="hero">
  <div class="logo">🐍</div>
  <h1>贪吃蛇</h1>
  <p>在棋盘上滑动，带小蛇去吃苹果，越吃越长！别撞墙也别咬到自己哦。</p>
</header>

<div class="bar">
  <div class="pill">🍎 得分 <span id="score">0</span></div>
  <div class="pill">🏆 最高 <span id="best">0</span></div>
</div>

<div class="wrap">
  <div class="boardwrap"><canvas id="board"></canvas></div>
  <div class="pad">
    <button class="up" data-dir="up" aria-label="向上">↑</button>
    <button class="left" data-dir="left" aria-label="向左">←</button>
    <button class="down" data-dir="down" aria-label="向下">↓</button>
    <button class="right" data-dir="right" aria-label="向右">→</button>
  </div>
  <button class="newbtn" id="newBtn">🔄 重新开始</button>
</div>

<div class="overlay" id="startScreen">
  <div class="big">🐍🍎</div>
  <h2>贪吃蛇来啦！</h2>
  <p>吃苹果长身体，看看你能长多长～</p>
  <button class="btn" id="startBtn">开始游戏 ▶</button>
</div>
<div class="overlay hidden" id="endScreen">
  <div class="big">💥</div>
  <h2>游戏结束</h2>
  <p id="endText">这次得了 0 分！</p>
  <button class="btn" id="againBtn">再玩一次 🔄</button>
</div>

<script src="../../icons.js"></script>
<script src="../../quiz.js"></script>
<script src="../../save.js"></script>
<script>
(function () {
  "use strict";
  var COLS = 16, ROWS = 16;
  var appleImg = GameIcons.image("apple", function () { draw(); });
  var canvas = document.getElementById("board"), ctx = canvas.getContext("2d");
  var scoreEl = document.getElementById("score"), bestEl = document.getElementById("best");
  var startScreen = document.getElementById("startScreen"), endScreen = document.getElementById("endScreen");
  var boardEl = canvas.parentNode;
  var cell = 0, snake = [], dir = { x: 1, y: 0 }, nextDir = { x: 1, y: 0 };
  var food = null, score = 0, best = 0, playing = false, quizPaused = false;
  var loopTimer = null, tickMs = 150, ts = null;
  var SAVE_KEY = "snake";

  try { best = parseInt(localStorage.getItem("gbSnakeBest") || "0", 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  function setup() {
    var cssSize = Math.min(window.innerWidth - 60, 440, window.innerHeight - 380);
    if (cssSize < 240) cssSize = 240;
    var dpr = window.devicePixelRatio || 1;
    cell = cssSize / COLS;
    canvas.style.width = cssSize + "px"; canvas.style.height = cssSize + "px";
    canvas.width = Math.round(cssSize * dpr); canvas.height = Math.round(cssSize * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  function placeFood() {
    var free = [];
    for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) {
      var occupied = false;
      for (var i = 0; i < snake.length; i++) if (snake[i].x === c && snake[i].y === r) { occupied = true; break; }
      if (!occupied) free.push({ x: c, y: r });
    }
    food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }
  function saveGame() {
    if (!window.GameSave) return;
    GameSave.save(SAVE_KEY, {
      snake: snake, food: food, dir: dir, nextDir: nextDir,
      score: score, tickMs: tickMs
    });
  }
  function draw() {
    ctx.fillStyle = "#f4fff4"; ctx.fillRect(0, 0, COLS * cell, ROWS * cell);
    ctx.strokeStyle = "rgba(120,180,120,.15)"; ctx.lineWidth = 1;
    ctx.beginPath();
    for (var i = 0; i <= COLS; i++) { ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, ROWS * cell); ctx.moveTo(0, i * cell); ctx.lineTo(COLS * cell, i * cell); }
    ctx.stroke();
    if (food) {
      if (appleImg && appleImg.complete) {
        var s = cell * 0.92;
        ctx.drawImage(appleImg, food.x * cell + (cell - s) / 2, food.y * cell + (cell - s) / 2, s, s);
      } else {
        ctx.fillStyle = "#e53935"; ctx.beginPath();
        ctx.arc(food.x * cell + cell / 2, food.y * cell + cell / 2, cell * 0.34, 0, Math.PI * 2); ctx.fill();
      }
    }
    for (var s = snake.length - 1; s >= 0; s--) {
      var p = snake[s], head = s === 0;
      var pad = cell * 0.08, rad = cell * 0.24;
      var bx = p.x * cell + pad, by = p.y * cell + pad, bs = cell - 2 * pad;
      var sg = ctx.createLinearGradient(bx, by, bx, by + bs);
      if (head) { sg.addColorStop(0, "#7bc87f"); sg.addColorStop(.5, "#43a047"); sg.addColorStop(1, "#2e7d32"); }
      else if (s % 2) { sg.addColorStop(0, "#a5e6a8"); sg.addColorStop(1, "#5cb85c"); }
      else { sg.addColorStop(0, "#8fd694"); sg.addColorStop(1, "#45a049"); }
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(bx, by, bs, bs, rad) : ctx.rect(bx, by, bs, bs);
      ctx.fillStyle = sg; ctx.fill();
      // 顶部柔和高光
      ctx.fillStyle = "rgba(255,255,255,.28)";
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(bx + bs*.12, by + bs*.1, bs*.76, bs*.22, bs*.11) : ctx.rect(bx + bs*.12, by + bs*.1, bs*.76, bs*.22);
      ctx.fill();
      if (head) {
        ctx.fillStyle = "#fff";
        var ex = dir.x, ey = dir.y;
        ctx.beginPath(); ctx.arc(p.x * cell + cell / 2 + ex * cell * .18 - ey * cell * .16, p.y * cell + cell / 2 + ey * cell * .18 - ex * cell * .16, cell * .09, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(p.x * cell + cell / 2 + ex * cell * .18 + ey * cell * .16, p.y * cell + cell / 2 + ey * cell * .18 + ex * cell * .16, cell * .09, 0, Math.PI * 2); ctx.fill();
      }
    }
  }
  function setDir(nx, ny) {
    if (dir.x === -nx && dir.y === -ny) return;  // 不能直接掉头
    nextDir = { x: nx, y: ny };
  }
  function tick() {
    if (!playing || quizPaused) return;
    dir = nextDir;
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) { end(); return; }
    // 自撞检测：未吃食物时尾格会被 pop 释放，不应算作撞到自身
    var willEat = !!(food && head.x === food.x && head.y === food.y);
    var bodyLen = willEat ? snake.length : snake.length - 1;
    for (var i = 0; i < bodyLen; i++) if (snake[i].x === head.x && snake[i].y === head.y) { end(); return; }
    snake.unshift(head);
    if (food && head.x === food.x && head.y === food.y) {
      score++; scoreEl.textContent = score;
      if (score > best) { best = score; bestEl.textContent = best; try { localStorage.setItem("gbSnakeBest", String(best)); } catch (e) {} }
      placeFood();
      tickMs = Math.max(75, 150 - Math.floor(score / 3) * 6);
      schedule();
    } else {
      snake.pop();
    }
    draw();
    saveGame();
  }
  function schedule() {
    if (loopTimer) clearTimeout(loopTimer);
    loopTimer = null;
    if (playing && !quizPaused) loopTimer = setTimeout(function () { tick(); schedule(); }, tickMs);
  }
  function freshState() {
    snake = [{ x: 6, y: 8 }, { x: 5, y: 8 }, { x: 4, y: 8 }];
    dir = { x: 1, y: 0 }; nextDir = { x: 1, y: 0 };
    score = 0; scoreEl.textContent = score; tickMs = 150;
    placeFood();
  }
  function begin() {
    playing = true; quizPaused = false;
    startScreen.classList.add("hidden"); endScreen.classList.add("hidden");
    draw(); schedule();
  }
  function reset(fresh) {
    var saved = fresh ? null : (window.GameSave ? GameSave.load(SAVE_KEY, null) : null);
    var restored = false;
    if (saved && Array.isArray(saved.snake) && saved.snake.length) {
      // 尽可能恢复蛇身：只保留坐标有效的节点，结构变化/个别坏点也不整盘丢弃
      var body = [];
      for (var i = 0; i < saved.snake.length; i++) {
        var s = saved.snake[i];
        if (s && typeof s.x === "number" && typeof s.y === "number" && isFinite(s.x) && isFinite(s.y)
            && s.x >= 0 && s.x < COLS && s.y >= 0 && s.y < ROWS) {
          body.push({ x: s.x, y: s.y });
        }
      }
      if (body.length) {
        snake = body;
        dir = (saved.dir && typeof saved.dir.x === "number" && typeof saved.dir.y === "number") ? saved.dir : { x: 1, y: 0 };
        nextDir = (saved.nextDir && typeof saved.nextDir.x === "number" && typeof saved.nextDir.y === "number") ? saved.nextDir : dir;
        score = (typeof saved.score === "number" && isFinite(saved.score) && saved.score >= 0) ? saved.score : 0;
        tickMs = (typeof saved.tickMs === "number" && isFinite(saved.tickMs) && saved.tickMs > 0) ? saved.tickMs : 150;
        scoreEl.textContent = score;
        if (score > best) { best = score; bestEl.textContent = best; try { localStorage.setItem("gbSnakeBest", String(best)); } catch (e) {} }
        // 食物坐标有效则恢复，否则按当前蛇身重新放置，避免食物落在蛇身上
        if (saved.food && typeof saved.food.x === "number" && typeof saved.food.y === "number"
            && saved.food.x >= 0 && saved.food.x < COLS && saved.food.y >= 0 && saved.food.y < ROWS) {
          food = { x: saved.food.x, y: saved.food.y };
        } else {
          placeFood();
        }
        restored = true;
      }
    }
    if (restored) {
      begin();
    } else {
      freshState();
      if (fresh) begin();
      else { draw(); startScreen.classList.remove("hidden"); }
    }
    if (fresh && window.GameSave) GameSave.clear(SAVE_KEY);
  }
  function end() {
    playing = false;
    if (loopTimer) { clearTimeout(loopTimer); loopTimer = null; }
    if (window.GameSave) GameSave.clear(SAVE_KEY);
    document.getElementById("endText").textContent = "这次吃了 " + score + " 个苹果，得分 " + score + "！";
    endScreen.classList.remove("hidden");
  }

  var padBtns = document.querySelectorAll(".pad button");
  for (var p = 0; p < padBtns.length; p++) {
    (function (b) {
      var d = b.dataset.dir;
      var map = { up: [0,-1], down: [0,1], left: [-1,0], right: [1,0] };
      b.addEventListener("click", function () { if (playing) setDir(map[d][0], map[d][1]); });
    })(padBtns[p]);
  }
  document.addEventListener("keydown", function (e) {
    var map = { ArrowLeft: [-1,0], ArrowRight: [1,0], ArrowUp: [0,-1], ArrowDown: [0,1], a: [-1,0], d: [1,0], w: [0,-1], s: [0,1] };
    var v = map[e.key]; if (v && playing) { e.preventDefault(); setDir(v[0], v[1]); }
  });
  canvas.parentNode.addEventListener("touchstart", function (e) {
    var t = e.changedTouches[0]; ts = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  canvas.parentNode.addEventListener("touchend", function (e) {
    if (!ts || !playing) return;
    var t = e.changedTouches[0], dx = t.clientX - ts.x, dy = t.clientY - ts.y;
    ts = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
  }, { passive: true });
  document.getElementById("startBtn").addEventListener("click", function () { reset(true); });
  document.getElementById("againBtn").addEventListener("click", function () { reset(true); });
  document.getElementById("newBtn").addEventListener("click", function () { reset(true); });
  window.addEventListener("resize", setup);

  setup();
  reset(false);

  if (window.GameQuiz) {
    GameQuiz.init({
      isPlaying: function () { return playing; },
      onOpen: function () { quizPaused = true; if (loopTimer) { clearTimeout(loopTimer); loopTimer = null; } },
      onClose: function () { quizPaused = false; schedule(); }
    });
  }
})();
</script>
</body>
</html>
