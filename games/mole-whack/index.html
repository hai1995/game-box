<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>🔨 打地鼠</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; min-height:100%; overflow-x:hidden; font-family:"PingFang SC","Microsoft YaHei","Comic Sans MS",system-ui,sans-serif; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
  body { background:linear-gradient(180deg,#a8e6a1 0%,#d4f5c4 55%,#fff3c4 100%); background-attachment:fixed; color:#3b2f2f; }
  .home-btn { position:fixed; left:12px; top:calc(12px + env(safe-area-inset-top)); z-index:30;
    width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,.92);
    border:3px solid #ffb703; box-shadow:0 4px 0 rgba(0,0,0,.14); color:#d62828;
    display:flex; align-items:center; justify-content:center; font-size:26px; text-decoration:none; }
  .home-btn:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.14); }
  .hero { text-align:center; padding:calc(16px + env(safe-area-inset-top)) 12px 4px; }
  .hero h1 { font-size:clamp(24px,6.5vw,32px); color:#e07a00; text-shadow:0 2px 0 #fff; }
  .hero p { font-size:13px; color:#6b7a5a; margin-top:2px; }
  .hud { display:flex; justify-content:center; gap:12px; margin:10px 0 14px; flex-wrap:wrap; }
  .pill { background:#fff; border:3px solid #6bcb77; border-radius:999px; padding:6px 16px;
    font-size:clamp(15px,4.5vw,19px); font-weight:800; color:#2f9e44; box-shadow:0 4px 0 #4caf50; white-space:nowrap; }
  .pill.time { border-color:#ff9f1c; color:#e8590c; box-shadow:0 4px 0 #f08c00; }
  .field { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; max-width:450px; margin:0 auto; padding:0 14px; }
  .hole { position:relative; aspect-ratio:1/1; border-radius:50%;
    background:radial-gradient(ellipse at 50% 35%, #5b3a1e 0%, #3d2612 60%, #6b4423 100%);
    box-shadow:inset 0 8px 14px rgba(0,0,0,.5), 0 3px 0 #2e1c0d; overflow:hidden; }
  .mole { position:absolute; left:0; right:0; bottom:0; height:82%;
    display:flex; align-items:flex-start; justify-content:center;
    transform:translateY(105%); transition:transform .16s cubic-bezier(.2,1.4,.4,1); cursor:pointer; line-height:1; }
  .mole svg { width:88%; height:88%; display:block; filter:drop-shadow(0 3px 2px rgba(0,0,0,.3)); }
  .hole.up .mole { transform:translateY(6%); }
  .mole.bomb { filter:none; }
  .mole.hit { animation:hit .3s ease forwards; }
  @keyframes hit { 50%{transform:translateY(6%) scale(1.25) rotate(-12deg)} 100%{transform:translateY(6%) scale(.6); opacity:0} }
  .fx { position:absolute; z-index:20; font-size:30px; font-weight:900; pointer-events:none; animation:fly .8s ease-out forwards; }
  @keyframes fly { to { transform:translateY(-60px) scale(1.4); opacity:0; } }
  .overlay { position:fixed; inset:0; z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92); backdrop-filter:blur(4px); text-align:center; }
  .overlay.hidden { display:none; }
  .overlay .big { font-size:82px; }
  .overlay h2 { font-size:32px; color:#e07a00; margin:8px 0; }
  .overlay p { font-size:19px; color:#6d6262; margin:6px 0 20px; }
  .btn { border:none; border-radius:999px; padding:14px 42px; font-size:22px; font-weight:900; color:#fff;
    background:linear-gradient(180deg,#6bcb77,#2f9e44); box-shadow:0 6px 0 #237a33; cursor:pointer; }
  .btn:active { transform:translateY(3px); box-shadow:0 3px 0 #237a33; }
</style>
</head>
<body>
<a class="home-btn" href="../../" aria-label="返回主页" title="返回主页">🏠</a>

<header class="hero">
  <h1>🔨 打地鼠</h1>
  <p>打到地鼠得分，千万别打炸弹 💣！</p>
</header>

<div class="hud">
  <div class="pill">⭐ <span id="score">0</span> 分</div>
  <div class="pill time">⏱ <span id="time">60</span> 秒</div>
</div>

<div class="field" id="field"></div>

<div class="overlay" id="startScreen">
  <div class="big">🔨🐹</div>
  <h2>打地鼠啦！</h2>
  <p>60 秒内打到越多地鼠越好～</p>
  <button class="btn" id="startBtn">开始游戏 ▶</button>
</div>

<div class="overlay hidden" id="endScreen">
  <div class="big">🏆</div>
  <h2>时间到！</h2>
  <p id="endText">你打到了 0 分！</p>
  <button class="btn" id="againBtn">再玩一次 🔄</button>
</div>

<script src="../../icons.js"></script>
<script src="../../quiz.js"></script>
<script>
(function () {
  "use strict";
  var field = document.getElementById("field");
  var scoreEl = document.getElementById("score");
  var timeEl = document.getElementById("time");
  var startScreen = document.getElementById("startScreen");
  var endScreen = document.getElementById("endScreen");
  var holes = [];
  var ROUND_SECONDS = 60;
  var score = 0, time = ROUND_SECONDS, playing = false;
  var popTimer = null, tickTimer = null;

  function build() {
    field.innerHTML = "";
    holes = [];
    for (var i = 0; i < 9; i++) {
      var hole = document.createElement("div");
      hole.className = "hole";
      var mole = document.createElement("div");
      mole.className = "mole";
      hole.appendChild(mole);
      hole._mole = mole;
      hole._up = false;
      mole.addEventListener("click", function (e) {
        e.stopPropagation();
        var h = e.currentTarget.parentNode;
        hit(h);
      });
      holes.push(hole);
      field.appendChild(hole);
    }
  }

  function clearMoles() {
    holes.forEach(function (h) {
      h._up = false;
      h.classList.remove("up");
      h._mole.classList.remove("hit", "bomb");
      h._mole.innerHTML = "";
      h._isBomb = false;
    });
  }

  function popOne() {
    if (!playing) return;
    clearMoles();
    var idx = Math.floor(Math.random() * holes.length);
    var h = holes[idx];
    var isBomb = Math.random() < 0.22;
    h._isBomb = isBomb;
    h._mole.innerHTML = GameIcons.get(isBomb ? "bomb" : "hamster");
    h._up = true;
    h.classList.add("up");
    var dur = isBomb ? 900 : Math.max(650, 1400 - (ROUND_SECONDS - time) * 12);
    h._hideTimer = setTimeout(function () {
      if (h._up === true && h.classList.contains("up")) {
        h.classList.remove("up");
        h._up = false;
      }
    }, dur);
    popTimer = setTimeout(popOne, dur + rnd(80, 320));
  }

  function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }

  function fx(hole, txt, color) {
    var r = hole.getBoundingClientRect();
    var f = document.createElement("div");
    f.className = "fx";
    f.textContent = txt;
    f.style.color = color;
    f.style.left = (r.left + r.width / 2 - 12) + "px";
    f.style.top = (r.top + r.height / 2) + "px";
    document.body.appendChild(f);
    setTimeout(function () { f.remove(); }, 800);
  }

  function hit(h) {
    if (!playing || !h._up) return;
    h._up = false;
    h._mole.classList.add("hit");
    if (h._isBomb) {
      score = Math.max(0, score - 3);
      fx(h, "-3 💥", "#e03131");
    } else {
      score += 1;
      fx(h, "+1 ⭐", "#2f9e44");
    }
    scoreEl.textContent = score;
    setTimeout(function () { h.classList.remove("up"); }, 280);
  }

  function tick() {
    time--;
    timeEl.textContent = time;
    if (time <= 0) end();
  }

  function start() {
    score = 0; time = ROUND_SECONDS; playing = true;
    scoreEl.textContent = "0"; timeEl.textContent = String(ROUND_SECONDS);
    startScreen.classList.add("hidden");
    endScreen.classList.add("hidden");
    clearMoles();
    popOne();
    tickTimer = setInterval(tick, 1000);
  }

  function end() {
    playing = false;
    clearTimeout(popTimer);
    clearInterval(tickTimer);
    clearMoles();
    endScreen.classList.remove("hidden");
    document.getElementById("endText").textContent = "你打到了 " + score + " 分！";
  }

  document.getElementById("startBtn").addEventListener("click", start);
  document.getElementById("againBtn").addEventListener("click", start);

  // 接入公共定时做题模块：弹窗时冻结倒计时与地鼠，关闭后恢复
  if (window.GameQuiz) {
    GameQuiz.init({
      isPlaying: function () { return playing; },
      onOpen: function () {
        clearTimeout(popTimer);
        clearInterval(tickTimer);
        clearMoles();
      },
      onClose: function () {
        if (playing) { popOne(); tickTimer = setInterval(tick, 1000); }
      }
    });
  }
  build();
})();
</script>
</body>
</html>
