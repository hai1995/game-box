<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>👀 火眼金睛找不同</title>
<link rel="stylesheet" href="../../theme.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; min-height:100%; overflow-x:hidden; font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
  body { background:linear-gradient(160deg,#fff0f6 0%,#f0e9ff 55%,#e6f7ff 100%);color:#3b2f2f; padding-bottom:calc(26px + env(safe-area-inset-bottom)); }
  .hero { text-align:center; padding:calc(20px + env(safe-area-inset-top)) 12px 4px; }
  .hero .logo { font-size:46px; animation:bob 3s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0) rotate(-5deg)} 50%{transform:translateY(-7px) rotate(5deg)} }
  .hero h1 { font-size:clamp(22px,6vw,30px); margin:4px 0; color:#8e24aa; }
  .hero p { font-size:13px; color:#8b7d7d; }
  .bar { display:flex; justify-content:center; gap:12px; margin:10px 0 12px; flex-wrap:wrap; }
  .pill { background:#fff; border:3px solid #e1bee7; border-radius:999px; padding:7px 16px;
    font-size:16px; font-weight:800; color:#8e24aa; box-shadow:0 4px 0 #ce93d8; white-space:nowrap; }
  .pill.time { color:#e07a00; border-color:#ffd23f; box-shadow:0 4px 0 #f0c000; }
  .wrap { max-width:520px; margin:0 auto; padding:0 12px; text-align:center; }
  .board { display:grid; gap:6px; width:100%; max-width:440px; aspect-ratio:1/1; margin:0 auto; padding:10px;
    background:#fff; border-radius:20px; box-shadow:0 8px 18px rgba(140,80,160,.25); }
  .cell { border-radius:12px; display:flex; align-items:center; justify-content:center; cursor:pointer;
    padding:12%; background:linear-gradient(180deg,#f7f0ff,#efe3ff); box-shadow:0 3px 0 rgba(140,90,170,.15);
    user-select:none; transition:transform .08s; }
  .cell svg { width:100%; height:100%; display:block; filter:drop-shadow(0 1px 1px rgba(90,60,120,.25)); }
  .cell:active { transform:scale(.92); }
  .cell.right { animation:rightPop .4s ease; background:linear-gradient(180deg,#a5d6a7,#81c784); box-shadow:0 3px 0 #4caf50; }
  .cell.wrong { animation:wrongShake .35s; }
  @keyframes rightPop { 0%{transform:scale(1)} 50%{transform:scale(1.2) rotate(8deg)} 100%{transform:scale(1)} }
  @keyframes wrongShake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .newbtn { display:block; margin:16px auto 0; border:none; border-radius:999px; padding:12px 34px;
    font-size:18px; font-weight:900; color:#fff; background:linear-gradient(180deg,#ff8fab,#ff6b81);
    box-shadow:0 6px 0 #e84d68; cursor:pointer; }
  .newbtn:active { transform:translateY(3px); box-shadow:0 3px 0 #e84d68; }
  .overlay { position:fixed; inset:0; z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92); backdrop-filter:blur(4px); text-align:center; padding:20px; }
  .overlay.hidden { display:none; }
  .overlay .big { font-size:76px; animation:pop .6s ease; }
  @keyframes pop { 0%{transform:scale(.6)} 60%{transform:scale(1.15)} 100%{transform:scale(1)} }
  .overlay h2 { font-size:30px; color:#8e24aa; margin:8px 0; }
  .overlay p { font-size:18px; color:#6d6262; margin:6px 0 20px; }
  .overlay .btn { border:none; border-radius:999px; padding:14px 40px; font-size:22px; font-weight:900; color:#fff;
    background:linear-gradient(180deg,#ba68c8,#8e24aa); box-shadow:0 6px 0 #6a1b9a; cursor:pointer; }
</style>
</head>
<body>
<a class="home-btn" href="../../" aria-label="返回主页" title="返回主页">🏠</a>

<header class="hero">
  <div class="logo">👀</div>
  <h1>火眼金睛找不同</h1>
  <p>一堆一样的表情里藏着一个不一样的，快把它找出来！越往后格子越多哦。</p>
</header>

<div class="bar">
  <div class="pill">🎯 第 <span id="level">1</span> 关</div>
  <div class="pill">🏆 得分 <span id="score">0</span></div>
  <div class="pill time">⏰ <span id="time">20</span> 秒</div>
</div>

<div class="wrap">
  <div class="board" id="board"></div>
  <button class="newbtn" id="newBtn">🔄 重新开始</button>
</div>

<div class="overlay" id="startScreen">
  <div class="big">👀✨</div>
  <h2>火眼金睛！</h2>
  <p>找出那个不一样的表情，关卡越高越有挑战～</p>
  <button class="btn" id="startBtn">开始游戏 ▶</button>
</div>
<div class="overlay hidden" id="overlay">
  <div class="big" id="ovIcon">🎉</div>
  <h2 id="ovTitle">过关啦！</h2>
  <p id="ovText"></p>
  <button class="btn" id="ovBtn">继续</button>
</div>

<script src="../../icons.js"></script>
<script src="../../quiz.js"></script>
<script src="../../save.js"></script>
<script>
(function () {
  "use strict";
  var ICONS = ["apple","orange","lemon","watermelon","grapes","strawberry","cherry","peach","kiwi","dog","cat","panda","fox","frog","star","flower"];
  var boardEl = document.getElementById("board");
  var levelEl = document.getElementById("level"), scoreEl = document.getElementById("score"), timeEl = document.getElementById("time");
  var startScreen = document.getElementById("startScreen"), overlay = document.getElementById("overlay");
  var ovIcon = document.getElementById("ovIcon"), ovTitle = document.getElementById("ovTitle"), ovText = document.getElementById("ovText"), ovBtn = document.getElementById("ovBtn");
  var SAVE_KEY = "find-difference";
  var saved = window.GameSave ? GameSave.load(SAVE_KEY, null) : null;
  // 兼容旧字段并取历史最高关卡，结构/字段调整都不回退进度
  function readMaxLevel(s) {
    var m = 1;
    if (s && typeof s.maxLevel === "number" && s.maxLevel >= 1) m = Math.floor(s.maxLevel);
    if (s && typeof s.level === "number" && s.level >= 1) m = Math.max(m, Math.floor(s.level));
    return m;
  }
  var maxLevel = readMaxLevel(saved);
  var startLevel = maxLevel;
  var startScore = saved && saved.score > 0 ? Math.floor(saved.score) : 0;
  var level = startLevel, score = startScore, timeLeft = 20, timer = null, diffIdx = -1, diffKey = "", cells = [];
  var playing = false, quizPaused = false, locked = false;
  var winTimer = null; // 过关弹窗延时句柄，重开时清除，避免旧回调弹出过关层

  function saveProgress() {
    startLevel = level; startScore = score;
    maxLevel = Math.max(maxLevel, level);
    if (window.GameSave) GameSave.save(SAVE_KEY, { level: level, maxLevel: maxLevel, score: score });
  }

  function gridSize() { return Math.min(3 + level - 1, 6); }  // 3x3 起，每关+1，最多 6x6
  function roundSeconds() { return Math.max(10, 22 - Math.floor(level / 2)); } // 时间随关卡略减，下限 10 秒

  function build() {
    var n = gridSize(), total = n * n;
    boardEl.style.gridTemplateColumns = "repeat(" + n + ",1fr)";
    boardEl.style.gridTemplateRows = "repeat(" + n + ",1fr)";
    var base = ICONS[Math.floor(Math.random() * ICONS.length)];
    var other = ICONS[Math.floor(Math.random() * ICONS.length)];
    while (other === base) other = ICONS[Math.floor(Math.random() * ICONS.length)];
    diffIdx = Math.floor(Math.random() * total);
    diffKey = other;
    boardEl.innerHTML = ""; cells = [];
    for (var i = 0; i < total; i++) {
      var d = document.createElement("div");
      d.className = "cell";
      d.innerHTML = GameIcons.get(i === diffIdx ? other : base);
      (function (idx, el) { el.addEventListener("click", function () { tap(idx, el); }); })(i, d);
      boardEl.appendChild(d); cells.push(d);
    }
  }
  function tap(idx, el) {
    if (!playing || quizPaused || locked) return;
    if (idx === diffIdx) {
      locked = true;
      el.classList.add("right");
      score += 10 + level * 2; scoreEl.textContent = score;
      // 通过本关即固化下一关进度，避免点"继续"前刷新导致进度回退
      maxLevel = Math.max(maxLevel, level + 1);
      if (window.GameSave) GameSave.save(SAVE_KEY, { level: level, maxLevel: maxLevel, score: score });
      saveProgress();
      clearInterval(timer);
      winTimer = setTimeout(function () {
        winTimer = null;
        locked = false;
        overlay.classList.remove("hidden");
      }, 420);
    } else {
      el.classList.remove("wrong"); void el.offsetWidth; el.classList.add("wrong");
      setTimeout(function () { el.classList.remove("wrong"); }, 360);
    }
  }
  function startTimer() {
    if (timer) clearInterval(timer);
    timeLeft = roundSeconds(); timeEl.textContent = timeLeft;
    timer = setInterval(function () {
      if (!playing || quizPaused || locked) return;
      timeLeft--; timeEl.textContent = timeLeft;
      if (timeLeft <= 0) {
        playing = false; clearInterval(timer);
        ovIcon.textContent = "⏰"; ovTitle.textContent = "时间到！";
        ovText.innerHTML = "那个不一样的是 " + GameIcons.get(diffKey).replace("<svg ", '<svg style="width:32px;height:32px;vertical-align:middle" ') + " ，你已经得了 " + score + " 分！";
        ovBtn.textContent = "重新开始 🔄";
        overlay.classList.remove("hidden");
      }
    }, 1000);
  }
  function nextLevel() {
    level++; levelEl.textContent = level;
    saveProgress();
    build(); startTimer();
    overlay.classList.add("hidden");
  }
  function start() {
    if (winTimer) { clearTimeout(winTimer); winTimer = null; }
    level = startLevel; score = startScore;
    levelEl.textContent = level; scoreEl.textContent = score;
    playing = true; quizPaused = false; locked = false;
    startScreen.classList.add("hidden"); overlay.classList.add("hidden");
    build(); startTimer();
  }

  ovBtn.addEventListener("click", function () {
    if (playing) nextLevel(); else start();
  });
  document.getElementById("startBtn").addEventListener("click", start);
  document.getElementById("newBtn").addEventListener("click", start);

  // 初始先摆一盘作为背景，并显示已恢复的关卡/得分
  levelEl.textContent = level; scoreEl.textContent = score;
  build();

  if (window.GameQuiz) {
    GameQuiz.init({
      isPlaying: function () { return playing && overlay.classList.contains("hidden") && startScreen.classList.contains("hidden"); },
      onOpen: function () { quizPaused = true; },
      onClose: function () { quizPaused = false; }
    });
  }
})();
</script>
</body>
</html>
