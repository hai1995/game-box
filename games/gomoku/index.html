<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>⚫ 五子棋</title>
<link rel="stylesheet" href="../../theme.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; min-height:100%; overflow-x:hidden; font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
  body { background:linear-gradient(160deg,#fff3e0 0%,#e8f5ff 55%,#f3e9ff 100%);color:#3b2f2f; padding-bottom:calc(26px + env(safe-area-inset-bottom)); }
  .home-btn { position:fixed; left:12px; top:calc(12px + env(safe-area-inset-top)); z-index:30;
    width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,.92);
    border:3px solid #ffb703; box-shadow:0 4px 0 rgba(0,0,0,.14); color:#d62828;
    display:flex; align-items:center; justify-content:center; font-size:26px; text-decoration:none; }
  .home-btn:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.14); }
  .hero { text-align:center; padding:calc(20px + env(safe-area-inset-top)) 12px 4px; }
  .hero .logo { font-size:46px; animation:bob 3s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0) rotate(-5deg)} 50%{transform:translateY(-7px) rotate(5deg)} }
  .hero h1 { font-size:clamp(22px,6vw,30px); margin:4px 0; color:#e07a00; }
  .hero p { font-size:13px; color:#8b7d7d; max-width:420px; margin:0 auto; }
  .bar { display:flex; justify-content:center; align-items:center; gap:10px; margin:12px 0 4px; flex-wrap:wrap; }
  .pill { background:#fff; border:3px solid #ffd23f; border-radius:999px; padding:7px 16px;
    font-size:16px; font-weight:800; color:#e07a00; box-shadow:0 4px 0 #f0c000; white-space:nowrap; }
  #turnPill.black { color:#333; border-color:#888; box-shadow:0 4px 0 #999; }
  #turnPill.white { color:#6b4a2f; border-color:#ffb703; box-shadow:0 4px 0 #e08600; }
  #turnPill.think { color:#1565c0; border-color:#64b5f6; box-shadow:0 4px 0 #42a5f5; }
  /* 电脑等级选择 */
  .levels { display:flex; justify-content:center; align-items:center; gap:7px; margin:2px 0 10px; flex-wrap:wrap; }
  .levels .lab { font-size:13px; font-weight:800; color:#8b7d7d; margin-right:2px; }
  .levels button { border:3px solid #ffd23f; background:#fff; color:#e07a00; border-radius:999px;
    padding:5px 15px; font-size:14px; font-weight:900; cursor:pointer; box-shadow:0 3px 0 #f0c000; }
  .levels button:active { transform:translateY(2px); box-shadow:0 1px 0 #f0c000; }
  .levels button.active { background:linear-gradient(180deg,#ffca5b,#f5a623); color:#fff; border-color:#fff; box-shadow:0 3px 0 #d98609; }
  .levels.hidden { display:none; }
  .wrap { max-width:500px; margin:0 auto; padding:0 16px; text-align:center; }
  /* 缩放视口：放大后可滚动平移查看边缘；未超出时棋盘自动居中 */
  .board-viewport { max-width:100%; max-height:64vh; overflow:auto; -webkit-overflow-scrolling:touch;
    margin:0 auto; border-radius:18px; }
  .boardbox { display:block; width:-moz-fit-content; width:fit-content; margin:0 auto; padding:10px;
    border-radius:18px; background:linear-gradient(180deg,#d9a86c,#c98f4e);
    box-shadow:0 8px 18px rgba(120,80,40,.35), inset 0 2px 4px rgba(255,255,255,.4); }
  canvas { display:block; border-radius:10px; touch-action:auto; }
  /* 缩放控制条 */
  .zoombar { display:flex; justify-content:center; align-items:center; gap:10px; margin:2px 0 10px; }
  .zoombar .zbtn { border:3px solid #ffd23f; background:#fff; color:#e07a00; border-radius:999px;
    min-width:42px; height:38px; padding:0 12px; font-size:21px; font-weight:900; line-height:1;
    cursor:pointer; box-shadow:0 3px 0 #f0c000; }
  .zoombar .zbtn.reset { font-size:13px; min-width:54px; background:#fff8e1; }
  .zoombar .zbtn:active { transform:translateY(2px); box-shadow:0 1px 0 #f0c000; }
  .zoombar .zlabel { display:inline-block; min-width:58px; text-align:center; font-size:14px;
    font-weight:900; color:#8b5a00; background:#fff3cd; border:2px solid #ffd23f;
    border-radius:999px; padding:5px 8px; }
  .tools { display:flex; justify-content:center; gap:12px; margin:16px 0 4px; flex-wrap:wrap; }
  .btn { border:none; border-radius:999px; padding:12px 24px; font-size:17px; font-weight:900; color:#fff; cursor:pointer;
    box-shadow:0 5px 0 rgba(0,0,0,.16); }
  .btn:active { transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.16); }
  .btn.undo { background:linear-gradient(180deg,#64B5F6,#42A5F5); box-shadow:0 5px 0 #1976D2; }
  .btn.restart { background:linear-gradient(180deg,#ff8fab,#ff6b81); box-shadow:0 5px 0 #e84d68; }
  .btn.mode { background:linear-gradient(180deg,#81C784,#4CAF50); box-shadow:0 5px 0 #388E3C; }
  .overlay { position:fixed; inset:0; z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92); backdrop-filter:blur(4px); text-align:center; padding:20px; }
  .overlay.hidden { display:none; }
  .overlay .big { font-size:76px; animation:pop .6s ease; }
  @keyframes pop { 0%{transform:scale(.6)} 60%{transform:scale(1.15)} 100%{transform:scale(1)} }
  .overlay h2 { font-size:30px; color:#e07a00; margin:8px 0; }
  .overlay p { font-size:18px; color:#6d6262; margin:6px 0 20px; }
  .overlay .btn { background:linear-gradient(180deg,#81C784,#4CAF50); box-shadow:0 5px 0 #388E3C; }
</style>
</head>
<body>
<a class="home-btn" href="../../" aria-label="返回主页" title="返回主页">🏠</a>

<header class="hero">
  <div class="logo">⚫</div>
  <h1>五子棋</h1>
  <p>你执黑棋先走，谁先把五颗连成一条线谁就赢！棋盘更大、更好玩，还能自选电脑难度。</p>
</header>

<div class="bar">
  <div class="pill" id="turnPill">⚫ 轮到你啦</div>
  <div class="pill">步数 <span id="steps">0</span></div>
</div>
<div class="levels" id="levels">
  <span class="lab">🤖 电脑等级</span>
  <button type="button" data-level="low" class="active">低</button>
  <button type="button" data-level="mid">中</button>
  <button type="button" data-level="high">高</button>
</div>

<div class="wrap">
  <div class="zoombar">
    <button type="button" class="zbtn" id="zoomOut" aria-label="缩小棋盘">−</button>
    <span class="zlabel" id="zoomLabel">100%</span>
    <button type="button" class="zbtn" id="zoomIn" aria-label="放大棋盘">＋</button>
    <button type="button" class="zbtn reset" id="zoomReset">复位</button>
  </div>
  <div class="board-viewport" id="boardViewport">
    <div class="boardbox"><canvas id="board"></canvas></div>
  </div>
  <div class="tools">
    <button class="btn mode" id="modeBtn">🤖 对战电脑</button>
    <button class="btn undo" id="undoBtn">↩️ 悔棋</button>
    <button class="btn restart" id="restartBtn">🔄 重新开始</button>
  </div>
</div>

<div class="overlay hidden" id="overlay">
  <div class="big" id="ovIcon">🎉</div>
  <h2 id="ovTitle">你赢啦！</h2>
  <p id="ovText">五个连成一线，太厉害了！</p>
  <button class="btn" id="ovBtn">再来一局</button>
</div>

<script src="../../icons.js"></script>
<script src="../../quiz.js"></script>
<script src="../../save.js"></script>
<script>
(function () {
  "use strict";
  var N = 19;                       // 棋盘 19×19（从 15 增大，游玩更久）
  var DIRS = [[0,1],[1,0],[1,1],[1,-1]];
  var SAVE_KEY = "gomoku";
  var canvas = document.getElementById("board"), ctx = canvas.getContext("2d");
  var turnPill = document.getElementById("turnPill"), stepsEl = document.getElementById("steps");
  var modeBtn = document.getElementById("modeBtn"), levelsEl = document.getElementById("levels");
  var levelBtns = levelsEl.querySelectorAll("button[data-level]");
  var overlay = document.getElementById("overlay");
  var viewport = document.getElementById("boardViewport"), zoomLabel = document.getElementById("zoomLabel");
  var board = [], moves = [], current = 1, finished = false, quizPaused = false, cell = 0, size = 0, baseSize = 0;
  var mode = "ai";                  // "ai"=对战电脑(默认)，"pvp"=双人对战
  var level = "low";                // 电脑等级：low(默认) / mid / high
  var ZOOM_MIN = 70, ZOOM_MAX = 250, ZOOM_STEP = 20;
  var zoomPct = 100;                // 棋盘缩放百分比（70%~250%，默认 100%）
  var lastMove = null;              // 最近一次落子（用于闪烁光晕提示）
  var aiTimer = null, aiThinking = false;
  var raf = 0;
  // 静态棋盘离屏缓存：网格/星位/棋子只画一次，每帧仅叠加最近落子光晕
  var staticCv = document.createElement("canvas"), sctx = staticCv.getContext("2d"), staticDirty = true;

  function emptyBoard(n) {
    var b = [];
    for (var r = 0; r < n; r++) { b[r] = []; for (var c = 0; c < n; c++) b[r][c] = 0; }
    return b;
  }
  function saveGame() {
    if (!window.GameSave) return;
    GameSave.save(SAVE_KEY, { board: board, moves: moves, current: current, mode: mode, level: level, n: N, zoomPct: zoomPct });
  }
  // 通用校验：接受任意边长 n 的棋盘 / 走子列表（用于旧版棋盘迁移）
  function validBoardOf(b, n) {
    if (!Array.isArray(b) || b.length !== n) return false;
    for (var r = 0; r < n; r++) {
      if (!Array.isArray(b[r]) || b[r].length !== n) return false;
      for (var c = 0; c < n; c++) {
        var v = b[r][c];
        if (v !== 0 && v !== 1 && v !== 2) return false;
      }
    }
    return true;
  }
  function validMovesOf(mv, n) {
    if (!Array.isArray(mv)) return false;
    for (var i = 0; i < mv.length; i++) {
      var m = mv[i];
      if (!m || typeof m.r !== "number" || m.r % 1 !== 0 || m.r < 0 || m.r >= n ||
          typeof m.c !== "number" || m.c % 1 !== 0 || m.c < 0 || m.c >= n ||
          (m.color !== 1 && m.color !== 2)) return false;
    }
    return true;
  }

  function setup() {
    var cssSize = Math.min(560, window.innerWidth - 40, 520);
    if (cssSize < 260) cssSize = 260;
    baseSize = cssSize;                 // 逻辑基准边长，缩放在此基础上叠加
    applyZoom();
  }
  // 依据当前缩放比例设置画布的实际显示/物理尺寸并居中视口
  function applyZoom() {
    size = Math.round(baseSize * zoomPct / 100);
    if (size < 160) size = 160;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);   // 限制 2x，减少高分辨率屏绘制量
    canvas.style.width = size + "px"; canvas.style.height = size + "px";
    canvas.width = Math.round(size * dpr); canvas.height = Math.round(size * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    staticCv.width = canvas.width; staticCv.height = canvas.height;
    sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    staticDirty = true;
    cell = size / (N + 1);
    if (zoomLabel) zoomLabel.textContent = zoomPct + "%";
    draw(performance.now());
    centerViewport();
  }
  // 放大后把视口滚动到棋盘中心，方便从中心向四周查看
  function centerViewport() {
    if (!viewport) return;
    viewport.scrollLeft = Math.max(0, (viewport.scrollWidth - viewport.clientWidth) / 2);
    viewport.scrollTop = Math.max(0, (viewport.scrollHeight - viewport.clientHeight) / 2);
  }
  function setZoom(pct) {
    pct = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, Math.round(pct)));
    if (pct === zoomPct) return;
    zoomPct = pct;
    applyZoom();
    saveGame();
  }

  // 把棋盘底色/网格/星位/棋子一次性画进离屏画布；棋盘变化时只重绘一次
  function renderStatic() {
    var c = sctx;
    c.clearRect(0, 0, size, size);
    c.fillStyle = "#f0c987";
    c.fillRect(0, 0, size, size);
    c.strokeStyle = "#7a5230"; c.lineWidth = 1;
    c.beginPath();
    for (var i = 0; i < N; i++) {
      var p = cell * (i + 1);
      c.moveTo(cell, p); c.lineTo(size - cell, p);
      c.moveTo(p, cell); c.lineTo(p, size - cell);
    }
    c.stroke();
    // 星位：四个角星 + 天元（随棋盘大小自适应）
    var far = N - 4, mid = Math.floor((N - 1) / 2);
    var stars = [[3,3],[3,far],[far,3],[far,far],[mid,mid]];
    c.fillStyle = "#7a5230";
    for (var s = 0; s < stars.length; s++) {
      c.beginPath();
      c.arc(cell * (stars[s][0] + 1), cell * (stars[s][1] + 1), Math.max(2, cell * 0.09), 0, Math.PI * 2);
      c.fill();
    }
    for (var r = 0; r < N; r++) for (var cc = 0; cc < N; cc++) {
      if (board[r][cc]) stone(c, cell * (cc + 1), cell * (r + 1), board[r][cc]);
    }
  }
  function draw(ts) {
    if (typeof ts !== "number") ts = performance.now();
    if (staticDirty) { renderStatic(); staticDirty = false; }
    ctx.clearRect(0, 0, size, size);
    ctx.drawImage(staticCv, 0, 0, size, size);
    // 最近落子：四周闪烁光晕提示（玩家 / 电脑都适用）
    if (lastMove) drawLastGlow(ts);
  }

  function drawLastGlow(ts) {
    var x = cell * (lastMove.c + 1), y = cell * (lastMove.r + 1);
    var pulse = 0.5 + 0.5 * Math.sin(ts / 260);          // 0..1 呼吸
    var warm = lastMove.color === 1;                      // 黑子用金色，白子用珊瑚红
    var ring = warm ? "255,196,0" : "255,92,92";
    var core = warm ? "255,240,150" : "255,200,190";
    ctx.save();
    // 柔和外光晕
    var g = ctx.createRadialGradient(x, y, cell * 0.2, x, y, cell * (0.85 + 0.18 * pulse));
    g.addColorStop(0, "rgba(" + core + "," + (0.30 + 0.22 * pulse) + ")");
    g.addColorStop(0.6, "rgba(" + ring + "," + (0.22 + 0.20 * pulse) + ")");
    g.addColorStop(1, "rgba(" + ring + ",0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, cell * (0.85 + 0.18 * pulse), 0, Math.PI * 2); ctx.fill();
    // 脉动圆环
    ctx.strokeStyle = "rgba(" + ring + "," + (0.55 + 0.4 * pulse) + ")";
    ctx.lineWidth = Math.max(2, cell * 0.09);
    ctx.beginPath(); ctx.arc(x, y, cell * (0.5 + 0.12 * pulse), 0, Math.PI * 2); ctx.stroke();
    // 四个方向的小闪光点
    var d = cell * (0.62 + 0.1 * pulse), pr = Math.max(1.5, cell * 0.06 * (0.7 + 0.6 * pulse));
    ctx.fillStyle = "rgba(255,255,255," + (0.6 + 0.4 * pulse) + ")";
    var pts = [[d,0],[-d,0],[0,d],[0,-d]];
    for (var i = 0; i < pts.length; i++) {
      ctx.beginPath(); ctx.arc(x + pts[i][0], y + pts[i][1], pr, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function stone(c, x, y, color) {
    var rad = cell * 0.42;
    c.beginPath(); c.arc(x, y, rad, 0, Math.PI * 2);
    c.fillStyle = color === 1 ? "#2a2a2a" : "#fdfdfd";
    c.shadowColor = "rgba(0,0,0,.35)"; c.shadowBlur = 4; c.shadowOffsetY = 2;
    c.fill();
    c.shadowColor = "transparent"; c.shadowBlur = 0; c.shadowOffsetY = 0;
    c.strokeStyle = "rgba(0,0,0,.25)"; c.lineWidth = 1; c.stroke();
    var g = c.createRadialGradient(x - rad * .35, y - rad * .35, rad * .1, x, y, rad);
    if (color === 1) { g.addColorStop(0, "rgba(255,255,255,.4)"); g.addColorStop(1, "rgba(255,255,255,0)"); }
    else { g.addColorStop(0, "rgba(255,255,255,1)"); g.addColorStop(1, "rgba(190,190,190,.25)"); }
    c.beginPath(); c.arc(x, y, rad, 0, Math.PI * 2); c.fillStyle = g; c.fill();
  }
  function countDir(r, c, dr, dc, color) {
    var n = 0, rr = r + dr, cc = c + dc;
    while (rr >= 0 && rr < N && cc >= 0 && cc < N && board[rr][cc] === color) { n++; rr += dr; cc += dc; }
    return n;
  }
  function isWin(r, c, color) {
    for (var d = 0; d < DIRS.length; d++) {
      var dr = DIRS[d][0], dc = DIRS[d][1];
      if (1 + countDir(r,c,dr,dc,color) + countDir(r,c,-dr,-dc,color) >= 5) return true;
    }
    return false;
  }
  function refreshTurn() {
    turnPill.className = "pill";
    if (finished) return;
    if (aiThinking) { turnPill.textContent = "⚪ 电脑思考中…"; turnPill.className = "pill think"; return; }
    if (mode === "ai") {
      var lname = level === "high" ? "高" : (level === "mid" ? "中" : "低");
      if (current === 1) { turnPill.textContent = "⚫ 轮到你啦"; turnPill.className = "pill black"; }
      else { turnPill.textContent = "⚪ 电脑(" + lname + ")回合"; turnPill.className = "pill white"; }
    } else {
      if (current === 1) { turnPill.textContent = "⚫ 黑棋回合"; turnPill.className = "pill black"; }
      else { turnPill.textContent = "⚪ 白棋回合"; turnPill.className = "pill white"; }
    }
  }
  function showResult(color) {
    finished = true;
    if (mode === "ai") {
      var lname = level === "high" ? "高" : (level === "mid" ? "中" : "低");
      if (color === 1) {
        document.getElementById("ovIcon").textContent = "🎉";
        document.getElementById("ovTitle").textContent = "你赢啦！";
        document.getElementById("ovText").textContent = "打败「" + lname + "」级电脑，太厉害了！共下了 " + moves.length + " 步。";
      } else {
        document.getElementById("ovIcon").textContent = "🤖";
        document.getElementById("ovTitle").textContent = "电脑赢啦";
        document.getElementById("ovText").textContent = "「" + lname + "」级电脑赢了这局，再试一次吧！";
      }
    } else {
      document.getElementById("ovIcon").textContent = color === 1 ? "⚫" : "⚪";
      document.getElementById("ovTitle").textContent = (color === 1 ? "黑棋" : "白棋") + "赢啦！";
      document.getElementById("ovText").textContent = "五个连成一线，太厉害了！共下了 " + moves.length + " 步。";
    }
    refreshTurn();
    overlay.classList.remove("hidden");
  }
  function commit(r, c, color) {
    board[r][c] = color;
    staticDirty = true;
    moves.push({ r: r, c: c, color: color });
    lastMove = { r: r, c: c, color: color };
    stepsEl.textContent = moves.length;
    draw(performance.now());
    if (isWin(r, c, color)) { showResult(color); if (window.GameSave) GameSave.clear(SAVE_KEY); return; }
    if (moves.length >= N * N) {
      finished = true;
      document.getElementById("ovIcon").textContent = "🤝";
      document.getElementById("ovTitle").textContent = "平局！";
      document.getElementById("ovText").textContent = "棋盘下满啦，你们都很棒！";
      refreshTurn(); overlay.classList.remove("hidden"); if (window.GameSave) GameSave.clear(SAVE_KEY); return;
    }
    current = color === 1 ? 2 : 1;
    refreshTurn();
    saveGame();
  }
  function humanPlace(r, c) {
    if (finished || quizPaused || board[r][c]) return;
    if (mode === "ai" && (current !== 1 || aiThinking)) return;  // 电脑回合，玩家不能下
    commit(r, c, current);
    maybeAI();
  }

  /* ---------- AI：棋型评分（进攻 + 防守） ---------- */
  function shapeScore(cnt, openA, openB) {
    var open = (openA ? 1 : 0) + (openB ? 1 : 0);
    if (cnt >= 5) return 1000000;
    if (cnt === 4) return open === 2 ? 100000 : (open === 1 ? 10000 : 0);
    if (cnt === 3) return open === 2 ? 10000 : (open === 1 ? 1000 : 0);
    if (cnt === 2) return open === 2 ? 1000 : (open === 1 ? 100 : 0);
    if (cnt === 1) return open === 2 ? 100 : (open === 1 ? 10 : 0);
    return 0;
  }
  // 若在 (r,c) 落 color，评估经过该点的四个方向威胁总和
  function evalPoint(r, c, color) {
    var total = 0;
    for (var d = 0; d < DIRS.length; d++) {
      var dr = DIRS[d][0], dc = DIRS[d][1];
      var cnt = 1, rr, cc, openA = false, openB = false;
      rr = r + dr; cc = c + dc;
      while (rr >= 0 && rr < N && cc >= 0 && cc < N && board[rr][cc] === color) { cnt++; rr += dr; cc += dc; }
      if (rr >= 0 && rr < N && cc >= 0 && cc < N && board[rr][cc] === 0) openA = true;
      rr = r - dr; cc = c - dc;
      while (rr >= 0 && rr < N && cc >= 0 && cc < N && board[rr][cc] === color) { cnt++; rr -= dr; cc -= dc; }
      if (rr >= 0 && rr < N && cc >= 0 && cc < N && board[rr][cc] === 0) openB = true;
      total += shapeScore(cnt, openA, openB);
    }
    return total;
  }
  // 候选点：已有棋子周围 2 格内的空格；空棋盘则用天元
  function candidates() {
    var near = [], hasStone = false;
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
      if (board[r][c] === 0) continue;
      hasStone = true;
      for (var dr = -2; dr <= 2; dr++) for (var dc = -2; dc <= 2; dc++) {
        var rr = r + dr, cc = c + dc;
        if (rr < 0 || rr >= N || cc < 0 || cc >= N || board[rr][cc] !== 0) continue;
        var seen = false;
        for (var i = 0; i < near.length; i++) if (near[i].r === rr && near[i].c === cc) { seen = true; break; }
        if (!seen) near.push({ r: rr, c: cc });
      }
    }
    if (!hasStone) { var m = Math.floor((N - 1) / 2); return [{ r: m, c: m }]; }
    return near;
  }
  function centerBias(r, c) {
    var m = (N - 1) / 2;
    return (m - Math.abs(r - m)) + (m - Math.abs(c - m));
  }

  function bestMove() {
    var cands = candidates();
    var m = (N - 1) / 2;
    // 各等级参数：防守权重 / 中心权重 / 随机扰动 / 是否做一步预判
    var cfg = level === "high" ? { def:1.0, ctr:0.6, noise:0, look:1 }
            : level === "mid"  ? { def:0.9, ctr:1.0, noise:0, look:0 }
            :                    { def:0.22, ctr:1.6, noise:5200, look:0 };
    var bestScore = -1, best = [];
    for (var i = 0; i < cands.length; i++) {
      var r = cands[i].r, c = cands[i].c;
      var attack = evalPoint(r, c, 2);          // 电脑进攻
      var defend = evalPoint(r, c, 1);          // 封堵玩家
      var s = attack + defend * cfg.def + centerBias(r, c) * cfg.ctr + Math.random() * cfg.noise;
      if (s > bestScore) { bestScore = s; best = [{ r: r, c: c }]; }
      else if (s === bestScore) best.push({ r: r, c: c });
    }
    var pickOne = function (list) { return list[Math.floor(Math.random() * list.length)]; };

    // 高级：在最优候选里做一层预判——落子后看对手能否反威胁，选净收益最高的
    if (cfg.look && best.length > 1) {
      var top = best.slice(0, Math.min(8, best.length));
      var netBest = -Infinity, netList = [];
      for (var t = 0; t < top.length; t++) {
        var mv = top[t];
        board[mv.r][mv.c] = 2;                  // 试落子
        var oppMax = 0;
        for (var j = 0; j < cands.length; j++) {
          if (cands[j].r === mv.r && cands[j].c === mv.c) continue;
          var os = evalPoint(cands[j].r, cands[j].c, 1);
          if (os > oppMax) oppMax = os;
        }
        board[mv.r][mv.c] = 0;                  // 撤销
        var net = bestScore - oppMax * 0.55 + centerBias(mv.r, mv.c);
        if (net > netBest) { netBest = net; netList = [mv]; }
        else if (net === netBest) netList.push(mv);
      }
      return pickOne(netList.length ? netList : best);
    }
    return pickOne(best.length ? best : [{ r: m, c: m }]);
  }

  function maybeAI() {
    if (mode !== "ai" || finished || current !== 2 || quizPaused) return;
    aiThinking = true; refreshTurn();
    aiTimer = setTimeout(function () {
      aiTimer = null;
      if (finished || quizPaused || current !== 2) { aiThinking = false; refreshTurn(); return; }
      var mv = bestMove();
      aiThinking = false;
      if (mv) commit(mv.r, mv.c, 2);
      else refreshTurn();
    }, 420);
  }

  function undo() {
    if (quizPaused || !moves.length) return;
    if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; }
    aiThinking = false;
    if (finished) { overlay.classList.add("hidden"); finished = false; }
    var steps = (mode === "ai") ? (moves.length >= 2 ? 2 : 1) : 1;
    for (var i = 0; i < steps; i++) {
      var m = moves.pop();
      board[m.r][m.c] = 0;
    }
    staticDirty = true;
    lastMove = moves.length ? moves[moves.length - 1] : null;
    if (mode === "ai") {
      current = 1;  // 人机模式退回到玩家（黑棋）
    } else {
      current = moves.length ? (moves[moves.length - 1].color === 1 ? 2 : 1) : 1;
    }
    stepsEl.textContent = moves.length;
    refreshTurn(); draw(performance.now());
    saveGame();
  }
  function clearAITimer() { if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; } aiThinking = false; }
  function refreshLevelUI() {
    for (var i = 0; i < levelBtns.length; i++) {
      var on = levelBtns[i].getAttribute("data-level") === level;
      if (on) levelBtns[i].classList.add("active");
      else levelBtns[i].classList.remove("active");
    }
    levelsEl.classList.toggle("hidden", mode === "pvp");   // 双人模式无需电脑等级
  }
  function restart(fresh) {
    var saved = fresh ? null : (window.GameSave ? GameSave.load(SAVE_KEY, null) : null);
    clearAITimer();
    board = emptyBoard(N); moves = []; current = 1; finished = false; lastMove = null; staticDirty = true;
    // 注意：mode / level 保留当前值作为默认，不在此重置——
    // setMode()/setLevel() 会先设置再调用 restart，重置会导致切换失效。
    // 读档并迁移：兼容任意旧棋盘尺寸（如 15×15），居中嵌入新棋盘，保留走子与设置
    if (saved) {
      var m = (saved.board && Array.isArray(saved.board)) ? saved.board.length : 0;
      if (m > 0 && validBoardOf(saved.board, m) && validMovesOf(saved.moves, m)) {
        var off = Math.floor((N - m) / 2);
        if (off >= 0) {                             // 旧棋盘较小：居中嵌入
          for (var r = 0; r < m; r++) for (var c = 0; c < m; c++) board[r + off][c + off] = saved.board[r][c];
          moves = saved.moves.map(function (x) { return { r: x.r + off, c: x.c + off, color: x.color }; });
        } else {                                    // 旧棋盘较大：居中裁剪
          var co = Math.floor((m - N) / 2);
          for (var r2 = 0; r2 < N; r2++) for (var c2 = 0; c2 < N; c2++) board[r2][c2] = saved.board[r2 + co][c2 + co];
          moves = saved.moves.filter(function (x) {
            return x.r >= co && x.r < co + N && x.c >= co && x.c < co + N;
          }).map(function (x) { return { r: x.r - co, c: x.c - co, color: x.color }; });
        }
        current = (saved.current === 1 || saved.current === 2) ? saved.current : 1;
        mode = (saved.mode === "ai" || saved.mode === "pvp") ? saved.mode : "ai";
        level = (saved.level === "low" || saved.level === "mid" || saved.level === "high") ? saved.level : "low";
        // 缩放级别恢复（旧档无此字段则沿用当前值/默认 100%）
        if (typeof saved.zoomPct === "number" && saved.zoomPct >= ZOOM_MIN && saved.zoomPct <= ZOOM_MAX)
          zoomPct = Math.round(saved.zoomPct);
        lastMove = moves.length ? moves[moves.length - 1] : null;
      }
    }
    modeBtn.textContent = (mode === "ai") ? "🤖 对战电脑" : "👥 双人对战";
    modeBtn.title = (mode === "ai") ? "点击切换为双人对战" : "点击切换为对战电脑";
    refreshLevelUI();
    stepsEl.textContent = moves.length;
    refreshTurn();
    overlay.classList.add("hidden"); draw(performance.now());
    if (fresh && window.GameSave) GameSave.clear(SAVE_KEY);
    else saveGame();
    if (mode === "ai" && current === 2) maybeAI();
  }
  function setMode(m) {
    mode = m;
    modeBtn.textContent = (mode === "ai") ? "🤖 对战电脑" : "👥 双人对战";
    modeBtn.title = (mode === "ai") ? "点击切换为双人对战" : "点击切换为对战电脑";
    refreshLevelUI();
    restart(true);
  }
  function setLevel(l) {
    if (l !== "low" && l !== "mid" && l !== "high") return;
    level = l; refreshLevelUI(); refreshTurn(); saveGame();
  }

  /* ---------- 动画循环（最近落子光晕持续闪烁） ---------- */
  function loop(ts) { draw(ts); raf = requestAnimationFrame(loop); }

  modeBtn.addEventListener("click", function () { setMode(mode === "ai" ? "pvp" : "ai"); });
  for (var bi = 0; bi < levelBtns.length; bi++) {
    (function (btn) { btn.addEventListener("click", function () { setLevel(btn.getAttribute("data-level")); }); })(levelBtns[bi]);
  }
  document.getElementById("undoBtn").addEventListener("click", undo);
  document.getElementById("restartBtn").addEventListener("click", function () { restart(true); });
  document.getElementById("ovBtn").addEventListener("click", function () { restart(true); });
  document.getElementById("zoomIn").addEventListener("click", function () { setZoom(zoomPct + ZOOM_STEP); });
  document.getElementById("zoomOut").addEventListener("click", function () { setZoom(zoomPct - ZOOM_STEP); });
  document.getElementById("zoomReset").addEventListener("click", function () { setZoom(100); });
  canvas.addEventListener("click", function (e) {
    var rect = canvas.getBoundingClientRect();
    // 按画布当前显示宽高换算比例，天然适配任意缩放与视口滚动
    var c = Math.round((e.clientX - rect.left) / rect.width * (N + 1)) - 1;
    var r = Math.round((e.clientY - rect.top) / rect.height * (N + 1)) - 1;
    if (r < 0 || r >= N || c < 0 || c >= N) return;
    humanPlace(r, c);
  });
  window.addEventListener("resize", setup);

  restart(false); setup();
  cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);

  if (window.GameQuiz) {
    GameQuiz.init({
      isPlaying: function () { return !finished && overlay.classList.contains("hidden"); },
      onOpen: function () { quizPaused = true; clearAITimer(); },
      onClose: function () { quizPaused = false; refreshTurn(); maybeAI(); }
    });
  }
})();
</script>
</body>
