<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>🍬 消消乐</title>
<link rel="stylesheet" href="../../theme.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; min-height:100%; overflow-x:hidden; font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
  body { background:linear-gradient(160deg,#fff0f3 0%,#e9f9ff 55%,#fff8e6 100%);color:#3b2f2f; padding-bottom:calc(26px + env(safe-area-inset-bottom)); }
  .home-btn { position:fixed; left:12px; top:calc(12px + env(safe-area-inset-top)); z-index:30;
    width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,.92);
    border:3px solid #ffb703; box-shadow:0 4px 0 rgba(0,0,0,.14); color:#d62828;
    display:flex; align-items:center; justify-content:center; font-size:26px; text-decoration:none; }
  .home-btn:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.14); }
  .hero { text-align:center; padding:calc(20px + env(safe-area-inset-top)) 12px 4px; }
  .hero .logo { width:54px; height:54px; display:block; margin:0 auto; animation:bob 3s ease-in-out infinite;
    filter:drop-shadow(0 3px 2px rgba(200,70,100,.22)); }
  @keyframes bob { 0%,100%{transform:translateY(0) rotate(-5deg)} 50%{transform:translateY(-7px) rotate(5deg)} }
  .hero h1 { font-size:clamp(22px,6vw,30px); margin:4px 0; color:#ff6b9d; }
  .hero p { font-size:13px; color:#8b7d7d; }
  .bar { display:flex; justify-content:center; gap:10px; margin:10px 0 12px; flex-wrap:wrap; }
  .pill { background:#fff; border:3px solid #ffd23f; border-radius:999px; padding:7px 14px;
    font-size:15px; font-weight:800; color:#e07a00; box-shadow:0 4px 0 #f0c000; white-space:nowrap; }
  .pill.goal { color:#ff6b9d; border-color:#ffb3c8; box-shadow:0 4px 0 #ff8fab; }
  .wrap { max-width:520px; margin:0 auto; padding:0 12px; text-align:center; }
  .progress { height:16px; background:#ffe3ec; border-radius:999px; overflow:hidden; max-width:460px; margin:0 auto 12px; box-shadow:inset 0 2px 4px rgba(0,0,0,.08); }
  .progress i { display:block; height:100%; width:0%; background:linear-gradient(90deg,#ff8fab,#ff6b9d,#ffb03a); border-radius:999px; transition:width .3s ease; }
  .boardwrap { position:relative; display:inline-block; width:100%; max-width:460px; }
  .board { display:grid; grid-template-columns:repeat(8,1fr); grid-template-rows:repeat(8,1fr);
    gap:4px; width:100%; aspect-ratio:1/1; background:rgba(255,255,255,.4); padding:6px; border-radius:18px;
    box-shadow:inset 0 2px 8px rgba(0,0,0,.06); }
  .tile { border-radius:11px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg,#fffdfd 0%,#fff1f6 100%);
    box-shadow:0 3px 0 rgba(200,120,150,.16), inset 0 1px 2px rgba(255,255,255,.9);
    cursor:pointer; user-select:none; }
  .tile svg { width:94%; height:94%; display:block; filter:drop-shadow(0 2px 1.4px rgba(120,60,80,.26)); }
  .tile.sel { box-shadow:0 0 0 4px #ffb703, 0 3px 0 rgba(200,120,150,.16); background:#fff8e1; transform:scale(.92); }
  .tile.clear { animation:clearAnim .28s ease forwards; }
  @keyframes clearAnim { 0%{transform:scale(1)} 50%{transform:scale(1.2)} 100%{transform:scale(0);opacity:0} }
  .tile.new { animation:newAnim .28s ease; }
  @keyframes newAnim { 0%{transform:scale(.4);opacity:.3} 100%{transform:scale(1);opacity:1} }
  .tile.wrong { animation:shake .3s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .combo { position:absolute; left:50%; top:38%; transform:translate(-50%,-50%);
    font-size:34px; font-weight:900; color:#ff3d6e; text-shadow:0 2px 0 #fff,0 0 12px #fff;
    pointer-events:none; opacity:0; z-index:6; white-space:nowrap; }
  .combo.show { animation:comboPop .9s ease; }
  @keyframes comboPop { 0%{opacity:0;transform:translate(-50%,-30%) scale(.6)} 30%{opacity:1;transform:translate(-50%,-50%) scale(1.15)} 100%{opacity:0;transform:translate(-50%,-90%) scale(1)} }
  .tools { margin:14px 0 4px; }
  .btn { border:none; border-radius:999px; padding:12px 34px; font-size:18px; font-weight:900; color:#fff; cursor:pointer;
    background:linear-gradient(180deg,#ff8fab,#ff6b81); box-shadow:0 6px 0 #e84d68; }
  .btn:active { transform:translateY(3px); box-shadow:0 3px 0 #e84d68; }
  .overlay { position:fixed; inset:0; z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92); backdrop-filter:blur(4px); text-align:center; padding:20px; }
  .overlay.hidden { display:none; }
  .overlay .big { font-size:76px; animation:pop .6s ease; }
  @keyframes pop { 0%{transform:scale(.6)} 60%{transform:scale(1.15)} 100%{transform:scale(1)} }
  .overlay h2 { font-size:30px; color:#ff6b9d; margin:8px 0; }
  .overlay p { font-size:18px; color:#6d6262; margin:6px 0 20px; }
</style>
</head>
<body>
<a class="home-btn" href="../../" aria-label="返回主页" title="返回主页">🏠</a>

<!-- 全局渐变定义：所有水果共用同一套左上光源（0,0 -> 1,1），保证风格统一 -->
<svg id="fruitDefs" width="0" height="0" aria-hidden="true" style="position:absolute;pointer-events:none">
  <defs>
    <linearGradient id="g0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffa8ba"/><stop offset="1" stop-color="#ef3055"/></linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd976"/><stop offset="1" stop-color="#ff8a00"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff09a"/><stop offset="1" stop-color="#f2b705"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#96eea8"/><stop offset="1" stop-color="#2fa84f"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cfa6ff"/><stop offset="1" stop-color="#7b3fd4"/></linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#93c4ff"/><stop offset="1" stop-color="#2e6fe0"/></linearGradient>
  </defs>
</svg>

<header class="hero">
  <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
    <path d="M18 24 L9 19 L7 27 L16 31 Z" fill="#ffd166" stroke="#e8a200" stroke-width="2" stroke-linejoin="round"/>
    <path d="M18 40 L9 45 L7 37 L16 33 Z" fill="#ffd166" stroke="#e8a200" stroke-width="2" stroke-linejoin="round"/>
    <path d="M46 24 L55 19 L57 27 L48 31 Z" fill="#ffd166" stroke="#e8a200" stroke-width="2" stroke-linejoin="round"/>
    <path d="M46 40 L55 45 L57 37 L48 33 Z" fill="#ffd166" stroke="#e8a200" stroke-width="2" stroke-linejoin="round"/>
    <rect x="16" y="20" width="32" height="24" rx="10" fill="url(#g0)" stroke="#c81e42" stroke-width="2.2"/>
    <ellipse cx="26" cy="27" rx="5" ry="3" fill="#fff" opacity=".6" transform="rotate(-25 26 27)"/>
  </svg>
  <h1>消消乐</h1>
  <p>点两个相邻的水果交换位置，三个一样的连成一线就能消除得分！</p>
</header>

<div class="bar">
  <div class="pill">🏆 <span id="score">0</span> 分</div>
  <div class="pill goal">🎯 目标 1200</div>
  <div class="pill">👣 剩 <span id="steps">45</span> 步</div>
</div>

<div class="wrap">
  <div class="progress"><i id="bar"></i></div>
  <div class="boardwrap">
    <div class="board" id="board"></div>
    <div class="combo" id="combo"></div>
  </div>
  <div class="tools"><button class="btn" id="restartBtn">🔄 重新挑战</button></div>
</div>

<div class="overlay hidden" id="overlay">
  <div class="big" id="ovIcon">🎉</div>
  <h2 id="ovTitle">过关啦！</h2>
  <p id="ovText"></p>
  <button class="btn" id="ovBtn">再玩一次</button>
</div>

<script src="../../icons.js"></script>
<script src="../../quiz.js"></script>
<script src="../../save.js"></script>
<script>
(function () {
  "use strict";
  var R = 8, C = 8, TARGET = 1200, STEPS = 45, PER = 20;
  var SAVE_KEY = "matchThree";

  // 手绘果冻质感水果，全套统一：圆润 Q 版 / 左上光源 / 柔和渐变 + 高光 / 统一描边。
  // 6 种主色覆盖红橙黄绿紫蓝，剪影各不相同，48px 下也能一眼区分。
  var FRUIT_SVG = [
    // 0 草莓：倒心形 + 小叶 + 籽点
    '<svg viewBox="0 0 64 64">' +
      '<path d="M32 55 C21 48 13 39 15 29 C16 23 23 20 32 24 C41 20 48 23 49 29 C51 39 43 48 32 55 Z" fill="url(#g0)" stroke="#c81e42" stroke-width="2.2" stroke-linejoin="round"/>' +
      '<path d="M32 24 C27 16 17 15 14 21 C19 21 23 23 26 27 C28 24 30 23 32 24 C34 23 36 24 38 27 C41 23 45 21 50 21 C47 15 37 16 32 24 Z" fill="#4cbf6a" stroke="#2e9b4f" stroke-width="1.5" stroke-linejoin="round"/>' +
      '<g fill="#ffe9a8"><ellipse cx="26" cy="34" rx="1.6" ry="2.2"/><ellipse cx="38" cy="34" rx="1.6" ry="2.2"/><ellipse cx="32" cy="40" rx="1.6" ry="2.2"/><ellipse cx="23" cy="42" rx="1.4" ry="1.9"/><ellipse cx="41" cy="42" rx="1.4" ry="1.9"/><ellipse cx="32" cy="48" rx="1.4" ry="1.9"/></g>' +
      '<ellipse cx="24" cy="31" rx="5.5" ry="3.2" fill="#fff" opacity=".55" transform="rotate(-25 24 31)"/>' +
    '</svg>',
    // 1 橙子：正圆 + 果蒂小叶
    '<svg viewBox="0 0 64 64">' +
      '<path d="M32 15 L32 10" stroke="#8b5a2b" stroke-width="2.6" stroke-linecap="round"/>' +
      '<path d="M33 15 C37 9 45 9 48 13 C44 17 38 18 33 16 Z" fill="#4cbf6a" stroke="#2e9b4f" stroke-width="1.5" stroke-linejoin="round"/>' +
      '<circle cx="32" cy="35" r="20" fill="url(#g1)" stroke="#e07000" stroke-width="2.2"/>' +
      '<ellipse cx="24" cy="27" rx="7" ry="4.6" fill="#fff" opacity=".5" transform="rotate(-30 24 27)"/>' +
      '<g fill="#ffb733" opacity=".7"><circle cx="41" cy="35" r="1"/><circle cx="44" cy="41" r="1"/><circle cx="34" cy="46" r="1"/><circle cx="24" cy="43" r="1"/></g>' +
    '</svg>',
    // 2 柠檬：两端带尖的纺锤形 + 小叶
    '<svg viewBox="0 0 64 64">' +
      '<path d="M11 32 C18 21 28 17 39 20 C47 22 52 27 53 32 C52 37 47 42 39 44 C28 47 18 43 11 32 Z" fill="url(#g2)" stroke="#d99e00" stroke-width="2.2" stroke-linejoin="round"/>' +
      '<path d="M50 28 C53 26 56 27 57 30 C55 32 52 32 50 31 Z" fill="#4cbf6a" stroke="#2e9b4f" stroke-width="1.3" stroke-linejoin="round"/>' +
      '<ellipse cx="27" cy="27" rx="9" ry="3.6" fill="#fff" opacity=".55" transform="rotate(-16 27 27)"/>' +
    '</svg>',
    // 3 西瓜：圆瓜 + 深绿条纹 + 瓜蒂
    '<svg viewBox="0 0 64 64">' +
      '<path d="M32 14 L32 10" stroke="#6b4f2a" stroke-width="2.6" stroke-linecap="round"/>' +
      '<circle cx="32" cy="35" r="20" fill="url(#g3)" stroke="#1f8a42" stroke-width="2.2"/>' +
      '<g fill="none" stroke="#1e7a3c" stroke-width="3" stroke-linecap="round" opacity=".65"><path d="M32 15 C29 24 29 46 32 55"/><path d="M23 17 C17 26 17 45 23 53"/><path d="M41 17 C47 26 47 45 41 53"/></g>' +
      '<ellipse cx="24" cy="27" rx="6" ry="4" fill="#fff" opacity=".45" transform="rotate(-28 24 27)"/>' +
    '</svg>',
    // 4 葡萄：一串圆润浆果 + 藤叶
    '<svg viewBox="0 0 64 64">' +
      '<path d="M32 13 L32 19" stroke="#6b4f2a" stroke-width="2.4" stroke-linecap="round"/>' +
      '<path d="M33 17 C38 11 46 12 48 17 C43 20 37 20 33 18 Z" fill="#4cbf6a" stroke="#2e9b4f" stroke-width="1.3" stroke-linejoin="round"/>' +
      '<g fill="url(#g4)" stroke="#6a2fb8" stroke-width="1.8"><circle cx="24" cy="27" r="8"/><circle cx="40" cy="27" r="8"/><circle cx="32" cy="28" r="8"/><circle cx="28" cy="40" r="8"/><circle cx="36" cy="40" r="8"/><circle cx="32" cy="51" r="7.5"/></g>' +
      '<g fill="#fff" opacity=".6"><circle cx="21" cy="24" r="2.3"/><circle cx="37" cy="24" r="2.3"/><circle cx="29" cy="25" r="2.3"/><circle cx="25" cy="37" r="2.3"/><circle cx="33" cy="37" r="2.3"/><circle cx="29" cy="48" r="2.2"/></g>' +
    '</svg>',
    // 5 蓝莓：圆果 + 星形花萼
    '<svg viewBox="0 0 64 64">' +
      '<circle cx="32" cy="36" r="19" fill="url(#g5)" stroke="#234faa" stroke-width="2.2"/>' +
      '<path d="M32 15 L34.2 21.2 L40.6 21.2 L35.4 25 L37.3 31.2 L32 27.4 L26.7 31.2 L28.6 25 L23.4 21.2 L29.8 21.2 Z" fill="#2a5fcc" stroke="#1b4199" stroke-width="1.2" stroke-linejoin="round"/>' +
      '<ellipse cx="23" cy="33" rx="5.5" ry="3.4" fill="#fff" opacity=".5" transform="rotate(-28 23 33)"/>' +
    '</svg>'
  ];

  var boardEl = document.getElementById("board"), comboEl = document.getElementById("combo");
  var scoreEl = document.getElementById("score"), stepsEl = document.getElementById("steps"), barEl = document.getElementById("bar");
  var overlay = document.getElementById("overlay");
  var grid = [], cells = [], sel = null, score = 0, steps = STEPS;
  var busy = false, finished = false, quizPaused = false;
  var animSeq = 0; // 消除动画代数：重开时自增，使挂起的 setTimeout 回调失效

  function saveGame() {
    if (!window.GameSave) return;
    GameSave.save(SAVE_KEY, { grid: grid, score: score, steps: steps });
  }
  function validGrid(g) {
    if (!Array.isArray(g) || g.length !== R) return false;
    for (var r = 0; r < R; r++) {
      if (!Array.isArray(g[r]) || g[r].length !== C) return false;
      for (var c = 0; c < C; c++) {
        var v = g[r][c];
        if (v !== null && (typeof v !== "number" || v % 1 !== 0 || v < 0 || v >= FRUIT_SVG.length)) return false;
      }
    }
    return true;
  }

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function randFruit() { return Math.floor(Math.random() * FRUIT_SVG.length); }
  function wouldMatch(r, c, v) {
    // 逐行自上而下构建，只需检查左侧与上方已生成的格子；
    // 下方格子尚未生成，等它生成时会反过来检查上方，同样能避免三连。
    if (c >= 2 && grid[r][c-1] === v && grid[r][c-2] === v) return true;
    if (c >= 1 && c + 1 < C && grid[r][c-1] === v && grid[r][c+1] === v) return true;
    if (c + 2 < C && grid[r][c+1] === v && grid[r][c+2] === v) return true;
    if (r >= 2 && grid[r-1][c] === v && grid[r-2][c] === v) return true;
    return false;
  }
  function buildGrid() {
    grid = [];
    for (var r = 0; r < R; r++) {
      grid[r] = [];
      for (var c = 0; c < C; c++) {
        var v, tries = 0;
        do { v = randFruit(); tries++; }
        while (wouldMatch(r, c, v) && tries < 40);
        grid[r][c] = v;
      }
    }
    if (!hasPossible()) buildGrid();
  }
  function renderAll(fresh) {
    for (var r = 0; r < R; r++) for (var c = 0; c < C; c++) {
      var el = cells[r][c];
      el.className = "tile";
      el.innerHTML = FRUIT_SVG[grid[r][c]];
      if (fresh && fresh[r + "," + c]) el.classList.add("new");
    }
  }
  function findMatches() {
    var marks = {};
    function add(r, c) { marks[r + "," + c] = true; }
    for (var r = 0; r < R; r++) {
      var s = 0;
      for (var c = 1; c <= C; c++) {
        // 索引 0 也是有效水果，必须用 != null 判空，不能用 truthy
        if (c < C && grid[r][c] != null && grid[r][c] === grid[r][s]) continue;
        if (grid[r][s] != null && c - s >= 3) for (var k = s; k < c; k++) add(r, k);
        s = c;
      }
    }
    for (var c2 = 0; c2 < C; c2++) {
      var s2 = 0;
      for (var r2 = 1; r2 <= R; r2++) {
        if (r2 < R && grid[r2][c2] != null && grid[r2][c2] === grid[s2][c2]) continue;
        if (grid[s2][c2] != null && r2 - s2 >= 3) for (var k2 = s2; k2 < r2; k2++) add(k2, c2);
        s2 = r2;
      }
    }
    return marks;
  }
  function swapValues(a, b) {
    var t = grid[a.r][a.c]; grid[a.r][a.c] = grid[b.r][b.c]; grid[b.r][b.c] = t;
  }
  function makesMatch(a, b) {
    swapValues(a, b);
    var ok = Object.keys(findMatches()).length > 0;
    swapValues(a, b);
    return ok;
  }
  function hasPossible() {
    for (var r = 0; r < R; r++) for (var c = 0; c < C; c++) {
      if (c + 1 < C && makesMatch({r:r,c:c}, {r:r,c:c+1})) return true;
      if (r + 1 < R && makesMatch({r:r,c:c}, {r:r+1,c:c})) return true;
    }
    return false;
  }
  function showCombo(n) {
    if (n < 2) return;
    comboEl.textContent = "连击 x" + n + "！";
    comboEl.classList.remove("show"); void comboEl.offsetWidth; comboEl.classList.add("show");
  }
  function updateScore() {
    scoreEl.textContent = score;
    barEl.style.width = Math.min(100, score / TARGET * 100) + "%";
  }
  function collapse() {
    var fresh = {};
    for (var c = 0; c < C; c++) {
      var vals = [];
      for (var r = R - 1; r >= 0; r--) if (grid[r][c] != null) vals.push(grid[r][c]);
      var vi = 0;
      for (var r2 = R - 1; r2 >= 0; r2--) {
        if (vi < vals.length) grid[r2][c] = vals[vi++];
        else { grid[r2][c] = randFruit(); fresh[r2 + "," + c] = true; }
      }
    }
    return fresh;
  }
  function resolve(marks, combo) {
    var keys = Object.keys(marks);
    if (!keys.length) { checkEnd(); return; }
    combo++;
    showCombo(combo);
    score += keys.length * PER * combo; updateScore();
    for (var i = 0; i < keys.length; i++) {
      var pos = marks0(keys[i]);
      cells[pos[0]][pos[1]].classList.add("clear");
    }
    var seq = animSeq;
    setTimeout(function () {
      if (seq !== animSeq) return; // 已重开，放弃旧棋盘上的消除
      for (var j = 0; j < keys.length; j++) {
        var p = marks0(keys[j]); grid[p[0]][p[1]] = null;
      }
      var fresh = collapse();
      renderAll(fresh);
      setTimeout(function () {
        if (seq !== animSeq) return;
        resolve(findMatches(), combo);
      }, 240);
    }, 280);
  }
  function marks0(key) { var a = key.split(","); return [parseInt(a[0],10), parseInt(a[1],10)]; }
  function checkEnd() {
    busy = false;
    if (score >= TARGET) {
      finished = true;
      document.getElementById("ovIcon").textContent = "🏆";
      document.getElementById("ovTitle").textContent = "过关啦！";
      document.getElementById("ovText").textContent = "你得了 " + score + " 分，还剩 " + steps + " 步，太棒了！";
      overlay.classList.remove("hidden"); if (window.GameSave) GameSave.clear(SAVE_KEY); return;
    }
    if (steps <= 0) {
      finished = true;
      document.getElementById("ovIcon").textContent = "😵";
      document.getElementById("ovTitle").textContent = "步数用完啦";
      document.getElementById("ovText").textContent = "这次得了 " + score + " 分，再挑战一次吧！";
      overlay.classList.remove("hidden"); if (window.GameSave) GameSave.clear(SAVE_KEY); return;
    }
    if (!hasPossible()) {
      buildGrid(); renderAll({});
      comboEl.textContent = "没有可消的啦，重新洗牌～";
      comboEl.classList.remove("show"); void comboEl.offsetWidth; comboEl.classList.add("show");
    }
    saveGame();
  }
  function clearSel() {
    if (sel) { cells[sel.r][sel.c].classList.remove("sel"); sel = null; }
  }
  function tapCell(r, c) {
    if (busy || finished || quizPaused) return;
    if (!sel) { sel = { r: r, c: c }; cells[r][c].classList.add("sel"); return; }
    if (sel.r === r && sel.c === c) { clearSel(); return; }
    var a = sel, b = { r: r, c: c };
    var adjacent = Math.abs(a.r - b.r) + Math.abs(a.c - b.c) === 1;
    if (!adjacent) { clearSel(); sel = b; cells[b.r][b.c].classList.add("sel"); return; }
    clearSel();
    if (makesMatch(a, b)) {
      swapValues(a, b);              // 真正执行这次有效交换
      busy = true; steps--; stepsEl.textContent = steps;
      resolve(findMatches(), 0);
    } else {
      cells[a.r][a.c].classList.add("wrong");
      cells[b.r][b.c].classList.add("wrong");
      setTimeout(function () {
        cells[a.r][a.c].classList.remove("wrong");
        cells[b.r][b.c].classList.remove("wrong");
      }, 320);
    }
  }
  function reset(fresh) {
    animSeq++; // 作废所有挂起的消除回调，防止污染新棋盘
    var saved = fresh ? null : (window.GameSave ? GameSave.load(SAVE_KEY, null) : null);
    score = 0; steps = STEPS; busy = false; finished = false;
    scoreEl.textContent = "0"; stepsEl.textContent = STEPS; barEl.style.width = "0%";
    overlay.classList.add("hidden"); clearSel(); comboEl.classList.remove("show");
    if (saved && validGrid(saved.grid)) {
      grid = saved.grid;
      score = (typeof saved.score === "number" && isFinite(saved.score) && saved.score >= 0) ? saved.score : 0;
      steps = (typeof saved.steps === "number" && isFinite(saved.steps) && saved.steps >= 0) ? saved.steps : STEPS;
      scoreEl.textContent = score; stepsEl.textContent = steps;
      barEl.style.width = Math.min(100, score / TARGET * 100) + "%";
      renderAll({});
    } else {
      buildGrid(); renderAll({});
    }
    if (fresh && window.GameSave) GameSave.clear(SAVE_KEY);
    else saveGame();
  }

  // 生成棋盘 DOM
  boardEl.innerHTML = ""; cells = [];
  for (var r = 0; r < R; r++) {
    cells[r] = [];
    for (var c = 0; c < C; c++) {
      var d = document.createElement("div"); d.className = "tile";
      (function (rr, cc) { d.addEventListener("click", function () { tapCell(rr, cc); }); })(r, c);
      boardEl.appendChild(d); cells[r][c] = d;
    }
  }
  document.getElementById("restartBtn").addEventListener("click", function () { reset(true); });
  document.getElementById("ovBtn").addEventListener("click", function () { reset(true); });

  reset(false);

  if (window.GameQuiz) {
    GameQuiz.init({
      isPlaying: function () { return !finished && overlay.classList.contains("hidden"); },
      onOpen: function () { quizPaused = true; },
      onClose: function () { quizPaused = false; }
    });
  }
})();
</script>
</body>
</html>
