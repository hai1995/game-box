<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>🚂 小火车呜呜开 · 3D 无限列车</title>
<link rel="stylesheet" href="../../theme.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden;
    font-family:"PingFang SC","Microsoft YaHei","Comic Sans MS",system-ui,sans-serif;
    background:#7ec8ff; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
  #game,#fx { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #fx { pointer-events:none; z-index:3; }
  #hud { position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between;
    align-items:center; gap:8px; padding:calc(10px + env(safe-area-inset-top)) 12px 10px; pointer-events:none; z-index:5; }
  .badge { background:rgba(255,255,255,.85); border:3px solid #ffb703; border-radius:22px;
    padding:6px 12px; font-size:clamp(17px,5vw,26px); font-weight:800; color:#d62828;
    box-shadow:0 4px 0 rgba(0,0,0,.12); display:flex; align-items:center; gap:6px;
    white-space:nowrap; max-width:48vw; }
  #controls { position:fixed; bottom:0; left:0; right:0; display:flex; gap:8px;
    justify-content:space-between; align-items:flex-end; pointer-events:none;
    padding:12px 10px calc(14px + env(safe-area-inset-bottom)); z-index:6; }
  .skill-col { display:flex; flex-direction:column; gap:8px; pointer-events:auto; }
  .btn { width:58px; border:4px solid #fff; border-radius:20px; padding:8px 2px;
    font-size:24px; color:#fff; font-weight:900; box-shadow:0 4px 0 rgba(0,0,0,.18);
    cursor:pointer; transition:transform .06s,box-shadow .06s;
    display:flex; flex-direction:column; align-items:center; gap:1px; line-height:1.05; }
  .btn small { font-size:12px; font-weight:700; opacity:.95; white-space:nowrap; }
  .btn:active { transform:translateY(4px) scale(.95); box-shadow:0 1px 0 rgba(0,0,0,.18); }
  .btn.b1{background:#ff6b6b}.btn.b2{background:#4d96ff}.btn.b3{background:#6bcb77}
  .btn.b4{background:#ffa62b}.btn.b5{background:#c77dff}.btn.b6{background:#ff5c8a}
  .btn.b7{background:#00b8d9}.btn.b8{background:#ff8c42}.btn.b9{background:#66bb1a}
  .btn.b10{background:#8e7dff}
  .trackBtn { position:fixed; top:50%; transform:translateY(-50%); width:64px; height:110px;
    border-radius:22px; background:rgba(255,255,255,.55); border:4px solid #fff; color:#d62828;
    font-size:50px; font-weight:900; display:flex; align-items:center; justify-content:center;
    z-index:6; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.15); }
  .trackBtn:active { transform:translateY(-50%) scale(.94); }
  #btnLeft{left:12px} #btnRight{right:12px}
  /* 移动端触摸适配：隐藏左右换轨虚拟键显示，保留按钮及事件；改为在画面上左右滑动换轨 */
  .trackBtn { display:none !important; }
  .home-btn { position:fixed; top:calc(60px + env(safe-area-inset-top)); left:12px; z-index:8;
    width:52px; height:52px; border-radius:50%; background:rgba(255,255,255,.92);
    border:3px solid #ffb703; box-shadow:0 4px 0 rgba(0,0,0,.16);
    display:flex; align-items:center; justify-content:center; text-decoration:none;
    font-size:28px; color:#d62828; touch-action:manipulation; }
  .home-btn:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.16); }
  .hidden { display:none !important; }
  .hint { position:fixed; bottom:120px; left:80px; right:80px; text-align:center; color:#fff;
    font-size:15px; font-weight:700; text-shadow:1px 1px 2px rgba(0,0,0,.45);
    pointer-events:none; z-index:4; line-height:1.5; }
  #err { position:fixed; top:70px; left:12px; right:12px; z-index:30; background:#ffefef;
    border:3px solid #ef476f; color:#b00; border-radius:14px; padding:12px; font-size:14px;
    font-weight:700; display:none; }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <canvas id="fx"></canvas>
  <div id="err"></div>

  <div id="hud">
    <div class="badge">⭐ <span id="score">0</span></div>
    <div class="badge">📏 <span id="dist">0</span>米</div>
  </div>

  <div class="trackBtn" id="btnLeft">◀</div>
  <div class="trackBtn" id="btnRight">▶</div>
  <div class="hint" id="hint">左右滑动换轨道去接 ⭐❤️🎈 · 轻点屏幕鸣笛 🚂</div>

  <div id="controls">
    <div class="skill-col">
      <div class="btn b1" id="btnWhistle">🚂<small>鸣笛</small></div>
      <div class="btn b2" id="btnBell">🔔<small>叮咚</small></div>
      <div class="btn b3" id="btnSteam">💨<small>喷气</small></div>
      <div class="btn b4" id="btnSpeed">⚡<small>加速</small></div>
      <div class="btn b5" id="btnParty">🎉<small>烟花</small></div>
    </div>
    <div class="skill-col">
      <div class="btn b6" id="btnRainbow">🌈<small>彩虹</small></div>
      <div class="btn b7" id="btnStars">✨<small>星雨</small></div>
      <div class="btn b8" id="btnHearts">💗<small>爱心</small></div>
      <div class="btn b9" id="btnConfetti">🎊<small>彩带</small></div>
      <div class="btn b10" id="btnBubbles">🫧<small>泡泡</small></div>
    </div>
  </div>

  <a class="home-btn" href="../../" aria-label="返回主页" title="返回主页">🏠</a>

<script src="../../icons.js"></script>
<script src="../../quiz.js"></script>
<script src="../../save.js"></script>
<script>
(function () {
  "use strict";
  var SAVE_KEY = "little-train";
  window.addEventListener("error", function (e) {
    var el = document.getElementById("err");
    el.style.display = "block";
    el.textContent = "出错了：" + (e.message || e.error);
  });

  /* ================= 音效引擎（Web Audio 实时生成，无需音频文件） ================= */
  var actx = null;
  function ensureAudio() {
    if (!actx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { actx = new AC(); } catch (e) { return; }
    }
    if (actx.state === "suspended") actx.resume();
  }
  function playWhistle() {
    ensureAudio(); if (!actx) return;
    var t = actx.currentTime;
    var partials = [
      { f:392, g:.20, type:"sine" }, { f:588, g:.13, type:"sine" },
      { f:784, g:.10, type:"triangle" }, { f:1176, g:.05, type:"sine" }
    ];
    var master = actx.createGain(), lp = actx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.setValueAtTime(900, t);
    lp.frequency.linearRampToValueAtTime(1700, t + .4);
    master.connect(lp).connect(actx.destination);
    var oscs = [];
    partials.forEach(function (p) {
      var o = actx.createOscillator(); o.type = p.type;
      o.frequency.setValueAtTime(p.f, t);
      o.frequency.linearRampToValueAtTime(p.f * 1.05, t + .18);
      o.frequency.linearRampToValueAtTime(p.f, t + .95);
      var g = actx.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(p.g, t + .12);
      g.gain.setValueAtTime(p.g, t + .85);
      g.gain.linearRampToValueAtTime(0, t + 1.35);
      o.connect(g).connect(master);
      o.start(t); o.stop(t + 1.4); oscs.push(o);
    });
    var lfo = actx.createOscillator(), lg = actx.createGain();
    lfo.type = "sine"; lfo.frequency.value = 5.5; lg.gain.value = 4;
    lfo.connect(lg); oscs.forEach(function (o) { lg.connect(o.frequency); });
    lfo.start(t); lfo.stop(t + 1.4);
  }
  function playBell() {
    ensureAudio(); if (!actx) return; var t = actx.currentTime;
    [1046,1318,1568,2093].forEach(function (f, i) {
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = f; var s = t + i * .09;
      g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(.28, s + .01);
      g.gain.exponentialRampToValueAtTime(.001, s + .5);
      o.connect(g).connect(actx.destination); o.start(s); o.stop(s + .52);
    });
  }
  function playSteam() {
    ensureAudio(); if (!actx) return; var t = actx.currentTime;
    var len = Math.floor(actx.sampleRate * .6), buf = actx.createBuffer(1, len, actx.sampleRate);
    var d = buf.getChannelData(0); for (var i=0;i<len;i++) d[i]=Math.random()*2-1;
    var src = actx.createBufferSource(); src.buffer = buf;
    var hp = actx.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=1200;
    var g = actx.createGain(); g.gain.setValueAtTime(.3,t); g.gain.exponentialRampToValueAtTime(.001,t+.55);
    src.connect(hp).connect(g).connect(actx.destination); src.start(t); src.stop(t+.6);
  }
  function playDing() {
    ensureAudio(); if (!actx) return; var t = actx.currentTime;
    [1318,1760].forEach(function (f, i) {
      var o=actx.createOscillator(), g=actx.createGain(); o.type="sine"; o.frequency.value=f;
      var s=t+i*.07; g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(.3,s+.01);
      g.gain.exponentialRampToValueAtTime(.001,s+.3);
      o.connect(g).connect(actx.destination); o.start(s); o.stop(s+.32);
    });
  }
  function playChime() {
    ensureAudio(); if (!actx) return; var t = actx.currentTime;
    [880,1109].forEach(function (f, i) {
      var o=actx.createOscillator(), g=actx.createGain(); o.type="sine"; o.frequency.value=f;
      var s=t+i*.06; g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(.25,s+.02);
      g.gain.exponentialRampToValueAtTime(.001,s+.5);
      o.connect(g).connect(actx.destination); o.start(s); o.stop(s+.52);
    });
  }
  function playPop() {
    ensureAudio(); if (!actx) return; var t = actx.currentTime;
    var o=actx.createOscillator(), g=actx.createGain(); o.type="sine";
    o.frequency.setValueAtTime(500,t); o.frequency.exponentialRampToValueAtTime(1150,t+.12);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.3,t+.02);
    g.gain.exponentialRampToValueAtTime(.001,t+.18);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+.2);
  }
  function playWhoosh() {
    ensureAudio(); if (!actx) return; var t = actx.currentTime;
    var len=Math.floor(actx.sampleRate*.8), buf=actx.createBuffer(1,len,actx.sampleRate);
    var d=buf.getChannelData(0); for (var i=0;i<len;i++) d[i]=Math.random()*2-1;
    var s=actx.createBufferSource(); s.buffer=buf;
    var bp=actx.createBiquadFilter(); bp.type="bandpass"; bp.Q.value=1.2;
    bp.frequency.setValueAtTime(300,t); bp.frequency.exponentialRampToValueAtTime(1500,t+.4);
    bp.frequency.exponentialRampToValueAtTime(300,t+.8);
    var g=actx.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(.3,t+.1);
    g.gain.exponentialRampToValueAtTime(.001,t+.8);
    s.connect(bp).connect(g).connect(actx.destination); s.start(t); s.stop(t+.85);
  }
  function playFirework() {
    ensureAudio(); if (!actx) return; var t = actx.currentTime;
    var o=actx.createOscillator(), g=actx.createGain(); o.type="sine";
    o.frequency.setValueAtTime(400,t); o.frequency.exponentialRampToValueAtTime(1200,t+.3);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.2,t+.05);
    g.gain.exponentialRampToValueAtTime(.001,t+.32);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+.34);
    var len=Math.floor(actx.sampleRate*.4), buf=actx.createBuffer(1,len,actx.sampleRate);
    var d=buf.getChannelData(0); for (var i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
    var s=actx.createBufferSource(); s.buffer=buf;
    var bp=actx.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=800; bp.Q.value=.7;
    var g2=actx.createGain(); g2.gain.setValueAtTime(.35,t+.32); g2.gain.exponentialRampToValueAtTime(.001,t+.7);
    s.connect(bp).connect(g2).connect(actx.destination); s.start(t+.32); s.stop(t+.75);
  }
  function playBoost() {
    ensureAudio(); if (!actx) return;
    var t = actx.currentTime;
    // 上扬的呼啸冲刺声（噪声）
    var len=Math.floor(actx.sampleRate*.5), buf=actx.createBuffer(1,len,actx.sampleRate);
    var d=buf.getChannelData(0); for (var i=0;i<len;i++) d[i]=Math.random()*2-1;
    var s=actx.createBufferSource(); s.buffer=buf;
    var bp=actx.createBiquadFilter(); bp.type="bandpass"; bp.Q.value=1.4;
    bp.frequency.setValueAtTime(300,t); bp.frequency.exponentialRampToValueAtTime(2600,t+.38);
    var g=actx.createGain(); g.gain.setValueAtTime(.001,t);
    g.gain.linearRampToValueAtTime(.32,t+.06); g.gain.exponentialRampToValueAtTime(.001,t+.5);
    s.connect(bp).connect(g).connect(actx.destination); s.start(t); s.stop(t+.52);
    // 上扬的引擎音
    var o=actx.createOscillator(), og=actx.createGain(), lp=actx.createBiquadFilter();
    o.type="sawtooth"; lp.type="lowpass"; lp.frequency.value=1300;
    o.frequency.setValueAtTime(160,t); o.frequency.exponentialRampToValueAtTime(520,t+.4);
    og.gain.setValueAtTime(.001,t); og.gain.linearRampToValueAtTime(.11,t+.05);
    og.gain.exponentialRampToValueAtTime(.001,t+.46);
    o.connect(lp).connect(og).connect(actx.destination); o.start(t); o.stop(t+.46);
  }
  var engine = null;
  function startEngine() {
    ensureAudio(); if (!actx || engine) return;
    var len=actx.sampleRate*2, buf=actx.createBuffer(1,len,actx.sampleRate);
    var d=buf.getChannelData(0); for (var i=0;i<len;i++) d[i]=Math.random()*2-1;
    var src=actx.createBufferSource(); src.buffer=buf; src.loop=true;
    var lp=actx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=220;
    var g=actx.createGain(); g.gain.value=.06;
    var lfo=actx.createOscillator(); lfo.type="square"; lfo.frequency.value=6;
    var lg=actx.createGain(); lg.gain.value=.05; lfo.connect(lg); lg.connect(g.gain);
    src.connect(lp).connect(g).connect(actx.destination); src.start(); lfo.start();
    engine = { lfo:lfo };
  }

  /* ================= 画布 & 透视投影 ================= */
  var cv = document.getElementById("game"), ctx = cv.getContext("2d");
  var fxc = document.getElementById("fx"), fx = fxc.getContext("2d");
  var W, H, DPR, FOCAL, HORIZON;
  var CAM_H = 4.8; // 相机高度：进一步抬高，俯视能看到更多节车厢顶部
  var FOV = 100; // 水平视野角度(度)：越大视角越广、看到越多场景
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    [cv, fxc].forEach(function (c) {
      c.width = Math.floor(W * DPR); c.height = Math.floor(H * DPR);
      c.style.width = W + "px"; c.style.height = H + "px";
    });
    ctx.setTransform(DPR,0,0,DPR,0,0);
    fx.setTransform(DPR,0,0,DPR,0,0);
    // 由水平 FOV 反推焦距：FOCAL = (W/2) / tan(FOV/2)，视角变广则焦距变小、看到更多
    FOCAL = (W / 2) / Math.tan((FOV / 2) * Math.PI / 180);
    HORIZON = H * 0.40; // 地平线下移，天空占比更大，火车与轨道占用更协调
  }
  // 世界坐标 -> 屏幕。x 横向, y 高度, d 深度(越大越远)
  function P(x, y, d) {
    var s = FOCAL / Math.max(d, 1.6);
    return { x: W/2 + x * s, y: HORIZON + (CAM_H - y) * s, s: s };
  }
  function poly(pts, fill, stroke) {
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    for (var i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
  }
  function shade(hex, f) {
    var r=(hex>>16)&255, g=(hex>>8)&255, b=hex&255;
    return "rgb(" + Math.min(255,r*f|0) + "," + Math.min(255,g*f|0) + "," + Math.min(255,b*f|0) + ")";
  }
  // 画一个 3D 盒子（顶/前/一个侧面）——保留给隧道等场景用
  function box(x, y, d, w, h, l, color) {
    var df=d-l/2, db=d+l/2, yb=y-h/2, yt=y+h/2, xl=x-w/2, xr=x+w/2;
    var a=P(xl,yb,df), b=P(xr,yb,df), c=P(xr,yt,df), e=P(xl,yt,df);
    var f=P(xl,yt,db), g=P(xr,yt,db);
    poly([e,c,g,f], shade(color,1.18));            // 顶
    if (x <= 0) {                                   // 物体偏左 -> 看到右侧面
      var h2=P(xr,yb,db), i2=P(xr,yt,db);
      poly([b,h2,i2,c], shade(color,.70));
    } else {
      var j2=P(xl,yb,db), k2=P(xl,yt,db);
      poly([e,k2,j2,a], shade(color,.70));
    }
    poly([a,b,c,e], shade(color,.96));             // 前面(朝相机)
  }
  // 线性渐变填充一个已 beginPath 的路径
  function gradFill(x0,y0,x1,y1, stops) {
    var g=ctx.createLinearGradient(x0,y0,x1,y1);
    for (var i=0;i<stops.length;i++) g.addColorStop(stops[i][0], stops[i][1]);
    ctx.fillStyle=g; ctx.fill();
  }
  // 画一个带金属质感/高光的写实车轮（含轮毂、辐条、外圈），wx/wy 为屏幕坐标，r 半径
  function wheel(wx, wy, r, spin) {
    if (r<1.2) { ctx.fillStyle="#222"; ctx.beginPath(); ctx.arc(wx,wy,Math.max(1,r),0,6.28); ctx.fill(); return; }
    // 轮胎外圈（深色金属）
    var g=ctx.createRadialGradient(wx-r*.3,wy-r*.3,r*.1, wx,wy,r);
    g.addColorStop(0,"#6b7076"); g.addColorStop(.6,"#33383e"); g.addColorStop(1,"#15181c");
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(wx,wy,r,0,6.28); ctx.fill();
    ctx.strokeStyle="#0d0f12"; ctx.lineWidth=Math.max(.8,r*.14); ctx.stroke();
    // 辐条
    if (r>3) {
      ctx.strokeStyle="#8d949c"; ctx.lineWidth=Math.max(.6,r*.1);
      for (var k=0;k<6;k++) {
        var a=spin+k*Math.PI/3;
        ctx.beginPath(); ctx.moveTo(wx+Math.cos(a)*r*.28, wy+Math.sin(a)*r*.28);
        ctx.lineTo(wx+Math.cos(a)*r*.72, wy+Math.sin(a)*r*.72); ctx.stroke();
      }
    }
    // 轮毂
    ctx.fillStyle="#c9ced4"; ctx.beginPath(); ctx.arc(wx,wy,r*.28,0,6.28); ctx.fill();
    ctx.fillStyle="#5a6068"; ctx.beginPath(); ctx.arc(wx,wy,r*.12,0,6.28); ctx.fill();
  }

  /* ================= 场景参数 ================= */
  var TRACK_X = [-3, 0, 3];
  var NEAR = 1.9, FAR = 115; // 轨道近端拉近到屏幕下方，让线路从画面底部延伸上来
  var HEAD_D = 9.5, CAR_GAP = 1.05; // 火车整体拉近放大，让写实木外形清晰可见；车尾朝向镜头
  var NUM_CARS = 6; // 车厢数（最后一节为朝向镜头的守车）
  var SLEEPER = 1.05;

  var running=false, distance=0, score=0, quizPaused=false;
  var baseSpeed=.30, speed=baseSpeed, fast=false, offset=0, wheelAngle=0;
  var currentTrack=1, trainX=TRACK_X[1];
  var carX=[]; for (var ci=0;ci<NUM_CARS;ci++) carX.push(0); // 每节车厢各自的横向位置，用于蛇形转弯
  var CAR_FOLLOW=0.30; // 车厢跟随前一节的速度：加大后左右换轨动画更快更跟手
  var lastPick=0, lastTunnel=0, lastMilestone=0;

  var trees=[], clouds=[], pickups=[], smoke=[], fireworks=[], tunnel=null, flash=0;

  function initScene() {
    trees=[]; clouds=[]; pickups=[]; smoke=[]; fireworks=[]; tunnel=null; flash=0;
    speedLines=[]; toasts=[]; boostPunch=0; fxParts=[]; rainbowT=0;
    distance=0; score=0; offset=0; currentTrack=1; trainX=TRACK_X[1];
    for (var ci=0;ci<carX.length;ci++) carX[ci]=trainX;
    lastPick=0; lastTunnel=0; lastMilestone=0;
    document.getElementById("score").textContent="0";
    document.getElementById("dist").textContent="0";
    for (var i=0;i<22;i++) {
      var side = Math.random()<.5?-1:1;

  function drawCloud(c) {

  function drawSky(night) {
    var g=ctx.createLinearGradient(0,0,0,HORIZON+2);

      ctx.fillStyle="rgba(255,224,102,.35)";

  function drawTracks() {

  function drawTrain() {

  // 写实蒸汽机车车头：锅炉 + 驾驶室 + 烟囱 + 排障器 + 大灯 + 连杆动轮
  function drawLocomotive(x, d) {
    var s=P(x,1,d).s;
    var halfW=.78, boilerY=1.15, boilerR=.62;
    var df=d-1.35, db=d+1.15; // 前端近、后端远
    // —— 锅炉：圆柱体（沿纵向的梯形，用横向渐变模拟圆柱高光）——
    var bfl=P(x-boilerR,boilerY-boilerR,df), bfr=P(x+boilerR,boilerY-boilerR,df);
    var btl=P(x-boilerR,boilerY+boilerR,df), btr=P(x+boilerR,boilerY+boilerR,df);
    var bbl=P(x-boilerR,boilerY-boilerR,db), bbr=P(x+boilerR,boilerY-boilerR,db);
    var btl2=P(x-boilerR,boilerY+boilerR,db), btr2=P(x+boilerR,boilerY+boilerR,db);
    // 锅炉顶面
    poly([btl,btr,btr2,btl2], shade(0x1f6f5c,1.2));
    // 锅炉侧面（朝向镜头的一侧，横向渐变做圆柱反光）
    ctx.beginPath(); ctx.moveTo(bfl.x,bfl.y); ctx.lineTo(bfr.x,bfr.y);
    ctx.lineTo(btr.x,btr.y); ctx.lineTo(btl.x,btl.y); ctx.closePath();
    gradFill(bfl.x,bfl.y,bfr.x,bfr.y,[[0,"#0f4a3d"],[.28,"#2f8a6f"],[.5,"#49ad8d"],[.72,"#2b7f68"],[1,"#123f34"]]);

      var zk=df+(db-df)*k/5;
      var kt=P(x-boilerR*.98,boilerY+boilerR*.98,zk), kb=P(x-boilerR*.98,boilerY-boilerR*.98,zk);
      ctx.beginPath(); ctx.moveTo(kt.x,kt.y); ctx.lineTo(kb.x,kb.y); ctx.stroke();
    }
    // 烟箱门（锅炉前端圆形面板）
    var fc=P(x,boilerY,df-0.02), fr=boilerR*.82*s;
    var dg=ctx.createRadialGradient(fc.x-fr*.3,fc.y-fr*.3,fr*.1,fc.x,fc.y,fr);
    dg.addColorStop(0,"#3a444c"); dg.addColorStop(.7,"#202830"); dg.addColorStop(1,"#0f1418");

    ctx.strokeStyle="rgba(255,255,255,.25)"; ctx.lineWidth=Math.max(.5,fr*.05);
    ctx.beginPath(); ctx.arc(fc.x,fc.y,fr*.72,0,6.28); ctx.stroke();
    // 大灯（烟箱门上方，暖黄光晕）

    hg.addColorStop(0,"rgba(255,236,150,.95)"); hg.addColorStop(.35,"rgba(255,220,110,.55)"); hg.addColorStop(1,"rgba(255,220,110,0)");
    ctx.fillStyle=hg; ctx.beginPath(); ctx.arc(hl.x,hl.y,hr*2.6,0,6.28); ctx.fill();
    ctx.fillStyle="#ffe9a3"; ctx.beginPath(); ctx.arc(hl.x,hl.y,hr,0,6.28); ctx.fill();
    ctx.strokeStyle="#7a6a3a"; ctx.lineWidth=Math.max(.6,hr*.3); ctx.stroke();
    // —— 驾驶室（后端，稍高，带屋顶与侧窗）——

    ctx.beginPath(); ctx.moveTo(ca.x,ca.y); ctx.lineTo(cb.x,cb.y); ctx.lineTo(cc.x,cc.y); ctx.lineTo(ce.x,ce.y); ctx.closePath();
    gradFill(ca.x,ca.y,cb.x,cb.y,[[0,"#7a1f1f"],[.5,"#b83535"],[1,"#6d1919"]]);
    // 驾驶室顶檐（外扩一点）

    // 驾驶室窗（两扇，暖色玻璃 + 反光）
    [-1,1].forEach(function (sg) {

      var wa=P(wx-ww,wy-wh,cabD-.02), wb=P(wx+ww,wy-wh,cabD-.02), wc=P(wx+ww,wy+wh,cabD-.02), wd=P(wx-ww,wy+wh,cabD-.02);
      ctx.beginPath(); ctx.moveTo(wa.x,wa.y); ctx.lineTo(wb.x,wb.y); ctx.lineTo(wc.x,wc.y); ctx.lineTo(wd.x,wd.y); ctx.closePath();
      gradFill(wa.x,wa.y,wa.x,wc.y,[[0,"#bfe8ff"],[.55,"#7fc4ec"],[1,"#e8f6ff"]]);
      ctx.strokeStyle="#3a2b22"; ctx.lineWidth=Math.max(.6,s*.03); ctx.stroke();
    });
    // —— 烟囱（锅炉前部上方，锥形 + 顶帽）——
    var stD=df+0.55, stY=boilerY+boilerR;
    var stbW=.20, sttW=.26, stH=.62;

    gradFill(s1.x,s1.y,s2.x,s2.y,[[0,"#0d1114"],[.5,"#394049"],[1,"#0d1114"]]);
    poly([P(x-sttW-.06,stY+stH,stD),P(x+sttW+.06,stY+stH,stD),P(x+sttW+.06,stY+stH-.1,stD),P(x-sttW-.06,stY+stH-.1,stD)], "#22272d");

  // 写实客车车厢：弧形车顶 + 车身渐变 + 窗排 + 转向架车轮
  function drawCoach(x, d, col, idx) {
    var s=P(x,.85,d).s;
    var halfW=.72, yb=.42, yt=1.5, df=d-1.05, db=d+1.05;

      var wx=x+wi*halfW*.56, wy=yb+(yt-yb)*.62, ww=halfW*.30, wh=(yt-yb)*.26;
      var wa=P(wx-ww,wy-wh,df-.02), wb=P(wx+ww,wy-wh,df-.02), wc=P(wx+ww,wy+wh,df-.02), wd=P(wx-ww,wy+wh,df-.02);
      ctx.beginPath(); ctx.moveTo(wa.x,wa.y); ctx.lineTo(wb.x,wb.y); ctx.lineTo(wc.x,wc.y); ctx.lineTo(wd.x,wd.y); ctx.closePath();
      gradFill(wa.x,wa.y,wa.x,wc.y,[[0,"#cdeeff"],[.5,"#8ec9ee"],[1,"#5f9fc9"]]);

      }

        var tl=P(x+sg*halfW*.72,yt-.28,df-.05), tr=Math.max(2,s*.10);
        var tg=ctx.createRadialGradient(tl.x,tl.y,0,tl.x,tl.y,tr*2.4);
        tg.addColorStop(0,"rgba(255,90,90,.9)"); tg.addColorStop(1,"rgba(255,60,60,0)");
        ctx.fillStyle=tg; ctx.beginPath(); ctx.arc(tl.x,tl.y,tr*2.4,0,6.28); ctx.fill();
        ctx.fillStyle="#e23b3b"; ctx.beginPath(); ctx.arc(tl.x,tl.y,tr,0,6.28); ctx.fill();
        ctx.strokeStyle="#7a1a1a"; ctx.lineWidth=Math.max(.5,tr*.28); ctx.stroke();
      });
      // 车尾 central 车门（纵深的浅色门框）
      var doorW=halfW*.34, doorH=(yt-yb)*.42, doorX=x, doorY=yb+.16;
      var da=P(doorX-doorW,doorY,df-.03), db2=P(doorX+doorW,doorY,df-.03),
          dc=P(doorX+doorW,doorY+doorH,df-.03), dd=P(doorX-doorW,doorY+doorH,df-.03);
      ctx.beginPath(); ctx.moveTo(da.x,da.y); ctx.lineTo(db2.x,db2.y); ctx.lineTo(dc.x,dc.y); ctx.lineTo(dd.x,dd.y); ctx.closePath();
      ctx.strokeStyle="rgba(255,255,255,.75)"; ctx.lineWidth=Math.max(.8,s*.03); ctx.stroke();
      ctx.beginPath(); ctx.moveTo((da.x+db2.x)/2,da.y); ctx.lineTo((dd.x+dc.x)/2,dc.y); ctx.stroke();
    }
  }

  function drawWheels(x, d, half) {
    var p=P(x-half,.3,d), r=Math.max(1.5,.28*p.s);
    wheel(p.x,p.y,r,wheelAngle);
    var q=P(x+half,.3,d), r2=Math.max(1.5,.28*q.s);
    wheel(q.x,q.y,r2,wheelAngle+Math.PI);
  }
  function drawSmoke() {
    smoke.forEach(function (p) {
      var q=P(p.x,p.y,p.d);
      ctx.globalAlpha=Math.max(0,p.life)*.6; ctx.fillStyle="#fff";
      ctx.beginPath(); ctx.arc(q.x,q.y,p.r*q.s,0,6.28); ctx.fill();
    });
    ctx.globalAlpha=1;
  }
  function drawPickup(p) {
    var yOff = .12 + Math.sin(p.phase)*.12;
    var q=P(TRACK_X[p.track], (p.type==="balloon"?2.0:1.05)+yOff, p.d);
    if (q.s<1) return;
    var r=Math.min(q.s*.55, H*.06);
    if (p.type==="star") drawStar(q.x,q.y,r,"#ffd166","#ff9f1c");
    else if (p.type==="heart") drawHeart(q.x,q.y,r,"#ff5d8f");
    else drawBalloon(q.x,q.y,r,p.color);
  }

  /* ================= 烟花 / 特效（2D overlay） ================= */
  var fwColors=["#ff595e","#ffca3a","#8ac926","#1982c4","#c77dff","#ff9f1c"];
  function spawnFirework(px,py) {
    var c=fwColors[Math.floor(Math.random()*fwColors.length)];
    for (var i=0;i<26;i++) {
      var a=i/26*Math.PI*2, sp=2+Math.random()*3.5;
      fireworks.push({x:px,y:py,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color:c});
    }
  }
  // 加速速度线：从画面中心向外飞的白线，营造往前冲的感觉
  var speedLines=[];
  function spawnSpeedLine() {
    var a=Math.random()*Math.PI*2;
    var r0=Math.min(W,H)*(.12+Math.random()*.10);
    speedLines.push({ ang:a, r:r0, len:14+Math.random()*26, spd:9+Math.random()*12, life:1, w:2+Math.random()*2.5 });
  }
  // 镜头推近冲击 0..1
  var boostPunch=0;
  // 屏幕浮动提示文字
  var toasts=[];
  function toast(text, color) {
    toasts.push({ text:text, x:W/2, y:H*.30, life:1, color:color||"#fff" });
  }

  /* ---- 新特效技能：彩虹 / 星雨 / 爱心 / 彩带 / 泡泡 ---- */
  var fxParts=[];    // 通用装饰粒子
  var rainbowT=0;    // 彩虹弧生命周期 1→0

  function emitFx(kind) {
    if (kind==="rainbow") { rainbowT=1; return; }
    var i,n,p;
    if (kind==="stars") {
      for (i=0;i<34;i++) fxParts.push({ kind:"star", x:Math.random()*W, y:-20-Math.random()*H*.4,
        vx:(Math.random()-.5)*1.2, vy:2.2+Math.random()*2.6, life:1, decay:.006+Math.random()*.006,
        size:7+Math.random()*8, color:fwColors[Math.floor(Math.random()*fwColors.length)],
        rot:Math.random()*6.28, vr:(Math.random()-.5)*.16, sway:0 });
    } else if (kind==="hearts") {
      var hc=["#ff5c8a","#ff8fab","#ffb3c6","#ff4d6d"];
      for (i=0;i<28;i++) fxParts.push({ kind:"heart", x:Math.random()*W, y:H+20+Math.random()*120,
        vx:(Math.random()-.5)*.8, vy:-(1.6+Math.random()*2), life:1, decay:.005+Math.random()*.005,
        size:9+Math.random()*9, color:hc[i%hc.length], rot:0, vr:0, sway:Math.random()*6.28 });
    } else if (kind==="confetti") {
      for (i=0;i<46;i++) fxParts.push({ kind:"confetti", x:Math.random()*W, y:-20-Math.random()*H*.5,
        vx:(Math.random()-.5)*1.6, vy:1.8+Math.random()*2.4, life:1, decay:.004+Math.random()*.004,
        size:5+Math.random()*6, color:fwColors[Math.floor(Math.random()*fwColors.length)],
        rot:Math.random()*6.28, vr:(Math.random()-.5)*.3, sway:0 });
    } else if (kind==="bubbles") {
      var bc=["#ff9ff3","#54a0ff","#5ee7df","#feca57","#a29bfe"];
      for (i=0;i<30;i++) fxParts.push({ kind:"bubble", x:Math.random()*W, y:H+20+Math.random()*100,
        vx:(Math.random()-.5)*.6, vy:-(1.4+Math.random()*1.8), life:1, decay:.004+Math.random()*.004,
        size:6+Math.random()*12, color:bc[i%bc.length], rot:0, vr:0, sway:Math.random()*6.28 });
    }
  }

  function updateFxParts() {
    if (rainbowT>0) rainbowT=Math.max(0, rainbowT-.010);
    fxParts.forEach(function (p) {
      p.x+=p.vx; p.y+=p.vy;
      if (p.sway) p.x+=Math.sin((1-p.life)*9+p.sway)*.6;
      if (p.vr) p.rot+=p.vr;
      if (p.kind==="star"||p.kind==="confetti") p.vy+=.012; // 轻微重力
      p.life-=p.decay;
    });
    fxParts=fxParts.filter(function (p) { return p.life>0 && p.y>-90 && p.y<H+90; });
  }

  function starPath(g,r) {
    g.beginPath();
    for (var i=0;i<10;i++) {
      var ang=-Math.PI/2+i*Math.PI/5, rr=(i%2===0)?r:r*.42;
      var x=Math.cos(ang)*rr, y=Math.sin(ang)*rr;
      if (i===0) g.moveTo(x,y); else g.lineTo(x,y);
    }
    g.closePath();
  }
  function heartPath(g) {
    g.beginPath(); g.moveTo(0,6);
    g.bezierCurveTo(-14,-3,-9,-15,0,-7);
    g.bezierCurveTo(9,-15,14,-3,0,6);
    g.closePath();
  }
  function drawFxParts() {
    // 彩虹：7 色同心半圆，从底部拱起并淡出
    if (rainbowT>0) {
      var cx=W/2, cy=H*.96, lw=Math.max(4,Math.min(W,H)*.018);
      var base=Math.min(W,H)*.16+(1-rainbowT)*Math.min(W,H)*.20;
      var rc=["#ff3b30","#ff9500","#ffcc00","#34c759","#00c7be","#007aff","#af52ed"];
      fx.lineWidth=lw;
      for (var i=0;i<rc.length;i++) {
        fx.globalAlpha=Math.max(0,rainbowT)*.85;
        fx.strokeStyle=rc[i];
        fx.beginPath(); fx.arc(cx,cy,base+i*lw*1.05,Math.PI,Math.PI*2); fx.stroke();
      }
      fx.globalAlpha=1;
    }
    fxParts.forEach(function (p) {
      fx.globalAlpha=Math.max(0,Math.min(1,p.life*1.4));
      fx.save(); fx.translate(p.x,p.y);
      if (p.kind==="star") {
        fx.rotate(p.rot); starPath(fx,p.size);
        fx.fillStyle=p.color; fx.fill();
        fx.strokeStyle="rgba(255,255,255,.85)"; fx.lineWidth=1.5; fx.stroke();
      } else if (p.kind==="heart") {
        fx.scale(p.size/16,p.size/16); heartPath(fx);
        fx.fillStyle=p.color; fx.fill();
      } else if (p.kind==="confetti") {
        fx.rotate(p.rot); fx.fillStyle=p.color;
        fx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);
      } else if (p.kind==="bubble") {
        fx.beginPath(); fx.arc(0,0,p.size,0,6.28);
        fx.fillStyle="rgba(255,255,255,.10)"; fx.fill();
        fx.strokeStyle=p.color; fx.lineWidth=2; fx.stroke();
        fx.beginPath(); fx.arc(-p.size*.3,-p.size*.35,p.size*.18,0,6.28);
        fx.fillStyle="rgba(255,255,255,.7)"; fx.fill();
      }
      fx.restore();
    });
    fx.globalAlpha=1;
  }

  /* ================= 主循环 ================= */
  function animate() {
    if (!running) return;
    requestAnimationFrame(animate);
    if (quizPaused) return; // 做题弹窗时暂停
    var realSpeed = fast ? speed*2.9 : speed;
    offset += realSpeed;
    distance += realSpeed*.5;
    wheelAngle += realSpeed*.5;
    var night = (1-Math.cos(distance*Math.PI/150))/2;
    if (engine) engine.lfo.frequency.value = fast ? 10 : 6;

    // 加速冲击衰减 + 速度线飞散
    if (boostPunch>0) boostPunch=Math.max(0, boostPunch-.02);
    if (fast) { for (var sl=0; sl<5; sl++) spawnSpeedLine(); }
    speedLines.forEach(function (l) { l.r+=l.spd*(fast?1:.35); l.life-=.02; });
    speedLines=speedLines.filter(function (l) { return l.life>0 && l.r<Math.max(W,H)*.78; });
    // 浮动提示上飘淡出
    toasts.forEach(function (t) { t.y-=1.1; t.life-=.018; });
    toasts=toasts.filter(function (t) { return t.life>0; });
    updateFxParts(); // 新特效粒子（彩虹/星雨/爱心/彩带/泡泡）

    // 车头平滑趋近目标轨道；加大系数让左右换轨更迅速
    trainX += (TRACK_X[currentTrack]-trainX)*.24;
    var lead = trainX;
    for (var ci=0; ci<carX.length; ci++) {
      carX[ci] += (lead - carX[ci]) * CAR_FOLLOW;
      lead = carX[ci];
    }

    // 景物移动
    trees.forEach(function (t) { t.d-=realSpeed; if (t.d<NEAR) { t.d=FAR; t.x=(Math.random()<.5?-1:1)*(5+Math.random()*15); } });
    clouds.forEach(function (c) { c.d-=realSpeed*.35; if (c.d<12) { c.d=FAR; c.x=(Math.random()-.5)*40; } });

    // 生成
    if (offset-lastPick>13) { spawnPickup(); lastPick=offset; }
    if (!tunnel && offset-lastTunnel>230) { spawnTunnel(); lastTunnel=offset; }

    var m=Math.floor(distance/100);
    if (m>lastMilestone) { lastMilestone=m; flash=.4; playBell(); }

    // 收集物
    pickups.forEach(function (p) {
      p.d-=realSpeed; p.phase+=.08;
      if (!p.got && p.track===currentTrack && Math.abs(p.d-HEAD_D)<1.5) {
        p.got=true;
        if (p.type==="star") { score+=1; playDing(); }
        else if (p.type==="heart") { score+=2; playChime(); }
        else { score+=3; playPop(); }
        document.getElementById("score").textContent=score;
      }
      if (p.d<NEAR-1) p.got=true;
    });
    pickups=pickups.filter(function (p) { return !p.got; });

    // 隧道
    if (tunnel) {
      tunnel.d-=realSpeed;
      var dist=tunnel.d-HEAD_D;
      if (Math.abs(dist)<9) {
        if (!tunnel.entered) { tunnel.entered=true; playWhoosh(); }
        tunnel.dim=(1-Math.abs(dist)/9)*.75;
      } else {
        tunnel.dim=0;
        if (tunnel.entered && dist<-9 && !tunnel.exited) {
          tunnel.exited=true; score+=5; document.getElementById("score").textContent=score;
          playDing(); flash=.5;
          spawnFirework(W*.5,H*.4); spawnFirework(W*.3,H*.3); spawnFirework(W*.7,H*.35);
        }
        if (tunnel.d<NEAR-4) { tunnel=null; lastTunnel=offset; }
      }
    }

    // 烟雾（车头烟囱处）
    if (Math.random()< (fast?.5:.3)) {
      smoke.push({ x:trainX, y:2.9, d:HEAD_D-.7, r:.28, life:1, vy:.02+Math.random()*.02, vd:-.03 });
    }
    smoke.forEach(function (p) { p.y+=p.vy; p.d+=p.vd; p.r+=.012; p.life-=.012; });
    smoke=smoke.filter(function (p) { return p.life>0; });

    document.getElementById("dist").textContent=Math.floor(distance);

    /* ---- 绘制 ---- */
    drawSky(night);
    drawGround(night);
    drawTracks();
    // 远处到近处
    var layer=[];
    trees.forEach(function (o) { layer.push({d:o.d, f:function(){drawTree(o);}}); });
    clouds.forEach(function (o) { layer.push({d:o.d, f:function(){drawCloud(o);}}); });
    pickups.forEach(function (o) { layer.push({d:o.d, f:function(){drawPickup(o);}}); });
    layer.sort(function (a,b) { return b.d-a.d; });
    layer.forEach(function (o) { o.f(); });
    drawTunnel();
    drawTrain();
    drawSmoke();

    // 夜晚暗幕
    if (night>0) { ctx.fillStyle="rgba(10,14,40,"+(night*.28)+")"; ctx.fillRect(0,0,W,H); }
    // 隧道变暗
    if (tunnel && tunnel.dim>0) { ctx.fillStyle="rgba(15,15,25,"+tunnel.dim+")"; ctx.fillRect(0,0,W,H); }

    fx.clearRect(0,0,W,H);
    fireworks.forEach(function (p) {
      p.x+=p.vx; p.y+=p.vy; p.vy+=.06; p.life-=.02;
      fx.globalAlpha=Math.max(0,p.life); fx.fillStyle=p.color;
      fx.beginPath(); fx.arc(p.x,p.y,3,0,6.28); fx.fill();
    });
    fx.globalAlpha=1;
    fireworks=fireworks.filter(function (p) { return p.life>0; });
    // 加速速度线（屏幕中心向外，深色描边+白芯，亮背景下也清晰）
    var scx=W/2, scy=H*.5;
    fx.lineCap="round";
    speedLines.forEach(function (l) {
      var c=Math.cos(l.ang), s=Math.sin(l.ang), r1=l.r, r2=l.r+l.len;
      var a=Math.max(0,l.life);
      fx.globalAlpha=a*.55;
      fx.strokeStyle="rgba(20,40,60,.9)"; fx.lineWidth=l.w+3;
      fx.beginPath(); fx.moveTo(scx+c*r1,scy+s*r1); fx.lineTo(scx+c*r2,scy+s*r2); fx.stroke();
      fx.globalAlpha=a;
      fx.strokeStyle="#ffffff"; fx.lineWidth=l.w;
      fx.beginPath(); fx.moveTo(scx+c*r1,scy+s*r1); fx.lineTo(scx+c*r2,scy+s*r2); fx.stroke();
    });
    fx.globalAlpha=1;
    // 加速瞬间画面边缘发白（推背冲击）
    if (boostPunch>0) {
      var grd=fx.createRadialGradient(W/2,H/2,Math.min(W,H)*.2, W/2,H/2,Math.max(W,H)*.62);
      grd.addColorStop(0,"rgba(255,255,255,0)");
      grd.addColorStop(1,"rgba(255,255,255,"+(boostPunch*.55)+")");
      fx.fillStyle=grd; fx.fillRect(0,0,W,H);
    }
    // 浮动提示文字
    fx.textAlign="center"; fx.textBaseline="middle";
    toasts.forEach(function (t) {
      fx.globalAlpha=Math.max(0,Math.min(1,t.life*1.6));
      fx.font="900 "+Math.round(Math.min(W,H)*.085)+"px system-ui,sans-serif";
      fx.lineWidth=7; fx.strokeStyle="rgba(0,0,0,.35)";
      fx.strokeText(t.text,t.x,t.y);
      fx.fillStyle=t.color; fx.fillText(t.text,t.x,t.y);
    });
    fx.globalAlpha=1; fx.textAlign="start"; fx.textBaseline="alphabetic";
    drawFxParts(); // 新特效粒子绘制在顶层（彩虹/星雨/爱心/彩带/泡泡）
    if (flash>0) {
      flash-=.015; fx.fillStyle="rgba(255,255,255,"+Math.min(flash,.6)+")"; fx.fillRect(0,0,W,H);
    }
  }

  /* ================= 交互 ================= */
  function honk() {
    playWhistle();
    for (var i=0;i<6;i++) smoke.push({x:trainX,y:2.9,d:HEAD_D-.7,r:.28,life:1,vy:.03+Math.random()*.04,vd:-.03});
    if (running) toast("呜—— 🚂", "#fff");
  }
  document.getElementById("btnWhistle").addEventListener("click", honk);
  document.getElementById("btnBell").addEventListener("click", function () {
    playBell(); if (running) toast("叮咚 🔔", "#ffe066");
  });
  document.getElementById("btnSteam").addEventListener("click", function () {
    playSteam();
    for (var i=0;i<10;i++) smoke.push({x:trainX+(Math.random()-.5)*.5,y:2.6,d:HEAD_D-.6,r:.3,life:1,vy:.04+Math.random()*.05,vd:-.05});
    if (running) toast("噗—— 💨", "#e8f8ff");
  });
  var speedBtn=document.getElementById("btnSpeed");
  speedBtn.addEventListener("click", function () {
    fast=!fast;
    speedBtn.style.background=fast?"#06d6a0":"#ffa62b";
    speedBtn.querySelector("small").textContent=fast?"常速":"加速";
    if (fast) {
      boostPunch=1;
      playBoost();
      for (var i=0;i<14;i++) smoke.push({x:trainX+(Math.random()-.5)*.8,y:2.2,d:HEAD_D-.6,r:.32,life:1,vy:.05+Math.random()*.06,vd:-.08});
      if (running) toast("⚡ 冲啊！", "#06d6a0");
    } else if (running) toast("慢下来 🚂", "#ffa62b");
  });
  document.getElementById("btnParty").addEventListener("click", function () {
    ensureAudio(); playFirework();
    spawnFirework(W*.3,H*.35); spawnFirework(W*.6,H*.3); spawnFirework(W*.45,H*.5);
    if (running) toast("🎉 好耶！", "#c77dff");
  });
  // 新增特效技能
  document.getElementById("btnRainbow").addEventListener("click", function () {
    ensureAudio(); playChime(); emitFx("rainbow");
    if (running) toast("🌈 彩虹！", "#ffd166");
  });
  document.getElementById("btnStars").addEventListener("click", function () {
    ensureAudio(); playDing(); emitFx("stars");
    if (running) toast("✨ 星雨！", "#ffe066");
  });
  document.getElementById("btnHearts").addEventListener("click", function () {
    ensureAudio(); playPop(); emitFx("hearts");
    if (running) toast("💗 爱心！", "#ff8fab");
  });
  document.getElementById("btnConfetti").addEventListener("click", function () {
    ensureAudio(); playFirework(); emitFx("confetti");
    if (running) toast("🎊 彩带！", "#8ac926");
  });
  document.getElementById("btnBubbles").addEventListener("click", function () {
    ensureAudio(); playSteam(); emitFx("bubbles");
    if (running) toast("🫧 泡泡！", "#a0e7ff");
  });
  function switchTrack(dir) { currentTrack = Math.max(0, Math.min(2, currentTrack + dir)); }
  document.getElementById("btnLeft").addEventListener("click", function () { switchTrack(-1); });
  document.getElementById("btnRight").addEventListener("click", function () { switchTrack(1); });
  // 移动端触摸适配：在画面上左右滑动换轨；轻点仍鸣笛
  var ptrStart = null;
  cv.addEventListener("pointerdown", function (e) {
    ensureAudio();
    ptrStart = { x: e.clientX, y: e.clientY, t: Date.now() };
  });
  cv.addEventListener("pointerup", function (e) {
    if (!ptrStart) { honk(); return; }
    var dx = e.clientX - ptrStart.x, dy = e.clientY - ptrStart.y;
    var dt = Date.now() - ptrStart.t;
    ptrStart = null;
    if (Math.abs(dx) > 28 && Math.abs(dx) > Math.abs(dy) * 1.3) {
      switchTrack(dx > 0 ? 1 : -1);      // 右滑向右换轨，左滑向左换轨
    } else if (Math.abs(dx) < 14 && Math.abs(dy) < 14 && dt < 400) {
      honk();                            // 轻点鸣笛
    }
  });
  cv.addEventListener("pointercancel", function () { ptrStart = null; });

  window.addEventListener("resize", resize);
  resize();

  // 进入即直接开始游戏（音频受浏览器策略限制，首次触摸时自动恢复）
  ensureAudio(); startEngine();
  if (!running) { running=true; initScene(); animate(); }
  // 玩法提示先展示几秒再淡出，避免一直挡住画面
  setTimeout(function () { document.getElementById("hint").classList.add("hidden"); }, 5000);

  // 接入公共定时做题模块：弹窗时暂停
  if (window.GameQuiz) {
    GameQuiz.init({
      isPlaying: function () { return running; },
      onOpen: function () { quizPaused = true; },
      onClose: function () { quizPaused = false; },
      onReward: function () { score += 5; document.getElementById("score").textContent = score; }
    });
  }
})();
</script>
</body>
</html>
