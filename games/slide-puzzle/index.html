<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>🔢 数字华容道</title>
<link rel="stylesheet" href="../../theme.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; min-height:100%; overflow-x:hidden; font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
  body { background:linear-gradient(160deg,#fff4e6 0%,#eef3ff 55%,#eafaf1 100%); background-attachment:fixed; color:#3b2f2f; padding-bottom:calc(26px + env(safe-area-inset-bottom)); }
  .home-btn { position:fixed; left:12px; top:calc(12px + env(safe-area-inset-top)); z-index:30;
    width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,.92);
    border:3px solid #ffb703; box-shadow:0 4px 0 rgba(0,0,0,.14); color:#d62828;
    display:flex; align-items:center; justify-content:center; font-size:26px; text-decoration:none; }
  .home-btn:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.14); }
  .hero { text-align:center; padding:calc(20px + env(safe-area-inset-top)) 12px 4px; }
  .hero .logo { font-size:46px; animation:bob 3s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0) rotate(-5deg)} 50%{transform:translateY(-7px) rotate(5deg)} }
  .hero h1 { font-size:clamp(22px,6vw,30px); margin:4px 0; color:#3949ab; }
  .hero p { font-size:13px; color:#8b7d7d; max-width:420px; margin:0 auto; }
  .bar { display:flex; justify-content:center; gap:12px; margin:10px 0 12px; flex-wrap:wrap; }
  .pill { background:#fff; border:3px solid #c5cae9; border-radius:999px; padding:7px 16px;
    font-size:16px; font-weight:800; color:#3949ab; box-shadow:0 4px 0 #9fa8da; white-space:nowrap; }
  .wrap { max-width:520px; margin:0 auto; padding:0 16px; text-align:center; }
  .board { display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
    gap:8px; width:100%; max-width:390px; aspect-ratio:1/1; margin:0 auto; padding:10px;
    background:linear-gradient(180deg,#dfe6ff,#c5d0ff); border-radius:20px; box-shadow:0 8px 18px rgba(80,90,160,.28); }
  .tile { border-radius:16px; display:flex; align-items:center; justify-content:center;
    font-size:clamp(32px,10vw,54px); font-weight:900; color:#fff; text-shadow:0 2px 2px rgba(0,0,0,.18);
    cursor:pointer; user-select:none; border:2px solid rgba(255,255,255,.7);
    background:linear-gradient(160deg,#a9c0ff,#5c7cfa);
    box-shadow:inset 0 4px 0 rgba(255,255,255,.45), inset 0 -3px 0 rgba(0,0,0,.08), 0 5px 0 #3f51b5, 0 8px 14px rgba(60,80,160,.2);
    transition:transform .1s; }
  .tile:active { transform:scale(.95); }
  .tile.empty { background:rgba(255,255,255,.32); border-color:transparent; box-shadow:inset 0 3px 8px rgba(0,0,0,.1); cursor:default; }
  .tile.correct { background:linear-gradient(160deg,#a5e6b0,#4caf50); box-shadow:inset 0 4px 0 rgba(255,255,255,.45), inset 0 -3px 0 rgba(0,0,0,.08), 0 5px 0 #388e3c, 0 8px 14px rgba(60,140,80,.2); }
  .tools { display:flex; justify-content:center; gap:14px; margin:18px 0 4px; flex-wrap:wrap; }
  .btn { border:none; border-radius:999px; padding:12px 26px; font-size:17px; font-weight:900; color:#fff; cursor:pointer;
    box-shadow:0 5px 0 rgba(0,0,0,.16); }
  .btn:active { transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.16); }
  .btn.new { background:linear-gradient(180deg,#ff8fab,#ff6b81); box-shadow:0 5px 0 #e84d68; }
  .btn.shuffle { background:linear-gradient(180deg,#ffd166,#ffa62b); box-shadow:0 5px 0 #e08600; }
  .overlay { position:fixed; inset:0; z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92); backdrop-filter:blur(4px); text-align:center; padding:20px; }
  .overlay.hidden { display:none; }
  .overlay .big { font-size:76px; animation:pop .6s ease; }
  @keyframes pop { 0%{transform:scale(.6)} 60%{transform:scale(1.15)} 100%{transform:scale(1)} }
  .overlay h2 { font-size:30px; color:#3949ab; margin:8px 0; }
  .overlay p { font-size:18px; color:#6d6262; margin:6px 0 20px; }
  .overlay .btn { background:linear-gradient(180deg,#81C784,#4CAF50); box-shadow:0 5px 0 #388E3C; }
</style>
</head>
<body>
<a class="home-btn" href="../../" aria-label="返回主页" title="返回主页">🏠</a>

<header class="hero">
  <div class="logo">🔢</div>
  <h1>数字华容道</h1>
  <p>点空格旁边的数字，把它挪进空位，把 1～8 按顺序排好就成功啦！</p>
</header>

<div class="bar">
  <div class="pill">👣 步数 <span id="steps">0</span></div>
  <div class="pill">⏱ <span id="time">00:00</span></div>
</div>

<div class="wrap">
  <div class="board" id="board"></div>
  <div class="tools">
    <button class="btn shuffle" id="shuffleBtn">🔀 重新打乱</button>
    <button class="btn new" id="newBtn">🔄 重新开始</button>
  </div>
</div>

<div class="overlay hidden" id="overlay">
  <div class="big">🏆</div>
  <h2>排好啦！</h2>
  <p id="ovText"></p>
  <button class="btn" id="ovBtn">再玩一次</button>
</div>

<script src="../../icons.js"></script>
<script src="../../quiz.js"></script>
<script>
(function () {
  "use strict";
  var boardEl = document.getElementById("board");
  var stepsEl = document.getElementById("steps"), timeEl = document.getElementById("time");
  var overlay = document.getElementById("overlay");
  var SOLVED = [1,2,3,4,5,6,7,8,0];
  var tiles = [], steps = 0, elapsed = 0, timer = null;
  var finished = false, quizPaused = false;

  function fmt(t) {
    var m = Math.floor(t / 60), s = t % 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }
  function render() {
    boardEl.innerHTML = "";
    for (var i = 0; i < 9; i++) {
      var v = tiles[i], d = document.createElement("div");
      if (v === 0) {
        d.className = "tile empty";
      } else {
        d.className = "tile";
        if (v === i + 1) d.classList.add("correct");
        d.textContent = v;
        (function (idx) { d.addEventListener("click", function () { tap(idx); }); })(i);
      }
      boardEl.appendChild(d);
    }
  }
  function neighbors(idx) {
    var r = Math.floor(idx / 3), c = idx % 3, out = [];
    if (r > 0) out.push(idx - 3);
    if (r < 2) out.push(idx + 3);
    if (c > 0) out.push(idx - 1);
    if (c < 2) out.push(idx + 1);
    return out;
  }
  function tap(idx) {
    if (finished || quizPaused || tiles[idx] === 0) return;
    var blank = tiles.indexOf(0);
    if (neighbors(blank).indexOf(idx) < 0) return;
    tiles[blank] = tiles[idx]; tiles[idx] = 0;
    steps++; stepsEl.textContent = steps;
    render();
    if (isSolved()) win();
  }
  function isSolved() {
    for (var i = 0; i < 9; i++) if (tiles[i] !== SOLVED[i]) return false;
    return true;
  }
  function shuffle() {
    // 从完成态随机走 300 步，保证一定有解
    tiles = SOLVED.slice();
    var lastBlank = 8;
    for (var k = 0; k < 300; k++) {
      var ns = neighbors(lastBlank);
      var pick = ns[Math.floor(Math.random() * ns.length)];
      tiles[lastBlank] = tiles[pick]; tiles[pick] = 0;
      lastBlank = pick;
    }
    if (isSolved()) return shuffle();
  }
  function startTimer() {
    if (timer) clearInterval(timer);
    timer = setInterval(function () {
      if (finished || quizPaused) return;
      elapsed++; timeEl.textContent = fmt(elapsed);
    }, 1000);
  }
  function win() {
    finished = true; clearInterval(timer);
    document.getElementById("ovText").textContent = "你用了 " + steps + " 步、" + fmt(elapsed) + " 排好了，太棒啦！";
    overlay.classList.remove("hidden");
  }
  function reset() {
    shuffle(); steps = 0; elapsed = 0; finished = false;
    stepsEl.textContent = "0"; timeEl.textContent = "00:00";
    overlay.classList.add("hidden");
    render(); startTimer();
  }

  document.getElementById("shuffleBtn").addEventListener("click", function () { if (!finished && !quizPaused) reset(); });
  document.getElementById("newBtn").addEventListener("click", reset);
  document.getElementById("ovBtn").addEventListener("click", reset);

  reset();

  if (window.GameQuiz) {
    GameQuiz.init({
      isPlaying: function () { return !finished && overlay.classList.contains("hidden"); },
      onOpen: function () { quizPaused = true; },
      onClose: function () { quizPaused = false; }
    });
  }
})();
</script>
</body>
</html>
