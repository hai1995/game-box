<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>🗺️ 小探险家走迷宫</title>
<link rel="stylesheet" href="../../theme.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; font-family:"PingFang SC","Microsoft YaHei","Comic Sans MS",system-ui,sans-serif; user-select:none; -webkit-user-select:none; touch-action:none; }
  body { background:linear-gradient(160deg,#fde9c8 0%,#ffe0e6 55%,#dcefff 100%); display:flex; flex-direction:column; align-items:center; }
  .home-btn { position:fixed; left:12px; top:calc(12px + env(safe-area-inset-top)); z-index:30;
    width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,.92);
    border:3px solid #ffb703; box-shadow:0 4px 0 rgba(0,0,0,.14); color:#d62828;
    display:flex; align-items:center; justify-content:center; font-size:24px; text-decoration:none; }
  .home-btn:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.14); }
  .hud { display:flex; justify-content:center; gap:10px; width:100%; padding:calc(14px + env(safe-area-inset-top)) 70px 10px; }
  .pill { background:#fff; border:3px solid #ffb703; border-radius:999px; padding:6px 16px;
    font-size:clamp(14px,4vw,18px); font-weight:800; color:#e07a00; box-shadow:0 4px 0 #f0a500; white-space:nowrap; }
  #wrap { flex:1; width:100%; display:flex; align-items:center; justify-content:center; padding:0 12px; min-height:0; }
  canvas { background:rgba(255,255,255,.55); border-radius:18px; box-shadow:0 8px 24px rgba(120,90,90,.18); touch-action:none; }
  .dpad { display:grid; grid-template-columns:repeat(3,64px); grid-template-rows:repeat(2,58px); gap:8px;
    justify-content:center; margin-bottom:calc(14px + env(safe-area-inset-bottom)); }
  .dpad button { border:none; border-radius:18px; font-size:30px; font-weight:900; color:#fff;
    background:linear-gradient(180deg,#ff9f68,#ff7a45); box-shadow:0 5px 0 #d9541f; cursor:pointer; }
  .dpad button:active { transform:translateY(3px); box-shadow:0 2px 0 #d9541f; }
  /* 移动端触摸适配：隐藏虚拟方向键显示，保留按钮及事件；操作用棋盘滑动手势 */
  .dpad { display:none !important; }
  .overlay { position:fixed; inset:0; z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92); backdrop-filter:blur(4px); text-align:center; }
  .overlay.hidden { display:none; }
  .overlay .big { font-size:80px; }
  .overlay h2 { font-size:30px; color:#ff6b81; margin:8px 0; }
  .overlay p { font-size:17px; color:#6d6262; margin:6px 0 20px; }
  .btn { border:none; border-radius:999px; padding:13px 38px; font-size:21px; font-weight:900; color:#fff;
    background:linear-gradient(180deg,#ff8fab,#ff6b81); box-shadow:0 6px 0 #e84d68; cursor:pointer; }
  .btn:active { transform:translateY(3px); box-shadow:0 3px 0 #e84d68; }
</style>
</head>
<body>
<a class="home-btn" href="../../" aria-label="返回主页" title="返回主页">🏠</a>
<div class="hud">
  <div class="pill">🗺️ 第 <span id="level">1</span> 关</div>
  <div class="pill">👣 <span id="steps">0</span> 步</div>
</div>

<div id="wrap"><canvas id="cv"></canvas></div>

<div class="dpad">
  <button class="up" data-dir="up">⬆️</button>
  <button class="left" data-dir="left">⬅️</button>
  <button class="down" data-dir="down">⬇️</button>
  <button class="right" data-dir="right">➡️</button>
</div>

<div class="overlay" id="winScreen">
  <div class="big">🎉</div>
  <h2>走出迷宫啦！</h2>
  <p id="winText">用了 0 步</p>
  <button class="btn" id="nextBtn">下一关 ➡️</button>
</div>

<script src="../../icons.js"></script>
<script src="../../quiz.js"></script>
<script src="../../save.js"></script>
<script>
(function () {
  "use strict";
  var SAVE_KEY = "maze-escape";
  var kidImg = GameIcons.image("kid", function () { draw(); });
  var flagImg = GameIcons.image("flag", function () { draw(); });
  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var wrap = document.getElementById("wrap");
  var levelEl = document.getElementById("level");
  var stepsEl = document.getElementById("steps");
  var winScreen = document.getElementById("winScreen");
  var level = 1, steps = 0, cols, rows, grid, px, py, cell, ox, oy, moving = false;
  var quizPaused = false; // 答题弹窗期间禁止移动（键盘/触摸/方向键）

  // 生成迷宫（递归回溯）：1=墙 0=路
  function generate(c, r) {
    var g = [];
    for (var y = 0; y < r; y++) { g[y] = []; for (var x = 0; x < c; x++) g[y][x] = 1; }
    var stack = [[1, 1]];
    g[1][1] = 0;
    var dirs = [[0,-2],[0,2],[-2,0],[2,0]];
    while (stack.length) {
      var cur = stack[stack.length - 1];
      var opts = [];
      for (var i = 0; i < dirs.length; i++) {
        var nx = cur[0] + dirs[i][0], ny = cur[1] + dirs[i][1];
        if (nx > 0 && ny > 0 && nx < c - 1 && ny < r - 1 && g[ny][nx] === 1) opts.push(dirs[i]);
      }
      if (opts.length) {
        var d = opts[Math.floor(Math.random() * opts.length)];
        g[cur[1] + d[1] / 2][cur[0] + d[0] / 2] = 0;
        g[cur[1] + d[1]][cur[0] + d[0]] = 0;
        stack.push([cur[0] + d[0], cur[1] + d[1]]);
      } else {
        stack.pop();
      }
    }
    return g;
  }

  function resize() {
    if (!grid) return;
    var maxW = Math.min(wrap.clientWidth - 8, 560);
    var maxH = Math.max(120, wrap.clientHeight - 8);
    cell = Math.floor(Math.min(maxW / cols, maxH / rows));
    var w = cell * cols, h = cell * rows;
    var dpr = window.devicePixelRatio || 1;
    cv.width = w * dpr; cv.height = h * dpr;
    cv.style.width = w + "px"; cv.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function draw() {
    if (!grid) return;
    var w = cell * cols, h = cell * rows;
    ctx.clearRect(0, 0, w, h);
    // 背景
    ctx.fillStyle = "#fffdf5";
    ctx.fillRect(0, 0, w, h);
    // 墙
    for (var y = 0; y < rows; y++) {
      for (var x = 0; x < cols; x++) {
        if (grid[y][x] === 1) {
          var gx = x * cell, gy = y * cell;
          var grd = ctx.createLinearGradient(gx, gy, gx, gy + cell);
          grd.addColorStop(0, "#7c5cff");
          grd.addColorStop(1, "#5a3fd6");
          ctx.fillStyle = grd;
          roundRect(gx + 1, gy + 1, cell - 2, cell - 2, Math.max(3, cell * .18));
          ctx.fill();
        }
      }
    }
    // 终点
    var fs = cell * .86;
    if (flagImg && flagImg.complete) ctx.drawImage(flagImg, (cols - 2 + .5) * cell - fs / 2, (rows - 2 + .5) * cell - fs / 2, fs, fs);
    else { ctx.fillStyle = "#e53935"; ctx.fillRect((cols - 2 + .5) * cell - fs / 3, (rows - 2 + .5) * cell - fs / 3, fs * .66, fs * .66); }
    // 玩家
    var ps = cell * .92;
    if (kidImg && kidImg.complete) ctx.drawImage(kidImg, (px + .5) * cell - ps / 2, (py + .5) * cell - ps / 2, ps, ps);
    else { ctx.fillStyle = "#42a5f5"; ctx.beginPath(); ctx.arc((px + .5) * cell, (py + .5) * cell, ps * .34, 0, Math.PI * 2); ctx.fill(); }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // 存档：保存迷宫布局与位置，刷新后原样恢复继续走
  var MAX_KEY = "maze-escape-max"; // 历史最高关卡独立持久化，布局结构升级/存档失效时也不丢进度
  function getMaxLevel() {
    var m = window.GameSave ? GameSave.load(MAX_KEY, null) : null;
    return m && typeof m.max === "number" && m.max >= 1 ? Math.floor(m.max) : 1;
  }
  function bumpMaxLevel(n) {
    if (n > getMaxLevel() && window.GameSave) GameSave.save(MAX_KEY, { max: n });
  }
  function saveGame() {
    if (!grid) return;
    bumpMaxLevel(level);
    if (window.GameSave) GameSave.save(SAVE_KEY, {
      level: level, cols: cols, rows: rows,
      grid: grid, px: px, py: py, steps: steps
    });
  }

  function validSave(s) {
    return s && Array.isArray(s.grid) &&
      typeof s.level === "number" && s.level >= 1 &&
      typeof s.cols === "number" && typeof s.rows === "number" &&
      s.grid.length === s.rows && Array.isArray(s.grid[0]) && s.grid[0].length === s.cols &&
      typeof s.px === "number" && typeof s.py === "number" &&
      s.px >= 0 && s.py >= 0 && s.px < s.cols && s.py < s.rows &&
      typeof s.steps === "number" && s.steps >= 0 &&
      s.grid[s.py] && s.grid[s.py][s.px] === 0;
  }

  function restoreLevel(s) {
    level = s.level; steps = s.steps; cols = s.cols; rows = s.rows;
    grid = s.grid; px = s.px; py = s.py;
    stepsEl.textContent = String(steps);
    levelEl.textContent = String(level);
    moving = false;
    resize();
    if (px === cols - 2 && py === rows - 2) {
      moving = true;
      winScreen.classList.remove("hidden");
      document.getElementById("winText").textContent = "第 " + level + " 关用了 " + steps + " 步，真厉害！";
    } else {
      winScreen.classList.add("hidden");
    }
  }

  function loadLevel(n) {
    level = n;
    bumpMaxLevel(n);
    steps = 0;
    stepsEl.textContent = "0";
    levelEl.textContent = String(n);
    cols = Math.min(15, 7 + (n - 1) * 2);
    rows = Math.min(19, 7 + (n - 1) * 2);
    // 保持奇数
    if (cols % 2 === 0) cols++;
    if (rows % 2 === 0) rows++;
    grid = generate(cols, rows);
    px = 1; py = 1;
    winScreen.classList.add("hidden");
    moving = false;
    resize();
    saveGame();
  }

  function move(dx, dy) {
    if (moving || !grid || quizPaused) return;
    var nx = px + dx, ny = py + dy;
    if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) return;
    if (grid[ny][nx] === 1) return;
    px = nx; py = ny;
    steps++; stepsEl.textContent = String(steps);
    draw();
    saveGame();
    if (px === cols - 2 && py === rows - 2) {
      moving = true;
      setTimeout(function () {
        winScreen.classList.remove("hidden");
        document.getElementById("winText").textContent = "第 " + level + " 关用了 " + steps + " 步，真厉害！";
      }, 350);
    }
  }

  document.querySelectorAll(".dpad button").forEach(function (b) {
    b.addEventListener("click", function () {
      var d = b.dataset.dir;
      if (d === "up") move(0, -1);
      else if (d === "down") move(0, 1);
      else if (d === "left") move(-1, 0);
      else move(1, 0);
    });
  });

  document.addEventListener("keydown", function (e) {
    var k = e.key;
    if (k === "ArrowUp" || k === "w") move(0, -1);
    else if (k === "ArrowDown" || k === "s") move(0, 1);
    else if (k === "ArrowLeft" || k === "a") move(-1, 0);
    else if (k === "ArrowRight" || k === "d") move(1, 0);
    else return;
    e.preventDefault();
  });

  var tsx = 0, tsy = 0;
  cv.addEventListener("touchstart", function (e) {
    var t = e.changedTouches[0]; tsx = t.clientX; tsy = t.clientY;
  }, { passive: true });
  cv.addEventListener("touchend", function (e) {
    var t = e.changedTouches[0];
    var dx = t.clientX - tsx, dy = t.clientY - tsy;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : -1, 0);
    else move(0, dy > 0 ? 1 : -1);
  }, { passive: true });

  document.getElementById("nextBtn").addEventListener("click", function () { loadLevel(level + 1); });
  window.addEventListener("resize", resize);
  var saved = window.GameSave ? GameSave.load(SAVE_KEY, null) : null;
  if (validSave(saved)) restoreLevel(saved);
  else loadLevel(getMaxLevel()); // 存档结构升级/失效时，回到已达最高关而非第 1 关，进度不丢

  // 接入公共定时做题模块：过关弹窗显示时不弹题；遮罩会拦截误操作，无需暂停
  if (window.GameQuiz) {
    GameQuiz.init({
      isPlaying: function () { return winScreen.classList.contains("hidden"); },
      onOpen: function () { quizPaused = true; },
      onClose: function () { quizPaused = false; }
    });
  }
})();
</script>
</body>
</html>
